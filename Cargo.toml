# Workspace root for EarthMesh v3 Rust crates.
# Unifies the eight engine crates under a single lockfile and lets `cargo` commands run
# from the repo root. The Makefile keeps overriding CARGO_TARGET_DIR for the
# mkgrd.x packaging path.
[workspace]
resolver = "2"
members = [
    "rust/earthmesh_core",
    "rust/earthmesh_geometry",
    "rust/earthmesh_hfield",
    "rust/earthmesh_mesh",
    "rust/earthmesh_quality",
    "rust/earthmesh_refine_planner",
    "rust/earthmesh_cli",
    "rust/earthmesh_project",
    # Compatibility ports kept for bit-for-bit verification against the Fortran
    # reference. Built and tested by the workspace; depended on by nothing in
    # the production engine (the dependency edge only points into rust/).
    "rust/earthmesh_refine_redgreen",
]

# Release tuning for the numeric mesh pipeline. Thin LTO + single codegen unit
# lets cross-crate hot loops (refine kernels, spring dynamics, geometry) inline
# and vectorize across the workspace; panic=abort drops unwinding tables (no
# catch_unwind anywhere in the workspace; cargo ignores this for test builds).
# Swap to lto = "fat" for a slightly faster binary at much slower build times.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# Line-table debug info so flamegraphs/backtraces have symbols. No runtime
# cost; only larger binaries and slightly longer builds.
debug = 1
