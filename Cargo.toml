# Workspace root for EarthMesh v3 Rust crates.
# Unifies the eight engine crates under a single lockfile and lets `cargo` commands run
# from the repo root. The Makefile keeps overriding CARGO_TARGET_DIR for the
# mkgrd.x packaging path.
[workspace]
resolver = "2"
members = [
    "rust/earthmesh_core",
    "rust/earthmesh_geometry",
    "rust/earthmesh_hfield",
    "rust/earthmesh_boundary",
    "rust/earthmesh_mesh",
    "rust/earthmesh_quality",
    "rust/earthmesh_refine",
    "rust/earthmesh_refine_planner",
    "rust/earthmesh_refine_method_c",
    "rust/earthmesh_refine_certified",
    "rust/earthmesh_refine_icon_nest",
    "rust/earthmesh_refine_stretch",
    "rust/earthmesh_cli",
    "rust/earthmesh_delivery",
    "rust/earthmesh_inputs",
    "rust/earthmesh_project",
    # The Red-Green backend (`NL%refine_backend = 'red_green'`), reached from
    # the CLI through its adapter, `redgreen_bridge.rs`.
    "rust/earthmesh_refine_redgreen",
]

# Release tuning for the numeric mesh pipeline. Thin LTO + single codegen unit
# lets cross-crate hot loops (refine kernels, spring dynamics, geometry) inline
# and vectorize across the workspace; panic=abort drops unwinding tables (no
# catch_unwind anywhere in the workspace; cargo ignores this for test builds).
# Swap to lto = "fat" for a slightly faster binary at much slower build times.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# Line-table debug info so flamegraphs/backtraces have symbols. No runtime
# cost; only larger binaries and slightly longer builds.
debug = 1

# The certified backend's frozen N12 snapshot tests replay a research probe
# that is pure single-threaded arithmetic: 289 s and 267 s unoptimized, 17 s
# each optimized -- two thirds of `make test-fast` and of CI's fast job.
# Optimizing this one crate in dev/test builds keeps debug assertions and
# overflow checks on (opt-level does not touch them) and changes no result:
# Rust has no fast-math, and the snapshots still match byte for byte.
[profile.dev.package.earthmesh_refine_certified]
opt-level = 2

# The same for the rest of the numeric stack. CI's heavy job spent 41.5 of
# its 46.5 minutes running the CLI tests, eight end-to-end binaries most of
# it: one Method-C pipeline test alone ran 9 minutes, sampled in Method-C's
# nest spring and in iterator and rayon adapters that an unoptimized build
# does not inline. Optimizing the library crates and every dependency keeps
# assertions and overflow checks, changes no result, and costs compile time
# once per build; the CLI crate itself stays unoptimized, because its
# integration tests are ~150 binaries that would each pay the optimizer.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.earthmesh_core]
opt-level = 2
[profile.dev.package.earthmesh_geometry]
opt-level = 2
[profile.dev.package.earthmesh_hfield]
opt-level = 2
[profile.dev.package.earthmesh_boundary]
opt-level = 2
[profile.dev.package.earthmesh_mesh]
opt-level = 2
[profile.dev.package.earthmesh_quality]
opt-level = 2
[profile.dev.package.earthmesh_refine]
opt-level = 2
[profile.dev.package.earthmesh_refine_method_c]
opt-level = 2
[profile.dev.package.earthmesh_refine_redgreen]
opt-level = 2
[profile.dev.package.earthmesh_refine_icon_nest]
opt-level = 2
[profile.dev.package.earthmesh_refine_stretch]
opt-level = 2
[profile.dev.package.earthmesh_inputs]
opt-level = 2
[profile.dev.package.earthmesh_delivery]
opt-level = 2
