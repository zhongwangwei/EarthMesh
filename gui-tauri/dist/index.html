  if(!inv){ add("✗ "+(lang?"无法连接后端":"backend unavailable")); return false; }
  try{
    const r = await inv("kill_run");
    add("■ "+(r?(lang?"已终止正在运行的引擎":"killed the running engine"):(lang?"当前没有正在运行的程序":"no running process")));
    if(r){ setRunControls(false); }
    else { setRunControls(false); }
    const rt=document.getElementById("rtext"); if(rt) rt.textContent=r?(lang?"已终止":"killed"):(lang?"未在运行":"not running");
    return true;
  }catch(e){ add("✗ kill: "+e); return false; }
}

/* ---------------- toggles ---------------- */
document.getElementById("themeBtn").onclick=function(){
  const r=document.documentElement, dark=r.getAttribute("data-theme")==="dark";
  r.setAttribute("data-theme",dark?"light":"dark"); this.textContent=dark?"🌙":"☀️"; drawMap();
};
document.getElementById("langSeg").onclick=e=>{const b=e.target.closest("[data-lang]");if(!b)return;
  document.querySelectorAll("#langSeg button").forEach(x=>x.classList.toggle("on",x===b));
  lang=b.dataset.lang==="zh"?1:0; applyI18n();};
let expertMode=false;
function setExpertMode(on){
  expertMode=!!on;
  document.body.classList.toggle("normal",!expertMode);
  document.body.classList.toggle("expert-mode",expertMode);
  document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.toggle("on",(x.dataset.mode==="expert")===expertMode));
}
setExpertMode(false);
document.getElementById("modeSeg").onclick=e=>{const b=e.target.closest("[data-mode]");if(!b)return;setExpertMode(b.dataset.mode==="expert");};
document.getElementById("liveTabs").onclick=e=>{const b=e.target.closest("[data-pane]");if(!b)return;
  document.querySelectorAll("#liveTabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".live-pane").forEach(p=>p.classList.toggle("on",p.dataset.pane===b.dataset.pane));};
function backendUnavailableRun(){
  document.getElementById("rdot").classList.remove("on");
  document.getElementById("rtext").textContent=lang?"无法连接后端":"backend unavailable";
  document.querySelectorAll("#liveTabs button").forEach(x=>x.classList.toggle("on",x.dataset.pane==="log"));
  document.querySelectorAll(".live-pane").forEach(p=>p.classList.toggle("on",p.dataset.pane==="log"));
  clearLog();
  setLogStatus(lang?"无法连接后端":"backend unavailable", false);
}

/* ---------------- resizable rail / map panels (draggable splitters) ---------------- */
function setupSplitters(){
  const root=document.documentElement;
  try{ const rw=localStorage.getItem("em.railW"); if(rw) root.style.setProperty("--rail-w",rw); }catch(e){}
  try{ const lw=localStorage.getItem("em.liveW"); if(lw) root.style.setProperty("--live-w",lw); }catch(e){}
  const mk=(parent,side)=>{
    if(!parent||parent.querySelector(":scope > .splitter")) return;
    parent.style.position="relative";
    const s=document.createElement("div");
    s.className="splitter";
    s.style.cssText="position:absolute;top:0;bottom:0;"+side+":-3px;width:7px;cursor:col-resize;z-index:30";
    parent.appendChild(s);
    s.addEventListener("mousedown",ev0=>{
      ev0.preventDefault(); s.classList.add("drag"); document.body.style.userSelect="none";
      const move=ev=>{
        if(side==="right"){ // left rail: width = pointer X
          const w=Math.max(180,Math.min(460,ev.clientX));
          root.style.setProperty("--rail-w",w+"px"); try{localStorage.setItem("em.railW",w+"px");}catch(e){}
        }else{ // map panel (drag its left edge): width grows leftward
          const w=Math.max(280,Math.min(Math.round(window.innerWidth*0.6),window.innerWidth-ev.clientX));
          root.style.setProperty("--live-w",w+"px"); try{localStorage.setItem("em.liveW",w+"px");}catch(e){}
          if(typeof drawMap==="function") drawMap();
        }
      };
      const up=()=>{s.classList.remove("drag");document.body.style.userSelect="";document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);};
      document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    });
  };
  mk(document.querySelector(".rail"),"right");
  mk(document.querySelector(".live"),"left");
}

renderSteps(); renderStep(cur); drawMap(); applyI18n(); setupSplitters();
</script>

<script>
/* ============================================================================
   EarthMesh Studio — Tauri backend bridge.
   Active ONLY inside the Tauri webview (window.__TAURI__ present). In a plain
   browser this whole block is a no-op, so this file still opens standalone as
   the static frontend shell. Classic script tags share one global lexical scope, so
   we read/override the frontend globals tpl / resVal / resUnitIdx / TPL / cur /
   renderStep / renderSteps here.

   Model: everything derives from the UI except per-layer file edits, which we
   track in `layerEdits` and re-apply when composing the canonical YAML. Rust is
   the single source of truth for the project schema — the frontend never builds
   it by hand.
   ============================================================================ */
(function () {
  if (!(window.__TAURI__ && window.__TAURI__.core)) return;
  const invoke = window.__TAURI__.core.invoke;

  function currentResolution() {
    try {
      if (typeof resUnitIdx !== "undefined" && typeof resVal !== "undefined") {
        if (resUnitIdx === 1) return { nxp: Math.round(resVal), approxKm: null, approxDegree: null };
        if (resUnitIdx === 2) return { nxp: null, approxKm: null, approxDegree: resVal };
        return { nxp: null, approxKm: resVal, approxDegree: null };
      }
    } catch (e) {}
    return { nxp: 40, approxKm: null, approxDegree: null };
  }
  function currentNxp() {
    if (lastSummary && lastSummary.effective_nxp != null) return lastSummary.effective_nxp;
    const r = currentResolution();
    if (r.nxp != null) return r.nxp;
    if (r.approxDegree > 0) return kmToNxp(r.approxDegree*KM_PER_DEG_EQ);
    return r.approxKm > 0 ? kmToNxp(r.approxKm) : 0;
  }
  function currentResolutionLabel() {
    const r = currentResolution();
    if (r.nxp != null) return "NXP=" + r.nxp + " (≈" + nxpToKm(r.nxp).toFixed(1) + " km)";
    if (r.approxDegree != null) {
      const km = r.approxDegree * KM_PER_DEG_EQ;
      return r.approxDegree + "° (≈" + km.toFixed(1) + " km, NXP≈" + kmToNxp(km) + ")";
    }
    if (r.approxKm != null) return r.approxKm + " km (NXP≈" + kmToNxp(r.approxKm) + ")";
    return "NXP=" + currentNxp();
  }
  function regionalDefaultRefineLevel(nxp) {
    if (nxp >= 192) return 3;
    if (nxp >= 64) return 2;
    return 1;
  }
  function regionalMethodCLevelCap(nxp) {
    let cap = 1;
    while (cap < METHOD_C_MAX_REFINEMENT_LEVEL && METHOD_C_MIN_BASE_NXP * Math.pow(2, cap + 1) <= nxp) cap++;
    return cap;
  }
  function currentIntent() {
    try { return (TPL[tpl] && TPL[tpl].intent) || "Custom"; } catch (e) { return "Custom"; }
  }
  function projectName() {
    const el = document.querySelector(".proj-name");
    if (el) return el.value.trim();
    return "earthmesh-project";
  }
  const zh = () => (typeof lang !== "undefined" && lang) ? true : false;

  // ---- live project model ----------------------------------------------------
  const layerEdits = {};   // layer id -> { path, enabled }
  const thresholdEdits = {}; // threshold layer id -> number|null (null = catalog default)
  let domainEdit = null;   // null | {kind:'global'} | {kind:'bbox', w,e,s,n,seaRatio} | {kind:'hidden', shape}
  let qualityEdit = null;  // null | { minAngle, policy }
  let cellEdit = null;     // null | "hex" | "tri"; null means template default
let expertEdit = { enabled: false, nxp: null, openmp: null, niter: null, niterRefine: null, maxIterSpc: null, maxIterCal: null, halo: null, maxTransitionRow: null, setDisType: null, numRc: null, vertexPretectLayers: null, springStrategy: null, beta: null, relax: null, weakConcavEliminate: true };
  let specifiedRefine = { enabled: false, kind: "radius", lon: null, lat: null, radiusKm: null, w: null, e: null, s: null, n: null, path: null, hfieldEnabled: true, hfieldG: null, hfieldMaxLevel: null, hfieldBaseM: null };
  let metadataEdit = { authors: [], description: "" };
  let baseProjectYaml = null; // opened YAML; preserves fields the UI does not expose yet
  let projectActive = false; // a project has been created/opened this session → show the summary
  let lastSummary = null;    // cached ProjectSummary (+ _valid/_err) for the summary panel
  let _lastQuality = null;   // cached mesh_quality, shown again when step 6 rebuilds
  // maxPasses is owned by the static step renderer; the Tauri bridge reads/writes it here.

  // Refinement runs only if at least one criterion has a data file — otherwise
  // a uniform mesh (which needs no NetCDF input and always runs).
  function hasEnabledThresholdLayer(summary) {
    // Only THRESHOLD criteria drive refinement. The landcover (the land/sea MASK
    // source) and hydro inputs must NOT flip refinement on — doing so is what sent
    // a data-less land/ocean run down the refine path and failed.
    return ((summary && summary.layers) || []).some((l) =>
      l.role_kind === "threshold" && !!l.path && !!l.enabled);
  }

  async function composeYaml() {
    const resolution = currentResolution();
    let yaml = await invoke("scaffold_project",
      { name: projectName(), intent: currentIntent(), nxp: resolution.nxp, approxKm: resolution.approxKm, approxDegree: resolution.approxDegree });
    yaml = await invoke("set_project_metadata",
      { yaml, name: projectName(), authors: metadataEdit.authors || [], description: metadataEdit.description || "" });
    // Derive the domain from the LIVE mode + controls — not a stale domainEdit
    // (template cards flip `regional`/`domainMode` without updating domainEdit).
    const mode = (typeof domainMode !== "undefined") ? domainMode : ((typeof regional !== "undefined" && regional) ? "regional" : "global");
    if (mode === "global") {
      yaml = await invoke("set_domain_global", { yaml });
    } else if (mode === "watershed") {
      const path = (domainEdit && domainEdit.kind === "shapefile" ? domainEdit.path : watershedPath) || "";
      const seaRatio = domainEdit && domainEdit.kind === "shapefile" ? (domainEdit.seaRatio ?? null) : null;
      yaml = await invoke("set_domain_shapefile", { yaml, path, seaRatio });
    } else if (mode === "close") {
      const path = (domainEdit && domainEdit.kind === "close" ? domainEdit.path : closePath) || "";
      const format = (domainEdit && domainEdit.kind === "close" ? domainEdit.format : closeFormat) || "polygon_shp";
      const seaRatio = domainEdit && domainEdit.kind === "close" ? (domainEdit.seaRatio ?? null) : null;
      yaml = await invoke("set_domain_close", { yaml, path, format, seaRatio });
    } else {
      const b = (typeof domBbox !== "undefined" && domBbox) ? domBbox : DEFAULT_BBOX;
      const seaRatio = domainEdit && domainEdit.kind === "bbox" ? (domainEdit.seaRatio ?? null) : null;
      yaml = await invoke("set_domain_bbox", { yaml, w: b[0], e: b[1], s: b[2], n: b[3], seaRatio });
    }
    for (const id of Object.keys(layerEdits)) {
      const e = layerEdits[id];
      try { yaml = await invoke("set_layer_path", { yaml, id, path: e.path, enabled: e.enabled }); }
      catch (err) { /* id not in this preset's layer set — skip */ }
    }
    for (const id of Object.keys(thresholdEdits)) {
      try { yaml = await invoke("set_threshold_value", { yaml, id, value: thresholdEdits[id] }); }
      catch (err) { /* id not in this preset's layer set — skip */ }
    }
    if (baseProjectYaml) {
      yaml = await invoke("preserve_unexposed_project_fields", { baseYaml: baseProjectYaml, yaml, preserveDomain: !!hiddenDomainShape });
    }
    if (cellEdit) {
      yaml = await invoke("set_target_cell", { yaml, cell: cellEdit });
    }
    const spring = springTypesFor(expertEdit.springStrategy);
    const legacyBackend = specifiedRefine.hfieldEnabled === false;
    yaml = await invoke("set_expert", {
      yaml, nxp: null, openmp: expertEdit.openmp, niter: expertEdit.niter,
      niterRefine: expertEdit.niterRefine ?? defaultOlamSpringNestIterations(cellEdit), maxIterSpc: expertEdit.maxIterSpc, maxIterCal: expertEdit.maxIterCal,
      halo: legacyBackend ? expertEdit.halo : null,
      maxTransitionRow: legacyBackend ? expertEdit.maxTransitionRow : null,
      setDisType: legacyBackend ? expertEdit.setDisType : null,
      numRc: legacyBackend ? expertEdit.numRc : null,
      vertexPretectLayers: legacyBackend ? expertEdit.vertexPretectLayers : null,
      springGlobalType: spring.springGlobalType, springRegionalType: spring.springRegionalType,
      beta: expertEdit.beta, relax: expertEdit.relax,
      weakConcavEliminate: legacyBackend ? true : null
    });
    const summary = await invoke("project_summary", { yaml });
    const thresholdRefine = hasEnabledThresholdLayer(summary);
    const refinementEnabled = thresholdRefine || !!specifiedRefine.enabled;
    const maxRefinePasses = summary.domain === "regional" ? regionalMethodCLevelCap(summary.effective_nxp ?? currentNxp()) : 9;
    const refinementPasses = refinementEnabled
      ? Math.min(maxRefinePasses, Math.max(1, maxPasses == null ? (summary.max_passes || 1) : maxPasses))
      : 0;
    yaml = await invoke("set_refinement", { yaml, enabled: refinementEnabled, maxPasses: refinementPasses });
    yaml = await invoke("set_specified_refinement", {
      yaml, enabled: !!specifiedRefine.enabled,
      kind: specifiedRefine.kind || "radius",
      lon: specifiedRefine.lon, lat: specifiedRefine.lat, radiusKm: specifiedRefine.radiusKm,
      w: specifiedRefine.w, e: specifiedRefine.e, s: specifiedRefine.s, n: specifiedRefine.n,
      path: specifiedRefine.path
    });
    yaml = await invoke("set_hfield_refinement", {
      yaml, enabled: specifiedRefine.hfieldEnabled !== false,
      g: specifiedRefine.hfieldG ?? null,
      maxLevel: specifiedRefine.hfieldMaxLevel ?? null,
      baseM: specifiedRefine.hfieldBaseM ?? null
    });
    if (qualityEdit) {
      yaml = await invoke("set_quality",
        { yaml, minAngleDeg: qualityEdit.minAngle, policy: qualityEdit.policy });
    }
    return yaml;
  }

  const api = {
    listCriteria: () => invoke("list_criteria"),
    validate:   (yaml) => invoke("validate_project", { yaml }),
    summary:    (yaml) => invoke("project_summary", { yaml }),
    setTargetCell: (yaml, cell) => invoke("set_target_cell", { yaml, cell }),
    setDomainShapefile: (yaml, path, seaRatio) => invoke("set_domain_shapefile", { yaml, path, seaRatio }),
    setDomainClose: (yaml, path, format, seaRatio) => invoke("set_domain_close", { yaml, path, format, seaRatio }),
    shapefileBoundary: (path) => invoke("shapefile_boundary_geojson", { path }),
    setExpert: (yaml, nxp, openmp, niter, niterRefine, maxIterSpc, maxIterCal, halo, maxTransitionRow, setDisType, numRc, vertexPretectLayers, springGlobalType, springRegionalType, beta, relax, weakConcavEliminate) =>
      invoke("set_expert", { yaml, nxp, openmp, niter, niterRefine, maxIterSpc, maxIterCal, halo, maxTransitionRow, setDisType, numRc, vertexPretectLayers, springGlobalType, springRegionalType, beta, relax, weakConcavEliminate }),
    setSpecifiedRefinement: (yaml, enabled, kind, lon, lat, radiusKm, w, e, s, n, path) =>
      invoke("set_specified_refinement", { yaml, enabled, kind, lon, lat, radiusKm, w, e, s, n, path }),
    pickDataFile: () => invoke("pick_data_file"),
    pickDataFolder: () => invoke("pick_data_folder"),
    autofillLayers: (yaml, folder) => invoke("autofill_data_layers_from_folder", { yaml, folder }),
    openProject:  () => invoke("open_project"),
    saveProject:  (yaml) => invoke("save_project", { yaml }),
    runProject:   (yaml, outdir) => invoke("run_project", { yaml, outdir: outdir || null }),
  };

  function clearCoastalOverlay() {
    if (typeof _coastalGeojson !== "undefined") _coastalGeojson = null;
    if (typeof drawMap === "function") drawMap();
  }
  function meshMeritLayer(summary) {
    return summary && (summary.layers || []).find((l) => l.role_kind === "merit" && l.enabled && l.path);
  }
  function meshLandcoverLayer(summary) {
    return summary && (summary.layers || []).find((l) => l.role_kind === "landcover" && l.enabled && l.path);
  }

  function logLine(txt) {
    const box = document.getElementById("logbox") || document.querySelector('.live-pane[data-pane="log"]');
    if (box) {
      const div = document.createElement("div");
      div.style.whiteSpace = "pre-wrap";
      div.textContent = txt;
      box.appendChild(div);
    }
    console.log("[EarthMesh]", txt);
  }

  let watershedBoundaryPath = "";
  async function loadWatershedBoundary(path) {
    if (!path) {
      watershedBoundaryPath = "";
      if (typeof applyDomainBoundary === "function") applyDomainBoundary(null, false);
      return;
    }
    if (path === watershedBoundaryPath && _domainGeojson) return;
    watershedBoundaryPath = path;
    try {
      const geojson = await api.shapefileBoundary(path);
      if (typeof applyDomainBoundary === "function") applyDomainBoundary(geojson, true);
    } catch (e) {
      watershedBoundaryPath = "";
      if (typeof applyDomainBoundary === "function") applyDomainBoundary(null, false);
      logLine("✗ watershed boundary: " + e);
    }
  }

  // Clear startup placeholders so no stale values show before a real run.
  function clearStartupPlaceholders() {
    const lb = document.getElementById("logbox"); if (lb) lb.textContent = "";
    clearRunArtifacts();
  }

  function clearRunArtifacts() {
    hasRun = false;
    runInfo = null;
    _lastQuality = null;
    if (typeof applyMesh === "function") applyMesh(null);
    if (typeof _coastalGeojson !== "undefined") _coastalGeojson = null;
    document.querySelectorAll('.live-pane[data-pane="quality"] .mini-metric b')
      .forEach((b) => { b.textContent = "—"; b.style.color = "var(--muted)"; });
    document.querySelectorAll(".badge.pass").forEach((b) => { b.style.display = "none"; });
  }

  window.resetTemplateDerivedState = function () {
      for (const id of Object.keys(layerEdits)) delete layerEdits[id];
      for (const id of Object.keys(thresholdEdits)) delete thresholdEdits[id];
      baseProjectYaml = null;
      domainEdit = null;
      qualityEdit = null;
      lastSummary = null;
      cellEdit = null;
      maxPasses = null;
      const t = (typeof TPL !== "undefined" && TPL[tpl]) ? TPL[tpl] : {};
      if (t.nxp) { resUnitIdx = 1; resVal = t.nxp; }
      if (t.domainMode) {
        domainMode = t.domainMode;
        regional = domainMode !== "global";
      }
      if (t.closePath) {
        closePath = t.closePath;
        closeFormat = t.closeFormat || inferCloseFormat(t.closePath);
        domainEdit = { kind: "close", path: closePath, format: closeFormat, seaRatio: null };
      }
      if (t.maxPasses) maxPasses = t.maxPasses;
      if (t.specifiedClosePath) {
        specifiedRefine = { enabled: true, kind: "close", lon: null, lat: null, radiusKm: null, w: null, e: null, s: null, n: null, path: t.specifiedClosePath };
      } else {
        specifiedRefine = { enabled: false, kind: "radius", lon: null, lat: null, radiusKm: null, w: null, e: null, s: null, n: null, path: null, hfieldEnabled: true, hfieldG: null, hfieldMaxLevel: null, hfieldBaseM: null };
      }
      if (typeof clearCoastalOverlay === "function") clearCoastalOverlay();
      clearRunArtifacts();
  };

  // ---- live data-layer panel ------------------------------------------------
  // Replace the static step-3 table body with rows from the live ProjectConfig;
  // each Browse opens the native picker and writes back via set_layer_path.
  async function enhanceLayerStep() {
    const table = document.querySelector("#work table.layers");
    if (!table) return;
    let sum;
    try { sum = await api.summary(await composeYaml()); }
    catch (e) { logLine("✗ layers: " + e); return; }
    clearCoastalOverlay();
    const tbody = table.querySelector("tbody");
    if (!tbody) return;
    const z = zh();
    tbody.textContent = "";
    sum.layers.forEach((l) => {
      const tr = document.createElement("tr");
      tr.dataset.layer = l.id;
      tr.dataset.folder = l.wants_folder ? "1" : "0";
      tr.dataset.path = l.path || "";
      tr.dataset.enabled = l.enabled ? "1" : "0";

      const swCell = document.createElement("td");
      const sw = document.createElement("div");
      sw.className = "sw" + (l.enabled && l.path ? " on" : "");
      sw.title = z ? "启用/禁用该图层" : "enable/disable layer";
      sw.style.cursor = l.path ? "pointer" : "default";
      swCell.appendChild(sw);

      const idCell = document.createElement("td");
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = "var(--accent)";
      const id = document.createElement("b");
      id.textContent = l.id;
      idCell.append(dot, id);
      if (l.wants_folder) {
        const tag = document.createElement("span");
        tag.style.cssText = "color:var(--muted);font-size:11px";
        tag.textContent = " · " + (z ? "分块目录" : "tiled dir");
        idCell.appendChild(tag);
      }

      const roleCell = document.createElement("td");
      roleCell.style.color = "var(--muted)";
      roleCell.textContent = l.role;

      const pathCell = document.createElement("td");
      if (l.path) {
        const path = document.createElement("span");
        path.className = "path";
        path.textContent = l.path;
        const clear = document.createElement("span");
        clear.className = "btn-ghost em-clear";
        clear.style.cssText = "padding:2px 7px;cursor:pointer";
        clear.textContent = "✕";
        pathCell.append(path, " ", clear);
      } else {
        const browse = document.createElement("span");
        browse.className = "btn-ghost em-browse";
        browse.style.cssText = "padding:3px 9px;cursor:pointer";
        browse.textContent = l.wants_folder ? (z ? "📁 选择文件夹" : "📁 Browse folder") : (z ? "📂 浏览" : "📂 Browse");
        pathCell.appendChild(browse);
      }

      const statusCell = document.createElement("td");
      const cov = document.createElement("span");
      cov.className = "cov " + (l.path ? "ok" : "no");
      cov.textContent = l.path ? (z ? "已选择" : "selected") : (z ? "未设置·判据禁用" : "unset · off");
      statusCell.appendChild(cov);

      tr.append(swCell, idCell, roleCell, pathCell, statusCell);
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll(".em-browse").forEach((b) => {
      b.onclick = async () => {
        const tr = b.closest("[data-layer]");
        const id = tr.dataset.layer;
        const folder = tr.dataset.folder === "1";
        let p;
        try { p = await (folder ? api.pickDataFolder() : api.pickDataFile()); }
        catch (e) { logLine("✗ " + e); return; }
        if (!p) return;
        layerEdits[id] = { path: p, enabled: true };
        enhanceLayerStep();
      };
    });
    tbody.querySelectorAll(".em-clear").forEach((b) => {
      b.onclick = () => {
        const id = b.closest("[data-layer]").dataset.layer;
        layerEdits[id] = { path: "", enabled: false };
        enhanceLayerStep();
      };
    });
    // on/off switch: enable/disable a layer that already has a file set
    tbody.querySelectorAll("tr[data-layer] .sw").forEach((sw) => {
      sw.onclick = () => {
        const tr = sw.closest("[data-layer]");
        const id = tr.dataset.layer;
        const path = tr.dataset.path || "";
        if (!path) return; // nothing to toggle without a file
        layerEdits[id] = { path, enabled: tr.dataset.enabled !== "1" };
        enhanceLayerStep();
      };
    });
    const auto = document.getElementById("autoLayerFolder");
    if (auto) auto.onclick = async () => {
      let folder;
      try { folder = await api.pickDataFolder(); }
      catch (e) { logLine("✗ " + e); return; }
      if (!folder) return;
      let yaml, next;
      try {
        yaml = await api.autofillLayers(await composeYaml(), folder);
        next = await api.summary(yaml);
      } catch (e) { logLine("✗ " + e); return; }
      for (const k of Object.keys(layerEdits)) delete layerEdits[k];
      for (const k of Object.keys(thresholdEdits)) delete thresholdEdits[k];
      (next.layers || []).forEach((l) => { if (l.path) layerEdits[l.id] = { path: l.path, enabled: l.enabled }; });
      (next.layers || []).forEach((l) => { if (l.threshold_value != null) thresholdEdits[l.id] = l.threshold_value; });
      logLine((z ? "✓ 已匹配数据文件夹 " : "✓ matched data folder ") + folder);
      enhanceLayerStep();
    };
    const card = table.closest(".card");
    const ch = card && card.querySelector(".ch");
    if (ch) ch.textContent = (z ? "实时映射 ProjectConfig.data_layers · " : "live ProjectConfig.data_layers · ")
      + sum.layers.length + (z ? " 个图层" : " layers");
  }

  // ---- domain (step 2) -> DomainConfig --------------------------------------
  const num = (el) => parseFloat(String(el.value).replace(/[^\d.\-]/g, ""));
  function readBbox() {
    const ins = document.querySelectorAll("#work .grid2 input.input"); // [W,E,S,N]
    if (ins.length < 4) return null;
    const b = { w: num(ins[0]), e: num(ins[1]), s: num(ins[2]), n: num(ins[3]) };
    return Object.values(b).every((x) => !isNaN(x)) ? b : null;
  }
  function enhanceDomainStep() {
    // The base UI owns the Global/Regional toggle (var `regional`) and only
    // renders the bbox inputs in regional mode; we mirror that into domainEdit.
    if (hiddenDomainShape && domainEdit && domainEdit.kind === "hidden") return;
    const mode = (typeof domainMode !== "undefined") ? domainMode : ((typeof regional !== "undefined" && regional) ? "regional" : "global");
    if (mode === "global") { domainEdit = { kind: "global" }; loadWatershedBoundary(""); return; }
    const ratio = document.getElementById("seaRatioInput");
    const ratioText = document.getElementById("seaRatioText");
    const readSeaRatio = () => {
      if (!ratio) return (domainEdit && (domainEdit.kind === "bbox" || domainEdit.kind === "shapefile" || domainEdit.kind === "close")) ? domainEdit.seaRatio : null;
      const v = parseFloat(ratio.value);
      return isNaN(v) ? null : v / 100;
    };
    const paintSeaRatio = () => {
      if (ratioText && ratio) ratioText.textContent = ratio.value + "% " + (zh() ? "海洋" : "ocean");
    };
    if (mode === "watershed") {
      const browse = document.getElementById("watershedBrowse");
      const text = document.getElementById("watershedPathText");
      const syncShape = () => {
        const path = (typeof watershedPath !== "undefined" ? watershedPath : "") || "";
        if (path) domainEdit = { kind: "shapefile", path, seaRatio: readSeaRatio() };
        if (text) text.textContent = path ? "📄 " + path : (zh() ? "📄 点击选择 .shp 文件" : "📄 Choose a .shp file");
        paintSeaRatio();
      };
      if (domainEdit && domainEdit.kind === "shapefile") {
        watershedPath = domainEdit.path || "";
        if (ratio && domainEdit.seaRatio != null) ratio.value = Math.round(domainEdit.seaRatio * 100);
      }
      syncShape();
      loadWatershedBoundary(watershedPath);
      if (browse) browse.onclick = async () => {
        let p; try { p = await api.pickDataFile(); } catch (e) { logLine("✗ " + e); return; }
        if (!p) return;
        watershedPath = p;
        domainEdit = { kind: "shapefile", path: p, seaRatio: readSeaRatio() };
        clearRunArtifacts();
        syncShape();
        await loadWatershedBoundary(p);
        await refreshSummary();
      };
      if (ratio) ratio.addEventListener("input", () => {
        if (watershedPath) domainEdit = { kind: "shapefile", path: watershedPath, seaRatio: readSeaRatio() };
        paintSeaRatio();
      });
      return;
    }
    if (mode === "close") {
      const browse = document.getElementById("closeBrowse");
      const text = document.getElementById("closePathText");
      const syncClose = () => {
        const path = (typeof closePath !== "undefined" ? closePath : "") || "";
        if (path) closeFormat = inferCloseFormat(path);
        if (path) domainEdit = { kind: "close", path, format: closeFormat, seaRatio: readSeaRatio() };
        if (text) text.textContent = path ? "📄 " + path : (zh() ? "📄 点击选择文件" : "📄 Choose file");
        paintSeaRatio();
        loadWatershedBoundary(closeFormat === "polygon_shp" ? path : "");
      };
      if (domainEdit && domainEdit.kind === "close") {
        closePath = domainEdit.path || "";
        closeFormat = domainEdit.format || "polygon_shp";
        if (ratio && domainEdit.seaRatio != null) ratio.value = Math.round(domainEdit.seaRatio * 100);
      }
      syncClose();
      if (browse) browse.onclick = async () => {
        let p; try { p = await api.pickDataFile(); } catch (e) { logLine("✗ " + e); return; }
        if (!p) return;
        closePath = p;
        closeFormat = inferCloseFormat(p);
        domainEdit = { kind: "close", path: p, format: closeFormat, seaRatio: readSeaRatio() };
        clearRunArtifacts();
        syncClose();
        await refreshSummary();
      };
      if (ratio) ratio.addEventListener("input", () => {
        if (closePath) domainEdit = { kind: "close", path: closePath, format: closeFormat, seaRatio: readSeaRatio() };
        paintSeaRatio();
      });
      return;
    }
    const sync = () => {
      loadWatershedBoundary("");
      const b = readBbox();
      if (b) {
        domainEdit = Object.assign({ kind: "bbox", seaRatio: readSeaRatio() }, b);
        domBbox = [b.w, b.e, b.s, b.n];
        paintSeaRatio();
        if (typeof updateEstimate === "function") updateEstimate();
        if (typeof drawMap === "function") drawMap();
        if (typeof clearCoastalOverlay === "function") clearCoastalOverlay();
      }
    };
    if (domainEdit && domainEdit.kind === "bbox") {
      const ins = document.querySelectorAll("#work .grid2 input.input");
      if (ins.length >= 4) { ins[0].value = domainEdit.w; ins[1].value = domainEdit.e; ins[2].value = domainEdit.s; ins[3].value = domainEdit.n; }
      if (ratio && domainEdit.seaRatio != null) ratio.value = Math.round(domainEdit.seaRatio * 100);
    } else {
      sync(); // initialize from the shown default inputs
    }
    document.querySelectorAll("#work .grid2 input.input").forEach((inp) => inp.addEventListener("input", sync));
    if (ratio) ratio.addEventListener("input", sync);
    paintSeaRatio();
  }

  // ---- quality (step 5) -> QualityConfig ------------------------------------
  async function enhanceQualityStep() {
    const sel = document.querySelector("#work .card select.select"); // on-violation
    const minIn = document.querySelector("#work .quality-detail input.input"); // min angle
    if (!qualityEdit) {
      const s = await refreshSummary();
      if (s) qualityEdit = { minAngle: s.min_angle_deg, policy: s.on_violation || "warn" };
    }
    const readQ = () => {
      let minAngle = 0, policy = "warn";
      if (minIn) { const v = num(minIn); if (minIn.value.trim() && !isNaN(v)) minAngle = v; }
      if (sel) policy = ["warn", "block", "auto_refine"][sel.selectedIndex] || "warn";
      return { minAngle, policy };
    };
    const update = () => { qualityEdit = readQ(); };
    if (sel) sel.addEventListener("change", update);
    if (minIn) minIn.addEventListener("input", update);
    if (qualityEdit) {
      if (minIn) minIn.value = qualityEdit.minAngle + "°";
      if (sel) sel.selectedIndex = qualityEdit.policy === "auto_refine" ? 2 : (qualityEdit.policy === "block" ? 1 : 0);
    }
  }

  // ---- refinement (step 4) -> template's criteria ---------------------------
  // Render the criteria the selected template uses (its threshold layers),
  // greying out any whose data layer isn't set, plus the max-passes control.
  async function enhanceRefinementStep() {
    const critCard = document.querySelector("#work .card");
    if (!critCard) return;
    let sum, cat;
    try { sum = await api.summary(await composeYaml()); cat = await api.listCriteria(); }
    catch (e) { logLine("✗ refinement: " + e); return; }
    if (maxPasses == null) maxPasses = sum.max_passes;
    const byStem = {}; cat.forEach((c) => { byStem[c.stem] = c; });
    const crits = sum.layers.filter((l) => l.role_kind === "threshold");
    const z = zh();
    const criterionRow = (l) => {
      const c = byStem[l.id] || { label: l.id, unit: "", physical_process: "", help: "", default_value: null, range_min: null, range_max: null };
      const hasData = !!l.path;
      const on = hasData && l.enabled;
      const thValue = thresholdEdits[l.id] ?? l.threshold_value ?? c.default_value;
      const row = document.createElement("div");
      row.className = "em-crit";
      row.dataset.crit = l.id;
      row.dataset.has = hasData ? "1" : "0";
      row.dataset.path = l.path || "";
      row.dataset.enabled = l.enabled ? "1" : "0";
      row.style.cssText = "display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;opacity:" + (hasData ? "1" : "0.55");
      const tog = document.createElement("div");
      tog.className = "em-tog";
      tog.style.cssText = "width:38px;height:22px;border-radius:999px;flex:none;position:relative;background:" + (on ? "var(--accent)" : "var(--border)") + ";cursor:" + (hasData ? "pointer" : "not-allowed");
      const knob = document.createElement("div");
      knob.style.cssText = "position:absolute;top:2px;left:" + (on ? "18px" : "2px") + ";width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s";
      tog.appendChild(knob);
      const text = document.createElement("div");
      text.style.cssText = "flex:1;min-width:0";
      const label = document.createElement("div");
      label.style.cssText = "font-weight:650;font-size:14px";
      label.textContent = c.label;
      const help = document.createElement("div");
      help.style.cssText = "color:var(--muted);font-size:11.5px;margin-top:1px";
      help.textContent = (c.physical_process || c.help || "") + (c.unit ? " · " + c.unit : "");
      text.append(label, help);
      const badge = document.createElement("span");
      badge.style.cssText = "font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;flex:none;background:" + (hasData ? "color-mix(in srgb,var(--pass) 18%,transparent)" : "var(--border)") + ";color:" + (hasData ? "var(--pass)" : "var(--muted)");
      badge.textContent = hasData ? (z ? "数据 ✓" : "data ✓") : (z ? "缺数据·禁用" : "no data");
      const th = document.createElement("input");
      th.className = "input em-threshold";
      th.type = "number";
      th.step = "any";
      th.style.cssText = "width:96px;flex:none";
      th.disabled = !hasData;
      if (Number.isFinite(c.range_min)) th.min = c.range_min;
      if (Number.isFinite(c.range_max)) th.max = c.range_max;
      if (thValue != null) th.value = thValue;
      th.title = z ? "判据阈值；留空使用默认值" : "criterion threshold; blank uses default";
      row.append(tog, text, th, badge);
      return row;
    };

    const regionalRefine = sum.domain === "regional";
    const nMax = regionalRefine ? regionalMethodCLevelCap(sum.effective_nxp ?? currentNxp()) : 9;
    const refinementEnabled = hasEnabledThresholdLayer(sum) || !!specifiedRefine.enabled;
    if (refinementEnabled) {
      if (maxPasses > nMax) maxPasses = nMax;
      if (maxPasses < 1) maxPasses = 1;
    }
    const shownPasses = Math.min(nMax, Math.max(1, maxPasses || 1));
    const shownSpcPasses = Math.min(nMax, Math.max(1, expertEdit.maxIterSpc ?? shownPasses));
    const shownCalPasses = Math.min(nMax, Math.max(1, expertEdit.maxIterCal ?? shownPasses));
    const fineAt = (n) => (cellKm() / Math.pow(2, n));
    const fmtKm = (v) => v.toFixed(v < 10 ? 2 : 1) + " km";
    const specified = `<div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;background:var(--bg)">
      <div style="font-weight:700;margin-bottom:10px">${z ? "指定细化" : "Specified refinement"}</div>
      <div class="grid2">
        ${field(z?"开关":"Switch",`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="specifiedRefineOn" ${specifiedRefine.enabled ? "checked" : ""}>${z?"启用":"Enable"}</label>`)}
        ${field(z?"形式":"Type",`<select class="select" id="specifiedKind"><option value="radius" ${specifiedRefine.kind === "radius" ? "selected" : ""}>${z?"半径":"Radius"}</option><option value="bbox" ${specifiedRefine.kind === "bbox" ? "selected" : ""}>${z?"指定区域":"Region"}</option><option value="close" ${specifiedRefine.kind === "close" ? "selected" : ""}>${z?"闭合区域 SHP":"Close SHP"}</option></select>`)}
      </div>
      <div class="grid2" id="specifiedRadiusFields" style="margin-top:10px">
        ${field(z?"半径 km":"Radius km",`<input class="input" type="number" id="specifiedRadius" min="0.001" step="1" value="${specifiedRefine.radiusKm ?? 100}">`)}
        ${field(z?"中心经度":"Center lon",`<input class="input" type="number" id="specifiedLon" min="-180" max="180" step="0.01" value="${specifiedRefine.lon ?? 0}">`)}
        ${field(z?"中心纬度":"Center lat",`<input class="input" type="number" id="specifiedLat" min="-90" max="90" step="0.01" value="${specifiedRefine.lat ?? 0}">`)}
      </div>
      <div class="grid2" id="specifiedBboxFields" style="margin-top:10px">
        ${field(z?"西经度":"West lon",`<input class="input" type="number" id="specifiedW" min="-180" max="180" step="0.01" value="${specifiedRefine.w ?? DEFAULT_BBOX[0]}">`)}
        ${field(z?"东经度":"East lon",`<input class="input" type="number" id="specifiedE" min="-180" max="180" step="0.01" value="${specifiedRefine.e ?? DEFAULT_BBOX[1]}">`)}
        ${field(z?"南纬度":"South lat",`<input class="input" type="number" id="specifiedS" min="-90" max="90" step="0.01" value="${specifiedRefine.s ?? DEFAULT_BBOX[2]}">`)}
        ${field(z?"北纬度":"North lat",`<input class="input" type="number" id="specifiedN" min="-90" max="90" step="0.01" value="${specifiedRefine.n ?? DEFAULT_BBOX[3]}">`)}
      </div>
      <div id="specifiedCloseFields" style="margin-top:10px">
        ${field(z?"闭合区域文件":"Close region file",`<div class="browse" id="specifiedCloseBrowse" style="cursor:pointer"><span class="path" id="specifiedClosePathText" style="max-width:none">${specifiedRefine.path ? "📄 "+specifiedRefine.path : (z?"📄 点击选择 .shp 文件":"📄 Choose a .shp file")}</span></div>`)}
      </div>
      <div style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">
          <div><span style="font-weight:650">${z ? "指定细化次数" : "Specified refinement passes"}</span>
          <div style="color:var(--muted);font-size:11px">RL%max_iter_spc</div></div>
          <span style="font-weight:750;font-size:16px;color:var(--accent)"><span id="spcPassVal">${shownSpcPasses}</span> <span id="spcPassFine" style="font-size:11px;color:var(--muted)">→ ≈${fmtKm(fineAt(shownSpcPasses))}</span></span>
        </div>
        <input type="range" id="spcPassRange" min="1" max="${nMax}" value="${shownSpcPasses}" style="width:100%">
        <div style="display:flex;justify-content:space-between;color:var(--faint);font-size:10px;margin-top:3px"><span>1</span><span>${z ? "上限 " : "max "}${nMax}</span></div>
      </div>
    </div>`;
    const backend = specifiedRefine.hfieldEnabled === false ? "legacy" : "hfield";
    const hfieldBlock = `<div class="expert" style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;background:var(--bg)">
      <span class="expert-tag">⚙ ${z ? "专家 — 细化方案" : "EXPERT — refinement backend"}</span>
      <div class="grid2" style="margin-top:10px">
        ${field(z?"细化方案":"Refinement backend",`<select class="select" id="refineBackend"><option value="hfield" ${backend==="hfield"?"selected":""}>${z?"H 场（默认）":"H-field (default)"}</option><option value="legacy" ${backend==="legacy"?"selected":""}>${z?"legacy 硬掩膜":"legacy hard-mask"}</option></select>`,z?"默认 H 场；legacy 只为复现实验":"default H-field; legacy only for parity")}
      </div>
      <div id="hfieldOptions" class="grid2" style="margin-top:10px;${backend==="hfield"?"":"display:none"}">
        ${field(z?"梯度上限 g":"Gradation g",`<input class="input" type="number" id="hfieldG" min="0.01" max="1" step="0.01" value="${specifiedRefine.hfieldG ?? 0.2}">`,z?"默认 0.2；邻胞尺寸比 ≤ 1+g":"default 0.2; neighbor ratio ≤ 1+g")}
        ${field(z?"最大级":"Max level",`<input class="input" type="number" id="hfieldMaxLevel" min="0" max="5" step="1" value="${specifiedRefine.hfieldMaxLevel ?? 0}">`,z?"0 = 自动；上限 5":"0 = auto; max 5")}
        ${field(z?"基准尺寸 m":"Base size m",`<input class="input" type="number" id="hfieldBaseM" min="0" step="1000" placeholder="${Math.round(nxpToKm(currentNxp())*1000)}" value="${specifiedRefine.hfieldBaseM ?? ""}">`,z?"空=自动，按 2πR/(5·NXP)":"blank=auto from 2πR/(5·NXP)")}
      </div>
      <div id="legacyOptions" class="grid2" style="margin-top:10px;${backend==="legacy"?"":"display:none"}">
        <div style="grid-column:1/-1;color:var(--muted);font-size:12px">${z?"legacy 使用旧的指定/阈值硬掩膜，不写 &hfield。以下参数只属于 legacy。":"Legacy uses old specified/threshold hard masks and does not emit &hfield. The controls below are legacy-only."}</div>
        ${field("RL%HALO",`<input class="input" id="expertHalo" placeholder="4,4,3">`,z?"legacy 默认 4,4,3":"legacy default 4,4,3")}
        ${field("RL%max_transition_row",`<input class="input" id="expertMaxTransitionRow" placeholder="4,4,3">`,z?"legacy 默认 4,4,3":"legacy default 4,4,3")}
        ${field("RL%set_dis_type",`<select class="select" id="expertSetDisType"><option value="">${z?"默认 /tmp":"default /tmp"}</option><option value="linear">linear</option><option value="nonlinear1">nonlinear1</option><option value="nonlinear2">nonlinear2</option><option value="nonlinear3">nonlinear3</option></select>`,z?"legacy 距离分布函数":"legacy distance distribution")}
        ${field("RL%num_rc",`<input class="input" type="number" id="expertNumRc" min="0" placeholder="0">`,z?"legacy 默认 0":"legacy default 0")}
        ${field("RL%vertex_pretect_layers",`<input class="input" type="number" id="expertVertexPretectLayers" min="1" placeholder="1">`,z?"legacy 默认 1":"legacy default 1")}
        ${field("RL%weak_concav_eliminate",`<label style="display:flex;gap:8px;align-items:center;height:38px"><input type="checkbox" id="expertWeakConcav" checked disabled> <span>${z?"开启":"On"}</span></label>`,z?"legacy 默认开启；必须开启":"legacy default on; required")}
      </div>
    </div>`;
    const expertRefine = `<div class="expert" style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;background:var(--bg)">
      <span class="expert-tag">⚙ ${z ? "专家 — 通用平滑控制" : "EXPERT — common smoothing controls"}</span>
      <div class="grid2" style="margin-top:10px">
        ${field(z?"弹性平滑策略":"Spring smoothing",`<select class="select" id="expertRefineSpringStrategy">${springStrategyOptions(expertEdit.springStrategy,z)}</select>`,autoSpringStrategyLabel(cellEdit, regionalRefine, z))}
        ${field("RL%niter_refine",`<input class="input" type="number" id="expertNiterRefine" min="1" placeholder="${defaultRefineNiter(cellEdit)}">`,z?`默认 ${defaultRefineNiter(cellEdit)}`:`default ${defaultRefineNiter(cellEdit)}`)}
      </div>
    </div>`;

    const active = crits.filter((l) => l.path && l.enabled).length;
    const thresholdSummary = crits.length
      ? (z ? "判据随模板自动列出 · " : "criteria from the template · ")
        + active + "/" + crits.length + (z ? " 个有数据启用" : " active")
      : (z ? "此模板没有阈值细化判据" : "no threshold criteria for this template");
    const threshold = `<div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;background:var(--bg)">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px">
        <div><div style="font-weight:700">${z ? "阈值细化" : "Threshold refinement"}</div>
        <div style="color:var(--muted);font-size:11px;margin-top:2px">${thresholdSummary}</div></div>
      </div>
      <div id="thresholdRows"></div>
      <div style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">
          <div><span style="font-weight:650">${z ? "阈值细化次数" : "Threshold refinement passes"}</span>
          <div style="color:var(--muted);font-size:11px">RL%max_iter_cal</div></div>
          <span style="font-weight:750;font-size:16px;color:var(--accent)"><span id="calPassVal">${shownCalPasses}</span> <span id="calPassFine" style="font-size:11px;color:var(--muted)">→ ≈${fmtKm(fineAt(shownCalPasses))}</span></span>
        </div>
        <input type="range" id="calPassRange" min="1" max="${nMax}" value="${shownCalPasses}" style="width:100%">
        <div style="display:flex;justify-content:space-between;color:var(--faint);font-size:10px;margin-top:3px"><span>1</span><span>${z ? "上限 " : "max "}${nMax}</span></div>
      </div>
    </div>`;

    const ch = critCard.querySelector(".ch");
    while (ch && ch.nextSibling) ch.nextSibling.remove();
    if (ch) {
      ch.textContent = regionalRefine
        ? (z ? "区域 bbox 默认使用内缩矩形局部细化，指定圆形可覆盖；非 bbox 区域从域轮廓派生细化。指定 bbox 在区域模式中会被忽略。" : "Regional bbox defaults to inset bbox refinement and specified circles override it; non-bbox regions derive refinement from the domain outline. Specified bboxes are ignored in regional mode.")
        : (z ? "细化策略分为指定细化和阈值细化。" : "Refinement is split into specified and threshold refinement.");
      const anchor = ch;
      const mp = specified + hfieldBlock + threshold + expertRefine;
      if (crits.length) anchor.insertAdjacentHTML("afterend", mp);
      else anchor.insertAdjacentHTML("afterend", mp);
      const rows = document.getElementById("thresholdRows");
      if (rows) crits.forEach((l) => rows.appendChild(criterionRow(l)));
      const backendSel = document.getElementById("refineBackend");
      const syncBackend = () => {
        if (backendSel) specifiedRefine.hfieldEnabled = backendSel.value !== "legacy";
        const showH = specifiedRefine.hfieldEnabled !== false;
        const hf = document.getElementById("hfieldOptions"); if (hf) hf.style.display = showH ? "" : "none";
        const lg = document.getElementById("legacyOptions"); if (lg) lg.style.display = showH ? "none" : "";
        expertEdit.enabled = expertEnabled();
        clearRunArtifacts();
      };
      if (backendSel) backendSel.onchange = syncBackend;
      const hfG = document.getElementById("hfieldG");
      if (hfG) hfG.addEventListener("input", () => { const v = parseFloat(hfG.value); specifiedRefine.hfieldG = Number.isFinite(v) ? v : null; });
      const hfMax = document.getElementById("hfieldMaxLevel");
      if (hfMax) hfMax.addEventListener("input", () => { const v = parseInt(hfMax.value, 10); specifiedRefine.hfieldMaxLevel = Number.isFinite(v) ? v : null; });
      const hfBase = document.getElementById("hfieldBaseM");
      if (hfBase) hfBase.addEventListener("input", () => { const v = parseFloat(hfBase.value); specifiedRefine.hfieldBaseM = Number.isFinite(v) && v > 0 ? v : null; });
    }
    // toggles (only for criteria that have data)
    critCard.querySelectorAll(".em-crit").forEach((row) => {
      if (row.dataset.has !== "1") return;
      const tog = row.querySelector(".em-tog");
      if (tog) tog.onclick = () => {
        const id = row.dataset.crit;
        const path = row.dataset.path || "";
        if (!path) return;
        layerEdits[id] = { path, enabled: row.dataset.enabled !== "1" };
        enhanceRefinementStep();
      };
      const th = row.querySelector(".em-threshold");
      if (th) th.oninput = () => {
        const raw = th.value.trim();
        const v = raw === "" ? null : parseFloat(raw);
        thresholdEdits[row.dataset.crit] = Number.isFinite(v) ? v : null;
        clearRunArtifacts();
      };
    });
    const spcPass = document.getElementById("spcPassRange");
    const calPass = document.getElementById("calPassRange");
    const syncPasses = () => {
      const spc = spcPass ? +spcPass.value : shownSpcPasses;
      const cal = calPass ? +calPass.value : shownCalPasses;
      expertEdit.maxIterSpc = spc;
      expertEdit.maxIterCal = cal;
      maxPasses = Math.max(spc, cal);
      const sv = document.getElementById("spcPassVal"); if (sv) sv.textContent = spc;
      const sf = document.getElementById("spcPassFine"); if (sf) sf.textContent = "→ ≈" + fmtKm(fineAt(spc));
      const cv = document.getElementById("calPassVal"); if (cv) cv.textContent = cal;
      const cf = document.getElementById("calPassFine"); if (cf) cf.textContent = "→ ≈" + fmtKm(fineAt(cal));
      expertEdit.enabled = expertEnabled();
      clearRunArtifacts();
    };
    [spcPass, calPass].forEach((el) => { if (el) el.oninput = syncPasses; });
    const erNiter = document.getElementById("expertNiterRefine");
    const erHalo = document.getElementById("expertHalo");
    const erRows = document.getElementById("expertMaxTransitionRow");
    const erSetDis = document.getElementById("expertSetDisType");
    const erNumRc = document.getElementById("expertNumRc");
    const erVertex = document.getElementById("expertVertexPretectLayers");
    const erSpring = document.getElementById("expertRefineSpringStrategy");
    const erWeakConcav = document.getElementById("expertWeakConcav");
    if (erNiter) erNiter.value = expertEdit.niterRefine ?? "";
    if (erHalo) erHalo.value = Array.isArray(expertEdit.halo) ? expertEdit.halo.join(",") : "";
    if (erRows) erRows.value = Array.isArray(expertEdit.maxTransitionRow) ? expertEdit.maxTransitionRow.join(",") : "";
    if (erSetDis) erSetDis.value = expertEdit.setDisType ?? "";
    if (erNumRc) erNumRc.value = expertEdit.numRc ?? "";
    if (erVertex) erVertex.value = expertEdit.vertexPretectLayers ?? "";
    if (erSpring) erSpring.value = expertEdit.springStrategy ?? "";
    if (erWeakConcav) erWeakConcav.checked = true;
    const syncExpertRefine = () => {
      expertEdit.niterRefine = readOptionalInt("expertNiterRefine");
      expertEdit.halo = readOptionalIntList("expertHalo");
      expertEdit.maxTransitionRow = readOptionalIntList("expertMaxTransitionRow");
      expertEdit.setDisType = erSetDis && erSetDis.value ? erSetDis.value : null;
      expertEdit.numRc = readOptionalInt("expertNumRc");
      expertEdit.vertexPretectLayers = readOptionalInt("expertVertexPretectLayers");
      expertEdit.springStrategy = erSpring && erSpring.value ? erSpring.value : null;
      expertEdit.weakConcavEliminate = true;
      expertEdit.enabled = expertEnabled();
      clearRunArtifacts();
    };
    [erNiter, erHalo, erRows, erSetDis, erNumRc, erVertex, erSpring, erWeakConcav].forEach((el) => { if (el) el.oninput = syncExpertRefine; if (el) el.onchange = syncExpertRefine; });
    const specOn = document.getElementById("specifiedRefineOn");
    const specKind = document.getElementById("specifiedKind");
    const specLon = document.getElementById("specifiedLon");
    const specLat = document.getElementById("specifiedLat");
    const specRadius = document.getElementById("specifiedRadius");
    const specW = document.getElementById("specifiedW");
    const specE = document.getElementById("specifiedE");
    const specS = document.getElementById("specifiedS");
    const specN = document.getElementById("specifiedN");
    const specCloseBrowse = document.getElementById("specifiedCloseBrowse");
    const specCloseText = document.getElementById("specifiedClosePathText");
    const readNum = (el) => {
      if (!el || !el.value.trim()) return null;
      const n = parseFloat(el.value);
      return Number.isFinite(n) ? n : null;
    };
    const paintSpecifiedKind = (kind) => {
      const radiusFields = document.getElementById("specifiedRadiusFields");
      const bboxFields = document.getElementById("specifiedBboxFields");
      const closeFields = document.getElementById("specifiedCloseFields");
      if (radiusFields) radiusFields.style.display = kind === "radius" ? "" : "none";
      if (bboxFields) bboxFields.style.display = kind === "bbox" ? "" : "none";
      if (closeFields) closeFields.style.display = kind === "close" ? "" : "none";
      if (specCloseText) specCloseText.textContent = specifiedRefine.path ? "📄 " + specifiedRefine.path : (z?"📄 点击选择 .shp 文件":"📄 Choose a .shp file");
    };
    const syncSpecified = () => {
      const kind = specKind ? specKind.value : "radius";
      specifiedRefine = {
        enabled: !!(specOn && specOn.checked),
        kind,
        lon: readNum(specLon),
        lat: readNum(specLat),
        radiusKm: readNum(specRadius),
        w: readNum(specW),
        e: readNum(specE),
        s: readNum(specS),
        n: readNum(specN),
        path: specifiedRefine.path || null,
      };
      paintSpecifiedKind(kind);
      clearRunArtifacts();
    };
    [specOn, specKind, specLon, specLat, specRadius, specW, specE, specS, specN].forEach((el) => {
      if (el) el.addEventListener("input", syncSpecified);
      if (el) el.addEventListener("change", syncSpecified);
    });
    if (specCloseBrowse) specCloseBrowse.onclick = async () => {
      let p; try { p = await api.pickDataFile(); } catch (e) { logLine("✗ " + e); return; }
      if (!p) return;
      specifiedRefine.path = p;
      if (specKind) specKind.value = "close";
      syncSpecified();
    };
    paintSpecifiedKind(specKind ? specKind.value : "radius");
  }

  // ---- run (step 6) ---------------------------------------------------------
  // The Run button lives in step 6's footer; wire the real run onto the fresh
  // element each time the step rebuilds.
  function enhanceRunStep() {
    const b = document.getElementById("runBtn");
    if (b) b.onclick = doRun;
    const ob = document.getElementById("openOutBtn");
    if (ob) ob.onclick = () => {
      if (runInfo && runInfo.outdir) invoke("open_path", { path: runInfo.outdir }).catch((e) => logLine("✗ " + e));
    };

  }

  // renderStep is a function declaration => reassignable; wrap it to enhance
  // the steps that bind to the live config (domain / layers / refinement /
  // quality) and to wire the relocated Run button.
  if (typeof renderStep === "function") {
    const _renderStep = renderStep;
    renderStep = function (i) {
      _renderStep(i);
      if (i === 0) enhanceNewProjectStep();
      else if (i === 1) enhanceTargetOutputStep();
      else if (i === 2) enhanceDomainStep();
      else if (i === 3) enhanceLayerStep();
      else if (i === 4) enhanceRefinementStep();
      else if (i === 5) enhanceQualityStep();
      else if (i === 6) { enhanceRunStep(); enhanceTargetOutputStep(); }
    };
  }

  // ---- New / Open / Save — actions live in workflow step 0 (the
  // "Project" step), not the header. See onNew/onOpen/onSave + enhanceNewProjectStep().

  // ---- recent projects (persisted across restarts) --------------------------
  function loadRecents() {
    try { return JSON.parse(localStorage.getItem("em.recents") || "[]"); } catch (e) { return []; }
  }
  function pushRecent(path, name) {
    if (!path) return;
    try {
      let r = loadRecents().filter((x) => x.path !== path);
      r.unshift({ path, name: name || path.split(/[\\/]/).pop() });
      localStorage.setItem("em.recents", JSON.stringify(r.slice(0, 8)));
    } catch (e) {}
  }

  // Reflect a loaded + validated project into the UI (shared by Open and recents).
  async function reflectProject(res) {
    let sum;
    try { sum = await api.summary(res.yaml); } catch (e) { logLine("✗ " + e); return; }
    projectActive = true;
    baseProjectYaml = res.yaml;
    lastSummary = sum;
    clearRunArtifacts();
    try { await api.validate(res.yaml); lastSummary._valid = true; lastSummary._err = null; }
    catch (e) { lastSummary._valid = false; lastSummary._err = String(e); }
    try {
      const nameEl = document.querySelector(".proj-name");
      if (nameEl) nameEl.value = sum.name;
      metadataEdit = { authors: sum.authors || [], description: sum.description || "" };
      const isRegional = sum.domain === "regional";
      let matchingTpl = TPL.findIndex((t) => t.intent === sum.intent && t.global === !isRegional);
      if (matchingTpl < 0) matchingTpl = TPL.findIndex((t) => t.intent === sum.intent);
      if (matchingTpl >= 0) tpl = matchingTpl;
      cellEdit = String(sum.cell || "").toLowerCase() === "tri" ? "tri" : "hex";
      if (sum.nxp != null) { resUnitIdx = 1; resVal = sum.nxp; }
      else if (sum.approx_degree != null) { resUnitIdx = 2; resVal = sum.approx_degree; }
      else if (sum.approx_km != null) { resUnitIdx = 0; resVal = sum.approx_km; }
      for (const k of Object.keys(layerEdits)) delete layerEdits[k];
      for (const k of Object.keys(thresholdEdits)) delete thresholdEdits[k];
      sum.layers.forEach((l) => { if (l.path) layerEdits[l.id] = { path: l.path, enabled: l.enabled }; });
      sum.layers.forEach((l) => { if (l.threshold_value != null) thresholdEdits[l.id] = l.threshold_value; });
      if (sum.domain_shape === "shapefile") {
        domainMode = "watershed";
        regional = true;
        watershedPath = sum.watershed_path || "";
        domainEdit = { kind: "shapefile", path: watershedPath, seaRatio: sum.sea_ratio ?? null };
        await loadWatershedBoundary(watershedPath);
      } else if (sum.domain_shape === "close") {
        domainMode = "close";
        regional = true;
        closePath = sum.watershed_path || "";
        closeFormat = sum.close_format || "polygon_shp";
        domainEdit = { kind: "close", path: closePath, format: closeFormat, seaRatio: sum.sea_ratio ?? null };
        await loadWatershedBoundary(closeFormat === "polygon_shp" ? closePath : "");
      } else if (sum.bbox) {
        domainMode = "regional";
        regional = true;
        domBbox = [sum.bbox[0], sum.bbox[1], sum.bbox[2], sum.bbox[3]];
        domainEdit = { kind: "bbox", w: sum.bbox[0], e: sum.bbox[1], s: sum.bbox[2], n: sum.bbox[3], seaRatio: sum.sea_ratio ?? null };
        await loadWatershedBoundary("");
      } else if (isRegional) {
        domainMode = "regional";
        regional = true;
        domainEdit = { kind: "hidden", shape: sum.domain_shape || "regional" };
        await loadWatershedBoundary("");
      } else {
        domainMode = "global";
        regional = false;
        domainEdit = { kind: "global" };
        await loadWatershedBoundary("");
      }
      hiddenDomainShape = domainEdit.kind === "hidden" ? domainEdit.shape : null;
      expertEdit = {
        enabled: sum.expert_openmp != null || sum.expert_niter != null || sum.expert_niter_refine != null || sum.expert_max_iter_spc != null || sum.expert_max_iter_cal != null || sum.expert_halo != null || sum.expert_max_transition_row != null || sum.expert_set_dis_type != null || sum.expert_num_rc != null || sum.expert_vertex_pretect_layers != null || sum.expert_spring_global_type != null || sum.expert_spring_regional_type != null || sum.expert_beta != null || sum.expert_relax != null,
        nxp: null,
        openmp: sum.expert_openmp ?? null,
        niter: sum.expert_niter ?? null,
        niterRefine: sum.expert_niter_refine ?? null,
        maxIterSpc: sum.expert_max_iter_spc ?? null,
        maxIterCal: sum.expert_max_iter_cal ?? null,
        halo: sum.expert_halo ?? null,
        maxTransitionRow: sum.expert_max_transition_row ?? null,
        setDisType: sum.expert_set_dis_type ?? null,
        numRc: sum.expert_num_rc ?? null,
        vertexPretectLayers: sum.expert_vertex_pretect_layers ?? null,
        springStrategy: springStrategyFromTypes(sum.expert_spring_global_type, sum.expert_spring_regional_type),
        beta: sum.expert_beta ?? null,
        relax: sum.expert_relax ?? null,
        weakConcavEliminate: true,
      };
      specifiedRefine = {
        enabled: !!sum.specified_refine_enabled,
        kind: sum.specified_refine_kind || "radius",
        lon: sum.specified_refine_lon ?? null,
        lat: sum.specified_refine_lat ?? null,
        radiusKm: sum.specified_refine_radius_km ?? null,
        w: sum.specified_refine_bbox ? sum.specified_refine_bbox[0] : null,
        e: sum.specified_refine_bbox ? sum.specified_refine_bbox[1] : null,
        s: sum.specified_refine_bbox ? sum.specified_refine_bbox[2] : null,
        n: sum.specified_refine_bbox ? sum.specified_refine_bbox[3] : null,
        path: sum.specified_refine_path ?? null,
        hfieldEnabled: sum.hfield_enabled !== false,
        hfieldG: sum.hfield_g ?? null,
        hfieldMaxLevel: sum.hfield_max_level ?? null,
        hfieldBaseM: sum.hfield_base_m ?? null,
      };
      if ((expertEdit.enabled || specifiedRefine.hfieldEnabled === false) && typeof setExpertMode === "function") setExpertMode(true);
      qualityEdit = { minAngle: sum.min_angle_deg, policy: sum.on_violation || "warn" };
      maxPasses = sum.max_passes;
      if (typeof renderSteps === "function") renderSteps();
      if (typeof renderStep === "function") renderStep(typeof cur !== "undefined" ? cur : 0);
    } catch (e) { /* best-effort reflect */ }
    pushRecent(res.path, sum.name);
    logLine("✓ opened " + res.path + " — intent " + sum.intent + ", NXP " + (sum.effective_nxp ?? sum.nxp ?? "?"));
  }

  // Reset to a clean default project (matches first-load state). Keep the chosen
  // output folder — that's a machine preference, not project data.
  function resetProject() {
    tpl = DEFAULT_TPL; domainMode = "regional"; regional = true; domBbox = [...DEFAULT_BBOX]; watershedPath = ""; closePath = ""; closeFormat = "polygon_shp"; cellEdit = null;
    resUnitIdx = 0; resVal = RES_UNITS[0].def; maxPasses = null;
    if (typeof clearCoastalOverlay === "function") clearCoastalOverlay();
    clearRunArtifacts();
    loadWatershedBoundary("");
    for (const k of Object.keys(layerEdits)) delete layerEdits[k];
    for (const k of Object.keys(thresholdEdits)) delete thresholdEdits[k];
    baseProjectYaml = null;
    domainEdit = null; qualityEdit = null;
    expertEdit = { enabled: false, nxp: null, openmp: null, niter: null, niterRefine: null, maxIterSpc: null, maxIterCal: null, halo: null, maxTransitionRow: null, setDisType: null, numRc: null, vertexPretectLayers: null, springStrategy: null, beta: null, relax: null, weakConcavEliminate: true };
    specifiedRefine = { enabled: false, kind: "radius", lon: null, lat: null, radiusKm: null, w: null, e: null, s: null, n: null, path: null, hfieldEnabled: true, hfieldG: null, hfieldMaxLevel: null, hfieldBaseM: null };

  // Compute the summary (+ validation) for the current UI state.
  async function refreshSummary() {
    try {
      const yaml = await composeYaml();
      lastSummary = await api.summary(yaml);
      try { await api.validate(yaml); lastSummary._valid = true; lastSummary._err = null; }
      catch (e) { lastSummary._valid = false; lastSummary._err = String(e); }
      return lastSummary;
    } catch (e) { lastSummary = null; return null; }
  }

  function cellShapeLabel(cell) {
    return String(cell || "").toLowerCase() === "tri"
      ? (zh() ? "三角形" : "Triangular")
      : (zh() ? "六边形" : "Hexagonal");
  }

  function paintTargetOutputs(summary) {
    const s = summary || lastSummary;
    if (!s) return;
    const model = s.model_format || "—";
    const cell = String(cellEdit || s.cell || "hex").toLowerCase() === "tri" ? "tri" : "hex";
    const mode = s.quality_mode || (cell === "tri" ? "tri-strict" : "hex-cgrid");
    const modelIn = document.getElementById("targetModelOutput");
    const cellIn = document.getElementById("targetCellOutput");
    const modeIn = document.getElementById("targetQualityModeOutput");
    const ready = document.getElementById("readyModelOutput");
    const readyMode = document.getElementById("readyQualityModeOutput");
    const refine = document.getElementById("readyRefinementOutput");
    if (modelIn) modelIn.value = model;
    if (cellIn) cellIn.value = cell;
    if (modeIn) modeIn.textContent = mode;
    if (ready) ready.textContent = model;
    if (readyMode) readyMode.textContent = mode;
    if (refine) refine.textContent = s.refine_enabled
      ? ((zh() ? "最多 " : "up to ") + s.max_passes + (zh() ? " 次" : " passes"))
      : (zh() ? "关闭" : "off");
  }

  function readOptionalInt(id) {
    const el = document.getElementById(id);
    if (!el || !el.value.trim()) return null;
    const n = parseInt(el.value, 10);
    return Number.isFinite(n) ? n : null;
  }
  function readOptionalFloat(id) {
    const el = document.getElementById(id);
    if (!el || !el.value.trim()) return null;
    const n = parseFloat(el.value);
    return Number.isFinite(n) ? n : null;
  }
  function readOptionalIntList(id) {
    const el = document.getElementById(id);
    if (!el || !el.value.trim()) return null;
    const xs = el.value.split(/[\s,]+/).filter(Boolean).map((v) => parseInt(v, 10));
    return xs.length && xs.every(Number.isFinite) ? xs : null;
  }
  function inferCloseFormat(path) {
    const p = String(path || "").toLowerCase();
    if (p.endsWith(".shp")) return "polygon_shp";
    if (p.endsWith(".nml")) return "nml";
    if (p.endsWith(".nc") || p.endsWith(".nc4")) return "netcdf";
    if (p.endsWith(".txt") || p.endsWith(".csv")) return "lonlat_text";
    return "polygon_shp";
  }
  function expertEnabled() {
    const legacyBackend = specifiedRefine.hfieldEnabled === false;
    return expertEdit.openmp != null || expertEdit.niter != null || expertEdit.niterRefine != null ||
      expertEdit.maxIterSpc != null || expertEdit.maxIterCal != null ||
      (legacyBackend && (expertEdit.halo != null || expertEdit.maxTransitionRow != null ||
        expertEdit.setDisType != null || expertEdit.numRc != null ||
        expertEdit.vertexPretectLayers != null || legacyBackend)) ||
      expertEdit.springStrategy != null || expertEdit.beta != null || expertEdit.relax != null;
  }

  async function wireExpertTargetStep() {
    const spring = document.getElementById("expertSpringStrategy");
    const openmp = document.getElementById("expertOpenmp");
    const niter = document.getElementById("expertNiter");
    const beta = document.getElementById("expertBeta");
    const relax = document.getElementById("expertRelax");
    if (!spring && !openmp && !niter && !beta && !relax) return;
    const paint = () => {
      if (spring) spring.value = expertEdit.springStrategy ?? "";
      if (openmp) openmp.value = expertEdit.openmp ?? DEFAULT_OPENMP;
      if (niter) niter.value = expertEdit.niter ?? DEFAULT_NITER;
      if (beta) beta.value = expertEdit.beta ?? DEFAULT_BETA;
      if (relax) relax.value = expertEdit.relax ?? DEFAULT_RELAX;
    };
    const update = async () => {
      expertEdit = {
        enabled: true,
        nxp: null,
        openmp: readOptionalInt("expertOpenmp"),
        niter: readOptionalInt("expertNiter"),
        niterRefine: expertEdit.niterRefine,
        maxIterSpc: expertEdit.maxIterSpc,
        maxIterCal: expertEdit.maxIterCal,
        halo: expertEdit.halo,
        maxTransitionRow: expertEdit.maxTransitionRow,
        setDisType: expertEdit.setDisType,
        numRc: expertEdit.numRc,
        vertexPretectLayers: expertEdit.vertexPretectLayers,
        springStrategy: spring && spring.value ? spring.value : null,
        beta: readOptionalFloat("expertBeta"),
        relax: readOptionalFloat("expertRelax"),
        weakConcavEliminate: true,
      };
      expertEdit.enabled = expertEnabled();
      clearRunArtifacts();
      paintTargetOutputs(await refreshSummary());
      paint();
    };
    paint();
    [spring, openmp, niter, beta, relax].forEach((el) => { if (el) el.oninput = update; if (el) el.onchange = update; });
  }

  async function enhanceTargetOutputStep() {
    const cellIn = document.getElementById("targetCellOutput");
    if (cellIn) {
      cellIn.onchange = async () => {
        cellEdit = cellIn.value === "tri" ? "tri" : "hex";
        clearRunArtifacts();
        paintTargetOutputs(await refreshSummary());
      };
    }
    const s = await refreshSummary();
    paintTargetOutputs(s);
    wireExpertTargetStep();
  }
