  // ---- New Project (step 0): output-folder picker + real recent list --------
  function enhanceNewProjectStep() {
    // New / Open / Save actions (the header has none — they live here now)
    const nb = document.getElementById("projNew"); if (nb) nb.onclick = onNew;
    const ob2 = document.getElementById("projOpen"); if (ob2) ob2.onclick = onOpen;
    const sb2 = document.getElementById("projSave"); if (sb2) sb2.onclick = onSave;
    const nameStep = document.getElementById("projectNameStep");
    const nameTop = document.querySelector(".proj-name");
    const author = document.getElementById("projectAuthor");
    const desc = document.getElementById("projectDescription");
    if (nameStep && nameTop) nameStep.value = nameTop.value;
    if (author) author.value = (metadataEdit.authors || []).join(", ");
    if (desc) desc.value = metadataEdit.description || "";
    if (nameStep && nameTop) nameStep.oninput = () => { nameTop.value = nameStep.value; };
    if (author) author.oninput = () => { metadataEdit.authors = author.value.split(",").map((s) => s.trim()).filter(Boolean); };
    if (desc) desc.oninput = () => { metadataEdit.description = desc.value; };
    // output-folder picker
    const opb = document.getElementById("outPathBrowse");
    const t0 = document.getElementById("outPathText");
    if (t0 && outputPath) t0.textContent = "📁 " + outputPath; // reflect a remembered path
    if (opb) opb.onclick = async () => {
      let p; try { p = await api.pickDataFolder(); } catch (e) { logLine("✗ " + e); return; }
      if (!p) return;
      outputPath = p;
      try { localStorage.setItem("em.outputPath", p); } catch (e) {}
      const t = document.getElementById("outPathText");
      if (t) t.textContent = "📁 " + p;
    };
    // render recents into the "Recent projects" card (not the Project card)
    const cards = [...document.querySelectorAll("#work .card")];
    const card = cards.find((c) => /最近|Recent/.test((c.querySelector("h3") || {}).textContent || ""));
    if (!card) return;
    const z = zh();
    card.querySelectorAll(".browse,.recent-empty").forEach((e) => e.remove());
    const recents = loadRecents();
    if (!recents.length) {
      const empty = document.createElement("div");
      empty.className = "recent-empty";
      empty.style.cssText = "color:var(--muted);font-size:13px;padding:4px 2px;line-height:1.6";
      empty.textContent = z ? "暂无最近项目——保存或打开一个项目后会出现在这里。" : "No recent projects yet — Save or Open one and it shows here.";
      card.appendChild(empty);
    } else {
      recents.forEach((r) => {
        const div = document.createElement("div");
        div.className = "browse";
        div.style.cssText = "margin-bottom:8px;cursor:pointer";
        div.title = r.path;
        const label = document.createElement("span");
        label.className = "path";
        label.style.maxWidth = "none";
        label.textContent = "📄 " + (r.name || r.path);
        div.appendChild(label);
        div.onclick = () => openRecent(r.path);
        card.appendChild(div);
      });
    }
    const ch = card.querySelector(".ch");
    if (ch) ch.textContent = z ? "点击重开" : "Click to reopen";
    renderProjectSummary();
  }

  // Project summary panel (data layers / quality gate / validation), shown once
  // a project has been created or opened this session.
  function renderProjectSummary() {
    const sumEl = document.getElementById("projSummary");
    if (!sumEl) return;
    const z = zh();
    if (!(projectActive && lastSummary)) { sumEl.textContent = ""; return; }
    const s = lastSummary;
    const total = (s.layers || []).length;
    const on = (s.layers || []).filter((l) => l.enabled && l.path).length;
    const domain = s.domain_shape === "shapefile"
      ? ((z ? "流域 SHP：" : "watershed SHP: ") + (s.watershed_path || "—"))
      : s.domain_shape === "close"
      ? ((z ? "闭合区域：" : "close domain: ") + (s.watershed_path || "—"))
      : s.domain_shape === "bbox" && s.bbox
      ? (z ? "区域矩形框" : "regional bbox")
      : (s.domain_shape === "global"
        ? (z ? "全球" : "global")
        : ((z ? "保留隐藏区域：" : "preserved regional: ") + (s.domain_shape || s.domain || "—")));
    const gate = (s.min_angle_deg != null)
      ? (s.min_angle_deg + "° · " + (s.on_violation === "auto_refine" ? (z ? "自动尝试修复" : "auto_refine") : (s.on_violation === "block" ? (z ? "违规即停" : "block") : (z ? "违规告警" : "warn"))))
      : "—";
    const ok = !!s._valid;
    sumEl.innerHTML =
      `<div class="card"><h3>${z ? "项目摘要" : "Project summary"}</h3>
         <div class="ch">${z ? "新建/打开后的项目状态" : "Status of the created/opened project"}</div>
         <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-md);margin-top:10px">
           <div class="metric"><div class="mv" id="projectSummaryLayers"></div><div class="ml">${z ? "数据图层（启用/总）" : "Data layers (on/total)"}</div></div>
           <div class="metric"><div class="mv" id="projectSummaryDomain" style="font-size:15px"></div><div class="ml">${z ? "计算域" : "Domain"}</div></div>
           <div class="metric"><div class="mv" id="projectSummaryGate" style="font-size:15px"></div><div class="ml">${z ? "质量门限（最小角）" : "Quality gate (min angle)"}</div></div>
           <div class="metric"><div class="mv" id="projectSummaryValidation" style="font-size:15px;color:${ok ? "#22a06b" : "#e5484d"}"></div><div class="ml">${z ? "校验状态" : "Validation"}</div></div>
         </div>
         ${ok ? "" : `<div id="projectSummaryError" style="color:#e5484d;font-size:12px;margin-top:10px;white-space:pre-wrap"></div>`}
       </div>`;
    const layersEl = document.getElementById("projectSummaryLayers");
    const domainEl = document.getElementById("projectSummaryDomain");
    const gateEl = document.getElementById("projectSummaryGate");
    const validEl = document.getElementById("projectSummaryValidation");
    if (layersEl) layersEl.textContent = on + "/" + total;
    if (domainEl) domainEl.textContent = domain;
    if (gateEl) gateEl.textContent = gate;
    if (validEl) validEl.textContent = ok ? (z ? "✓ 通过" : "✓ valid") : (z ? "✗ 失败" : "✗ invalid");
    const err = document.getElementById("projectSummaryError");
    if (err) err.textContent = (s._err || "").slice(0, 400);
  }

  clearStartupPlaceholders();
  // remember the output folder across sessions
  try { const sp = localStorage.getItem("em.outputPath"); if (sp) outputPath = sp; } catch (e) {}

  // Startup proof that the Tauri backend and criterion catalog are reachable.
  api.listCriteria()
    .then((cs) => setLogStatus("✓ " + (zh() ? "Rust 后端已连接 — 注册了 " + cs.length + " 条细化判据" : "Rust backend connected — " + cs.length + " refinement criteria registered"), true))
    .catch((e) => setLogStatus("✗ backend error: " + e, false));
  // Mirror the static frontend's default regional bbox so a
  // Save before visiting step 2 still reflects what's shown.
  if (typeof regional !== "undefined" && regional)
    domainEdit = { kind: "bbox", w: DEFAULT_BBOX[0], e: DEFAULT_BBOX[1], s: DEFAULT_BBOX[2], n: DEFAULT_BBOX[3] };
  if (typeof cur !== "undefined") {
    if (cur === 0) enhanceNewProjectStep();
    else if (cur === 1) enhanceTargetOutputStep();
    else if (cur === 2) enhanceDomainStep();
    else if (cur === 3) enhanceLayerStep();
    else if (cur === 4) enhanceRefinementStep();
    else if (cur === 5) enhanceQualityStep();
    else if (cur === 6) enhanceRunStep();
  }

  // Stream mkgrd stdout/stderr (emitted by run_project) into the Log pane.
  if (window.__TAURI__.event && window.__TAURI__.event.listen) {
    window.__TAURI__.event.listen("mkgrd://log", (ev) => logLine(String(ev.payload)));
  }

  // Run -> compose YAML -> spawn the mesh engine, stream logs, report status.
  async function doRun() {
    const rtext = document.getElementById("rtext");
    const rdot = document.getElementById("rdot");
    const setStatus = (txt, done) => {
      if (rtext) rtext.textContent = txt;
      if (rdot) rdot.classList.toggle("on", !!done);
    };
    setStatus(zh() ? "运行中…" : "running…", false);
    setRunControls(true);
    clearRunArtifacts();
    // show the Log pane because the Run button now lives inside the step footer
    document.querySelectorAll("#liveTabs button").forEach(x => x.classList.toggle("on", x.dataset.pane === "log"));
    document.querySelectorAll(".live-pane").forEach(p => p.classList.toggle("on", p.dataset.pane === "log"));
    let finalQuality = null;
    let bestRun = null;
    let bestQuality = null;
    try {
      for (;;) {
        let yaml;
        try { yaml = await composeYaml(); } catch (e) { logLine("✗ " + e); setStatus(zh() ? "运行失败" : "failed", true); setRunControls(false); return; }
        try { lastSummary = await api.summary(yaml); } catch (e) {}
        const autoRefine = lastSummary && lastSummary.domain === "regional" && lastSummary.on_violation === "auto_refine";
        const maxAutoLevel = regionalMethodCLevelCap(currentNxp());
        const requestedLevel = maxPasses == null ? regionalDefaultRefineLevel(currentNxp()) : Math.max(1, Math.min(maxAutoLevel, maxPasses));
        const actualLevel = requestedLevel;
        if (autoRefine && maxPasses != null && maxPasses > actualLevel) maxPasses = actualLevel;
        logLine("\n▶ " + (zh() ? "启动网格引擎（" : "starting mesh engine (") + currentIntent() + ", " + currentResolutionLabel() + (autoRefine ? ", auto refine level=" + actualLevel : "") + ")");
        const r = await api.runProject(yaml, outputPath || null);
        logLine(r.ok ? ("✓ " + (zh() ? "完成 — 输出在 " : "done — outputs in ") + r.outdir)
                     : ("✗ " + (zh() ? "退出码 " : "exited with code ") + r.code));
        setStatus(r.ok ? (zh() ? "运行完成" : "finished") : (zh() ? "运行失败" : "failed"), true);
        hasRun = true; runInfo = { ok: r.ok, outdir: r.outdir, code: r.code, gridfile: r.gridfile };
        if (!(r.ok && r.gridfile && autoRefine)) {
          if (autoRefine && actualLevel < maxAutoLevel) {
            if (bestRun) {
              logLine(zh() ? "⚠ 更高细化级别运行失败，保留上一次可用结果。" : "⚠ higher refine level failed; keeping the last usable result.");
              runInfo = bestRun;
              finalQuality = bestQuality;
              setStatus(zh() ? "运行完成" : "finished", true);
              break;
            }
            maxPasses = actualLevel + 1;
            logLine((zh() ? "↻ 当前级别运行失败，继续尝试细化级别 " : "↻ current level failed; retrying with refine level ") + maxPasses);
            continue;
          }
          break;
        }
        try {
          finalQuality = await readMeshQuality(r.gridfile);
          bestRun = runInfo;
          bestQuality = finalQuality;
          _lastQuality = finalQuality;
          const verdict = String(finalQuality.verdict || "").toLowerCase();
          logLine("✓ " + (zh() ? "质量检查：" : "quality check: ") + (finalQuality.verdict || "unknown"));
          if (verdict !== "fail") break;
          if (actualLevel >= maxAutoLevel) {
            logLine((zh() ? "⚠ 自动修复已到最大细化级别 " : "⚠ auto repair reached max refine level ") + maxAutoLevel + (zh() ? "，保留最后一次结果。" : "; keeping the last result."));
            break;
          }
          maxPasses = actualLevel + 1;
          logLine((zh() ? "↻ 质量仍失败，自动提高细化级别到 " : "↻ quality still failed; retrying with refine level ") + maxPasses);
        } catch (e) {
          logLine((zh() ? "⚠ 自动质量检查失败：" : "⚠ auto quality check failed: ") + e);
          break;
        }
      }
    } catch (e) {
      logLine("✗ " + (zh() ? "运行失败: " : "run failed: ") + e);
      setStatus(zh() ? "运行失败" : "failed", true);
      hasRun = true; runInfo = { ok: false, outdir: "", code: null };
    }
    setRunControls(false);
    if (typeof cur !== "undefined" && cur === 6 && typeof renderStep === "function") renderStep(6);
    if (runInfo && runInfo.ok && runInfo.gridfile) loadQualityAndMesh(runInfo.gridfile, finalQuality);
    else if (runInfo && runInfo.ok) {
      logLine(zh() ? "⚠ 引擎未报告 gridfile；跳过质量分析和地图叠加。" : "⚠ engine did not report gridfile; skipping quality and map overlay.");
      renderMissingGridfile();
    }
  }

  function renderQualityNote(text) {
    const card = document.getElementById("qualityCard");
    if (!card) return;
    card.textContent = "";
    const h = document.createElement("h3"); h.textContent = zh() ? "质量指标" : "Quality metrics";
    const note = document.createElement("div"); note.className = "ch"; note.textContent = text;
    card.append(h, note);
  }
  function renderMissingGridfile() {
    renderQualityNote(zh() ? "引擎没有在日志中报告 gridfile，无法自动解析质量报告或叠加网格。" : "The engine did not report a gridfile in the log, so quality parsing and map overlay were skipped.");
  }

  // After a successful run: parse mesh quality into the step-6 card, and overlay
  // the generated mesh on the map using the ProjectSummary cell shape.
  function meshViewKind() {
    return (lastSummary && String(lastSummary.cell || "").toLowerCase() === "tri") ? "tri" : "hex";
  }
  function readMeshQuality(gridfile) {
    return invoke("mesh_quality", { gridfile, kind: meshViewKind() });
  }
  function loadMeshMeritCells(gridfile, kind) {
    const summary = lastSummary;
    const merit = meshMeritLayer(summary);
    const landcover = meshLandcoverLayer(summary);
    const b = summary && summary.bbox;
    if (currentIntent() !== "MeritHydroCoast" || !merit || !b) { clearCoastalOverlay(); return; }
    invoke("mesh_merit_cells", { gridfile, kind, meritRoot: merit.path, w: b[0], e: b[1], s: b[2], n: b[3], stride: MERIT_SURFACE_PREVIEW_STRIDE, landtypeFile: landcover && landcover.path ? landcover.path : null })
      .then((txt) => {
        _coastalGeojson = JSON.parse(txt);
        if (typeof drawMap === "function") drawMap();
        logLine(zh() ? "✓ 最终网格已按 MERIT-Hydro R3/R2 + land-cover fraction 区分海岸带/陆地/海洋" : "✓ final mesh classified with MERIT-Hydro R3/R2 plus land-cover coastal fractions");
      })
      .catch((e) => { clearCoastalOverlay(); logLine((zh() ? "⚠ 最终网格海岸带分类失败：" : "⚠ final coastal classification failed: ") + e); });
  }
  async function loadQualityAndMesh(gridfile, knownQuality) {
    renderQualityNote(zh() ? "分析中…" : "analyzing…");
    const kind = (lastSummary && String(lastSummary.cell || "").toLowerCase() === "tri") ? "tri" : "hex";
    (knownQuality ? Promise.resolve(knownQuality) : readMeshQuality(gridfile))
      .then((q) => { _lastQuality = q; renderQualityCard(q); })
      .catch((e) => renderQualityNote((zh() ? "质量分析失败：" : "quality failed: ") + e));
    invoke("mesh_cell_polygons", { gridfile, kind, maxCells: null })
      .then((txt) => { applyMesh(JSON.parse(txt)); logLine(zh() ? "✓ 网格已叠加到地图" : "✓ mesh overlaid on map"); loadMeshMeritCells(gridfile, kind); })
      .catch((e) => logLine((zh() ? "网格叠加失败：" : "mesh overlay failed: ") + e));
  }

  // A distribution row: [min..max] track with the μ±σ band + mean tick.
  function statBar(label, s, unit) {
    if (!s || (s.max === 0 && s.min === 0 && s.mean === 0)) return "";
    const W = 240, H = 26, pad = 3;
    const min = s.min, max = s.max, mean = s.mean, std = s.std || 0;
    const range = (max - min) || 1;
    const x = (v) => pad + (Math.max(min, Math.min(max, v)) - min) / range * (W - 2 * pad);
    const lo = Math.max(min, mean - std), hi = Math.min(max, mean + std);
    const fmt = (v) => Math.abs(v) >= 100 ? v.toFixed(0) : (Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3));
    const u = unit ? " " + unit : "";
    return `<div style="margin:9px 0">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">
        <span style="font-weight:600">${label}</span>
        <span style="color:var(--muted)">μ ${fmt(mean)}${u} · σ ${fmt(std)}</span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
        <line x1="${x(min)}" y1="${H/2}" x2="${x(max)}" y2="${H/2}" stroke="var(--border)" stroke-width="2"/>
        <rect x="${x(lo)}" y="${H/2-6}" width="${Math.max(1,x(hi)-x(lo))}" height="12" fill="var(--accent)" fill-opacity="0.25" rx="2"/>
        <line x1="${x(mean)}" y1="${H/2-8}" x2="${x(mean)}" y2="${H/2+8}" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="${x(min)}" cy="${H/2}" r="2.6" fill="var(--muted)"/><circle cx="${x(max)}" cy="${H/2}" r="2.6" fill="var(--muted)"/></svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--faint)"><span>${fmt(min)}</span><span>${fmt(max)}${u}</span></div>
    </div>`;
  }

  function renderQualityCard(q) {
    const card = document.getElementById("qualityCard"); if (!card) return;
    const z = zh();
    const verdict = (q.verdict || "unknown").toUpperCase();
    const color = q.verdict === "pass" ? "var(--pass)" : (q.verdict === "fail" ? "#e5484d" : "var(--warn)");
    const num = (n) => (typeof n === "number" ? n.toLocaleString() : n);
    card.innerHTML = `<h3>${z ? "质量指标" : "Quality metrics"}</h3>
      <div style="margin:6px 0"><span id="qualityVerdictBadge" style="display:inline-block;padding:3px 10px;border-radius:6px;color:#fff;font-weight:800;font-size:12px;letter-spacing:.03em;background:${color}"></span></div>
      <div class="grid2">
        ${field(z ? "单元数" : "Cells", `<b id="qualityCells" style="font-size:15px"></b>`)}
        ${field(z ? "顶点数" : "Vertices", `<b id="qualityVertices" style="font-size:15px"></b>`)}
        ${field(z ? "边数" : "Edges", `<b id="qualityEdges" style="font-size:15px"></b>`)}
        ${field(z ? "角度范围" : "Angle range", `<b id="qualityAngleRange" style="font-size:15px;color:${color}"></b>`)}
      </div>
      <div class="ch" style="margin-top:10px">${z ? "分布（μ±σ 区间 + 极值）" : "Distributions (μ±σ band + range)"}</div>
      ${statBar(z ? "边长" : "Edge length", q.edge_length_km, "km")}
      ${statBar(z ? "纵横比" : "Aspect ratio", q.aspect_ratio, "")}
      ${statBar(z ? "紧致度" : "Compactness", q.compactness, "")}
      ${statBar(z ? "单元面积" : "Cell area", q.cell_area, "")}`;
    const text = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
    text("qualityVerdictBadge", verdict);
    text("qualityCells", num(q.cell_count));
    text("qualityVertices", num(q.vertex_count));
    text("qualityEdges", num(q.edge_count));
    text("qualityAngleRange", (q.min_angle_deg || 0).toFixed(1) + "°–" + (q.max_angle_deg || 0).toFixed(1) + "°");
    const cellSides = (q.cell_sides || []).filter((t) => t[1] > 0);
    if (cellSides.length) {
      const sideTitle = document.createElement("div");
      sideTitle.className = "ch";
      sideTitle.style.marginTop = "10px";
      sideTitle.textContent = z ? "单元边数（观测）" : "Cell sides (observed)";
      card.appendChild(sideTitle);
      const sideLabels = { triangle: z ? "三角形" : "triangles", quadrilateral: z ? "四边形" : "quadrilaterals", pentagon: z ? "五边形" : "pentagons", hexagon: z ? "六边形" : "hexagons", heptagon: z ? "七边形" : "heptagons", other: z ? "其他" : "other" };
      cellSides.forEach((t) => {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;justify-content:space-between;padding:3px 2px;font-size:12px;color:var(--muted)";
        const name = document.createElement("span");
        name.textContent = sideLabels[t[0]] || t[0];
        const count = document.createElement("b");
        count.textContent = num(t[1]);
        row.append(name, count);
        card.appendChild(row);
      });
    }
    if (q.gates && q.gates.length) {
      const title = document.createElement("div");
      title.className = "ch";
      title.style.marginTop = "10px";
      title.textContent = z ? "门禁" : "Gates";
      card.appendChild(title);
      q.gates.forEach((g) => {
        const col = g.level === "pass" ? "var(--pass)" : (g.level === "fail" ? "#e5484d" : "var(--warn)");
        const v = Math.abs(g.value) >= 100 ? g.value.toFixed(0) : g.value.toFixed(2);
        const row = document.createElement("div");
        row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:5px 2px;border-bottom:1px solid var(--border-soft);font-size:12.5px";
        const metric = document.createElement("span");
        metric.textContent = g.metric;
        const result = document.createElement("span");
        const value = document.createElement("b");
        value.textContent = v;
        const level = document.createElement("span");
        level.style.cssText = "display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;background:" + col;
        level.textContent = (g.level || "?").toUpperCase();
        result.append(value, " ", level);
        row.append(metric, result);
        card.appendChild(row);
      });
    }
    const issues = (q.topology || []).filter((t) => t[1] > 0)
      .concat([[z ? "零面积" : "zero-area", q.zero_area], [z ? "负面积" : "negative-area", q.negative_area], [z ? "自相交" : "self-intersection", q.self_intersection], [z ? "非法多边形" : "invalid polygon", q.invalid_polygon]].filter((t) => t[1] > 0));
    const issueTitle = document.createElement("div");
    issueTitle.className = "ch";
    issueTitle.style.marginTop = "10px";
    issueTitle.textContent = z ? "拓扑 / 退化" : "Topology / degeneracy";
    card.appendChild(issueTitle);
    if (issues.length) {
      issues.forEach((t) => {
        const issue = document.createElement("div");
        issue.style.cssText = "font-size:12px;color:var(--warn)";
        issue.textContent = "• " + t[0] + ": " + num(t[1]);
        card.appendChild(issue);
      });
    } else {
      const ok = document.createElement("div");
      ok.style.cssText = "font-size:12px;color:var(--pass)";
      ok.textContent = "✓ " + (z ? "无拓扑问题" : "no issues");
      card.appendChild(ok);
    }
    if (q.max_adjacent_resolution_ratio) {
      const ratio = document.createElement("div");
      ratio.style.cssText = "font-size:12px;color:var(--muted)";
      ratio.textContent = (z ? "最大相邻分辨率比" : "max adjacent res. ratio") + ": " + q.max_adjacent_resolution_ratio.toFixed(2);
      card.appendChild(ratio);
    }
    if (q.report_path || q.worst_cells_path) {
      const btns = document.createElement("div");
      btns.style.marginTop = "12px";
      if (q.report_path) {
        const report = document.createElement("span");
        report.className = "btn-ghost";
        report.id = "qReportBtn";
        report.style.cssText = "cursor:pointer;margin-right:8px";
        report.textContent = "📄 " + (z ? "质量报告" : "Report");
        btns.appendChild(report);
      }
      if (q.worst_cells_path) {
        const worst = document.createElement("span");
        worst.className = "btn-ghost";
        worst.id = "qWorstBtn";
        worst.style.cursor = "pointer";
        worst.textContent = "⚠ " + (z ? "最差单元" : "Worst cells");
        btns.appendChild(worst);
      }
      card.appendChild(btns);
    }
    const rb = document.getElementById("qReportBtn");
    if (rb && q.report_path) rb.onclick = () => invoke("open_path", { path: q.report_path }).catch((e) => logLine("✗ " + e));
    const wb = document.getElementById("qWorstBtn");
    if (wb && q.worst_cells_path) wb.onclick = () => invoke("open_path", { path: q.worst_cells_path }).catch((e) => logLine("✗ " + e));

    // reflect into the right-panel Quality tab (mini-metrics + verdict badge)
    const minis = document.querySelectorAll('.live-pane[data-pane="quality"] .mini-metric b');
    const setMini = (i, txt, col) => { if (minis[i]) { minis[i].textContent = txt; minis[i].style.color = col || "var(--text)"; } };
    setMini(0, num(q.cell_count));
    setMini(1, num(q.vertex_count));
    setMini(2, (q.min_angle_deg || 0).toFixed(1) + "°", color);
    if (q.aspect_ratio) setMini(3, q.aspect_ratio.max.toFixed(2));
    document.querySelectorAll('.live-pane[data-pane="quality"] .badge').forEach((b) => { b.style.display = ""; b.style.background = color; b.textContent = "● " + verdict; });
  }

  // The Run button moved into step 6's footer; enhanceRunStep() wires it each
  // time that step renders (see the renderStep wrapper above).
})();
</script>
