/* ---------------- map (satellite base + domain box + mesh overlay) ---------------- */
function baseMapLayer(){
  // Satellite imagery base. Unlike OSM, it draws NO national borders or maritime/
  // territorial lines, so the map depicts no disputed boundary of any kind.
  // (Esri World Imagery — free with attribution. Note {y}/{x} order, no {s}.)
  return window.LEAF.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, attribution: "Imagery © Esri, Maxar, Earthstar Geographics" });
}
function ensureMap(elId){
  const el=document.getElementById(elId);
  if(!el || !window.LEAF) return null;
  if(el._lmap) return el._lmap;        // one Leaflet instance per container
  const m=window.LEAF.map(el,{ zoomControl:true, attributionControl:true }).setView([22,113],4);
  baseMapLayer().addTo(m);
  // Drop Leaflet's default attribution prefix — the "Leaflet" link AND the
  // Ukrainian flag (🇺🇦) it ships since v1.8 — so no flag shows on the map. The
  // small imagery credit (© Esri) stays for licensing.
  try{ m.attributionControl.setPrefix(false); }catch(e){}
  el._lmap=m;
  return m;
}
function domainRect(){
  const reg=(typeof regional==="undefined")?true:regional;
  if(!reg) return null;                // global: no box
  const [w,e,s,n]=domBbox;             // domBbox is [W,E,S,N]
  return window.LEAF.rectangle([[s,w],[n,e]],
    { color:"#ffffff", weight:2, dashArray:"6 4", fill:false });
}
function refreshDomain(m){
  if(!m) return;
  if(m._domainLayer){ m.removeLayer(m._domainLayer); m._domainLayer=null; }
  const r=domainRect();
  if(r){
    r.addTo(m); m._domainLayer=r;
    // re-frame only when the box actually changed (don't fight the user's pan/zoom)
    const key=JSON.stringify(domBbox)+(regional?"r":"g");
    if(m._domainKey!==key){ m._domainKey=key; try{ m.fitBounds(r.getBounds(),{padding:[20,20],maxZoom:8}); }catch(e){} }
  }
}
function setMeshLayer(m, geojson, doFit){
  if(!m) return;
  if(m._meshLayer){ m.removeLayer(m._meshLayer); m._meshLayer=null; }
  if(!geojson) return;
  try{
    const layer=window.LEAF.geoJSON(geojson,{ style:{ color:"#22d3ee", weight:0.9, fillOpacity:0.05 } }).addTo(m);
    m._meshLayer=layer;
    if(doFit){ try{ m.fitBounds(layer.getBounds(),{padding:[20,20],maxZoom:9}); }catch(e){} }
  }catch(e){}
}
let _meshGeojson=null;  // last mesh overlay (re-applied when a map (re)opens)
function applyMesh(geojson){
  _meshGeojson=geojson;
  const m=document.getElementById("mapsvg") && document.getElementById("mapsvg")._lmap;
  if(m) setMeshLayer(m, geojson, true);
  const mm=document.getElementById("mapsvgModal") && document.getElementById("mapsvgModal")._lmap;
  if(mm) setMeshLayer(mm, geojson, true);
}
function drawMap(){
  const m=ensureMap("mapsvg");
  if(m){ refreshDomain(m); setMeshLayer(m,_meshGeojson,false); setTimeout(()=>m.invalidateSize(),60); }
  const mm=document.getElementById("mapModal");
  if(mm && mm.style.display!=="none"){
    const m2=ensureMap("mapsvgModal");
    if(m2){ refreshDomain(m2); setMeshLayer(m2,_meshGeojson,false); setTimeout(()=>m2.invalidateSize(),60); }
  }
}
function openMapModal(){
  const mm=document.getElementById("mapModal"); if(!mm) return;
  mm.style.display="flex";
  const m2=ensureMap("mapsvgModal");
  if(m2){
    refreshDomain(m2); setMeshLayer(m2,_meshGeojson,true); setTimeout(()=>m2.invalidateSize(),80);
    // Keep Leaflet in sync while the user drags the panel's resize handle.
    const panel=document.getElementById("mapModalPanel");
    if(panel && !panel._ro && window.ResizeObserver){
      panel._ro=new ResizeObserver(()=>m2.invalidateSize());
      panel._ro.observe(panel);
    }
  }
}
function closeMapModal(){const mm=document.getElementById("mapModal"); if(mm) mm.style.display="none";}
function clearLog(){const lb=document.getElementById("logbox"); if(lb) lb.textContent="";}
function setLogStatus(text, ok){
  const s=document.getElementById("logStatus"); if(s) s.textContent=text;
  const d=document.getElementById("logDot"); if(d) d.classList.toggle("on", ok!==false);
}
function setRunControls(on){
  const runBtn=document.getElementById("runBtn"), killBtn=document.getElementById("killBtn");
  if(runBtn){
    runBtn.disabled=on;
    runBtn.style.opacity=on?"0.55":"";
    runBtn.style.cursor=on?"not-allowed":"";
    runBtn.textContent=on?(lang?"⏳ 运行中…":"⏳ Running…"):("▶ "+(lang?"运行":"Run"));
  }
  if(killBtn) killBtn.style.display=on?"inline-flex":"none";
}
async function killRun(){
  const inv = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
  const lb=document.getElementById("logbox");
  const add=(s)=>{ if(lb){ const div=document.createElement("div"); div.textContent=s; lb.appendChild(div); lb.scrollTop=lb.scrollHeight; } };
  if(!inv){ add("✗ "+(lang?"无法连接后端":"backend unavailable")); return; }
  try{
    const r = await inv("kill_run");
    add("■ "+(r?(lang?"已终止正在运行的引擎":"killed the running engine"):(lang?"当前没有正在运行的程序":"no running process")));
    if(r){ setRunControls(false); const rt=document.getElementById("rtext"); if(rt) rt.textContent=lang?"已终止":"killed"; }
  }catch(e){ add("✗ kill: "+e); }
}

/* ---------------- toggles ---------------- */
document.getElementById("themeBtn").onclick=function(){
  const r=document.documentElement, dark=r.getAttribute("data-theme")==="dark";
  r.setAttribute("data-theme",dark?"light":"dark"); this.textContent=dark?"🌙":"☀️"; drawMap();
};
document.getElementById("langSeg").onclick=e=>{const b=e.target.closest("[data-lang]");if(!b)return;
  document.querySelectorAll("#langSeg button").forEach(x=>x.classList.toggle("on",x===b));
  lang=b.dataset.lang==="zh"?1:0; applyI18n();};
document.getElementById("liveTabs").onclick=e=>{const b=e.target.closest("[data-pane]");if(!b)return;
  document.querySelectorAll("#liveTabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".live-pane").forEach(p=>p.classList.toggle("on",p.dataset.pane===b.dataset.pane));};
function backendUnavailableRun(){
  document.getElementById("rdot").classList.remove("on");
  document.getElementById("rtext").textContent=lang?"无法连接后端":"backend unavailable";
  document.querySelectorAll("#liveTabs button").forEach(x=>x.classList.toggle("on",x.dataset.pane==="log"));
  document.querySelectorAll(".live-pane").forEach(p=>p.classList.toggle("on",p.dataset.pane==="log"));
  clearLog();
  setLogStatus(lang?"无法连接后端":"backend unavailable", false);
}

/* ---------------- resizable rail / map panels (draggable splitters) ---------------- */
function setupSplitters(){
  const root=document.documentElement;
  try{ const rw=localStorage.getItem("em.railW"); if(rw) root.style.setProperty("--rail-w",rw); }catch(e){}
  try{ const lw=localStorage.getItem("em.liveW"); if(lw) root.style.setProperty("--live-w",lw); }catch(e){}
  const mk=(parent,side)=>{
    if(!parent||parent.querySelector(":scope > .splitter")) return;
    parent.style.position="relative";
    const s=document.createElement("div");
    s.className="splitter";
    s.style.cssText="position:absolute;top:0;bottom:0;"+side+":-3px;width:7px;cursor:col-resize;z-index:30";
    parent.appendChild(s);
    s.addEventListener("mousedown",ev0=>{
      ev0.preventDefault(); s.classList.add("drag"); document.body.style.userSelect="none";
      const move=ev=>{
        if(side==="right"){ // left rail: width = pointer X
          const w=Math.max(180,Math.min(460,ev.clientX));
          root.style.setProperty("--rail-w",w+"px"); try{localStorage.setItem("em.railW",w+"px");}catch(e){}
        }else{ // map panel (drag its left edge): width grows leftward
          const w=Math.max(280,Math.min(Math.round(window.innerWidth*0.6),window.innerWidth-ev.clientX));
          root.style.setProperty("--live-w",w+"px"); try{localStorage.setItem("em.liveW",w+"px");}catch(e){}
          if(typeof drawMap==="function") drawMap();
        }
      };
      const up=()=>{s.classList.remove("drag");document.body.style.userSelect="";document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);};
      document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    });
  };
  mk(document.querySelector(".rail"),"right");
  mk(document.querySelector(".live"),"left");
}

renderSteps(); renderStep(cur); drawMap(); applyI18n(); setupSplitters();
</script>

<script>
/* ============================================================================
   EarthMesh Studio — Tauri backend bridge.
   Active ONLY inside the Tauri webview (window.__TAURI__ present). In a plain
   browser this whole block is a no-op, so this file still opens standalone as
   the static frontend shell. Classic script tags share one global lexical scope, so
   we read/override the frontend globals tpl / resVal / resUnitIdx / TPL / cur /
   renderStep / renderSteps here.

   Model: everything derives from the UI except per-layer file edits, which we
   track in `layerEdits` and re-apply when composing the canonical YAML. Rust is
   the single source of truth for the project schema — the frontend never builds
   it by hand.
   ============================================================================ */
(function () {
  if (!(window.__TAURI__ && window.__TAURI__.core)) return;
  const invoke = window.__TAURI__.core.invoke;

  function currentResolution() {
    try {
      if (typeof resUnitIdx !== "undefined" && typeof resVal !== "undefined") {
        if (resUnitIdx === 1) return { nxp: Math.round(resVal), approxKm: null };
        return { nxp: null, approxKm: resVal };
      }
    } catch (e) {}
    return { nxp: 40, approxKm: null };
  }
  function currentNxp() {
    if (lastSummary && lastSummary.effective_nxp != null) return lastSummary.effective_nxp;
    const r = currentResolution();
    if (r.nxp != null) return r.nxp;
    return r.approxKm > 0 ? Math.max(1, Math.round(KM_NXP_ANCHOR / r.approxKm)) : 0;
  }
  function currentIntent() {
    try { return (TPL[tpl] && TPL[tpl].intent) || "Custom"; } catch (e) { return "Custom"; }
  }
  function projectName() {
    const el = document.querySelector(".proj-name");
    if (el) return el.value.trim();
    return "earthmesh-project";
  }
  const zh = () => (typeof lang !== "undefined" && lang) ? true : false;

  // ---- live project model ----------------------------------------------------
  const layerEdits = {};   // layer id -> { path, enabled }
  let domainEdit = null;   // null | {kind:'global'} | {kind:'bbox', w,e,s,n,seaRatio} | {kind:'hidden', shape}
  let qualityEdit = null;  // null | { minAngle, block }
  let metadataEdit = { authors: [], description: "" };
  let baseProjectYaml = null; // opened YAML; preserves fields the UI does not expose yet
  let projectActive = false; // a project has been created/opened this session → show the summary
  let lastSummary = null;    // cached ProjectSummary (+ _valid/_err) for the summary panel
  let _lastQuality = null;   // cached mesh_quality, shown again when step 6 rebuilds
  // maxPasses is owned by the static step renderer; the Tauri bridge reads/writes it here.

  // Refinement runs only if at least one criterion has a data file — otherwise
  // a uniform mesh (which needs no NetCDF input and always runs).
  function hasEnabledThresholdLayer(summary) {
    // Only THRESHOLD criteria drive refinement. The landcover (the land/sea MASK
    // source) and hydro inputs must NOT flip refinement on — doing so is what sent
    // a data-less land/ocean run down the refine path and failed.
    return ((summary && summary.layers) || []).some((l) =>
      l.role_kind === "threshold" && !!l.path && !!l.enabled);
  }

  async function composeYaml() {
    const resolution = currentResolution();
    let yaml = await invoke("scaffold_project",
      { name: projectName(), intent: currentIntent(), nxp: resolution.nxp, approxKm: resolution.approxKm });
    yaml = await invoke("set_project_metadata",
      { yaml, name: projectName(), authors: metadataEdit.authors || [], description: metadataEdit.description || "" });
    // Derive the domain from the LIVE regional flag + bbox — not a stale
    // domainEdit (template cards flip `regional` without updating domainEdit).
    if (typeof regional !== "undefined" && !regional) {
      yaml = await invoke("set_domain_global", { yaml });
    } else {
      const b = (typeof domBbox !== "undefined" && domBbox) ? domBbox : DEFAULT_BBOX;
      const seaRatio = domainEdit && domainEdit.kind === "bbox" ? (domainEdit.seaRatio ?? null) : null;
      yaml = await invoke("set_domain_bbox", { yaml, w: b[0], e: b[1], s: b[2], n: b[3], seaRatio });
    }
    for (const id of Object.keys(layerEdits)) {
      const e = layerEdits[id];
      try { yaml = await invoke("set_layer_path", { yaml, id, path: e.path, enabled: e.enabled }); }
      catch (err) { /* id not in this preset's layer set — skip */ }
    }
    if (baseProjectYaml) {
      yaml = await invoke("preserve_unexposed_project_fields", { baseYaml: baseProjectYaml, yaml, preserveDomain: !!hiddenDomainShape });
    }
    const summary = await invoke("project_summary", { yaml });
    const refinementEnabled = hasEnabledThresholdLayer(summary);
    const refinementPasses = maxPasses == null ? summary.max_passes : (refinementEnabled ? Math.min(9, Math.max(1, maxPasses)) : maxPasses);
    yaml = await invoke("set_refinement", { yaml, enabled: refinementEnabled, maxPasses: refinementPasses });
    if (qualityEdit) {
      yaml = await invoke("set_quality",
        { yaml, minAngleDeg: qualityEdit.minAngle, block: qualityEdit.block });
    }
    return yaml;
  }

  const api = {
    listCriteria: () => invoke("list_criteria"),
    validate:   (yaml) => invoke("validate_project", { yaml }),
    summary:    (yaml) => invoke("project_summary", { yaml }),
    pickDataFile: () => invoke("pick_data_file"),
    pickDataFolder: () => invoke("pick_data_folder"),
    openProject:  () => invoke("open_project"),
    saveProject:  (yaml) => invoke("save_project", { yaml }),
    runProject:   (yaml, outdir) => invoke("run_project", { yaml, outdir: outdir || null }),
    composeYaml, layerEdits,
  };
  window.emProject = api;

  function logLine(txt) {
    const box = document.getElementById("logbox") || document.querySelector('.live-pane[data-pane="log"]');
    if (box) {
      const div = document.createElement("div");
      div.style.whiteSpace = "pre-wrap";
      div.textContent = txt;
      box.appendChild(div);
    }
    console.log("[EarthMesh]", txt);
  }

  // Clear startup placeholders so no stale values show before a real run.
  function clearStartupPlaceholders() {
    const lb = document.getElementById("logbox"); if (lb) lb.textContent = "";
    clearRunArtifacts();
  }

  function clearRunArtifacts() {
    hasRun = false;
    runInfo = null;
    _lastQuality = null;
    if (typeof applyMesh === "function") applyMesh(null);
    document.querySelectorAll('.live-pane[data-pane="quality"] .mini-metric b')
      .forEach((b) => { b.textContent = "—"; b.style.color = "var(--muted)"; });
    document.querySelectorAll(".badge.pass").forEach((b) => { b.style.display = "none"; });
  }

  function selectTemplate(k) {
    const changed = k !== tpl;
    if (changed) {
      tpl = k;
      regional = !TPL[tpl].global;
      hiddenDomainShape = null;
      for (const id of Object.keys(layerEdits)) delete layerEdits[id];
      baseProjectYaml = null;
      domainEdit = null;
      qualityEdit = null;
      maxPasses = null;
      clearRunArtifacts();
    }
    cur = 1;
    renderSteps();
    renderStep(1);
  }

  // ---- live data-layer panel ------------------------------------------------
  // Replace the static step-3 table body with rows from the live ProjectConfig;
  // each Browse opens the native picker and writes back via set_layer_path.
  async function enhanceLayerStep() {
    const table = document.querySelector("#work table.layers");
    if (!table) return;
    let sum;
    try { sum = await api.summary(await composeYaml()); }
    catch (e) { logLine("✗ layers: " + e); return; }
    const tbody = table.querySelector("tbody");
    if (!tbody) return;
    const z = zh();
    tbody.textContent = "";
    sum.layers.forEach((l) => {
      const tr = document.createElement("tr");
      tr.dataset.layer = l.id;
      tr.dataset.folder = l.wants_folder ? "1" : "0";
      tr.dataset.path = l.path || "";
      tr.dataset.enabled = l.enabled ? "1" : "0";

      const swCell = document.createElement("td");
      const sw = document.createElement("div");
      sw.className = "sw" + (l.enabled && l.path ? " on" : "");
      sw.title = z ? "启用/禁用该图层" : "enable/disable layer";
      sw.style.cursor = l.path ? "pointer" : "default";
      swCell.appendChild(sw);

      const idCell = document.createElement("td");
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = "var(--accent)";
      const id = document.createElement("b");
      id.textContent = l.id;
      idCell.append(dot, id);
      if (l.wants_folder) {
        const tag = document.createElement("span");
        tag.style.cssText = "color:var(--muted);font-size:11px";
        tag.textContent = " · " + (z ? "分块目录" : "tiled dir");
        idCell.appendChild(tag);
      }

      const roleCell = document.createElement("td");
      roleCell.style.color = "var(--muted)";
      roleCell.textContent = l.role;

      const pathCell = document.createElement("td");
      if (l.path) {
        const path = document.createElement("span");
        path.className = "path";
        path.textContent = l.path;
        const clear = document.createElement("span");
        clear.className = "btn-ghost em-clear";
        clear.style.cssText = "padding:2px 7px;cursor:pointer";
        clear.textContent = "✕";
        pathCell.append(path, " ", clear);
      } else {
        const browse = document.createElement("span");
        browse.className = "btn-ghost em-browse";
        browse.style.cssText = "padding:3px 9px;cursor:pointer";
        browse.textContent = l.wants_folder ? (z ? "📁 选择文件夹" : "📁 Browse folder") : (z ? "📂 浏览" : "📂 Browse");
        pathCell.appendChild(browse);
      }

      const statusCell = document.createElement("td");
      const cov = document.createElement("span");
      cov.className = "cov " + (l.path ? "ok" : "no");
      cov.textContent = l.path ? (z ? "已选择" : "selected") : (z ? "未设置·判据禁用" : "unset · off");
      statusCell.appendChild(cov);

      tr.append(swCell, idCell, roleCell, pathCell, statusCell);
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll(".em-browse").forEach((b) => {
      b.onclick = async () => {
        const tr = b.closest("[data-layer]");
        const id = tr.dataset.layer;
        const folder = tr.dataset.folder === "1";
        let p;
        try { p = await (folder ? api.pickDataFolder() : api.pickDataFile()); }
        catch (e) { logLine("✗ " + e); return; }
        if (!p) return;
        layerEdits[id] = { path: p, enabled: true };
        enhanceLayerStep();
      };
    });
    tbody.querySelectorAll(".em-clear").forEach((b) => {
      b.onclick = () => {
        const id = b.closest("[data-layer]").dataset.layer;
        layerEdits[id] = { path: "", enabled: false };
        enhanceLayerStep();
      };
    });
    // on/off switch: enable/disable a layer that already has a file set
    tbody.querySelectorAll("tr[data-layer] .sw").forEach((sw) => {
      sw.onclick = () => {
        const tr = sw.closest("[data-layer]");
        const id = tr.dataset.layer;
        const path = tr.dataset.path || "";
        if (!path) return; // nothing to toggle without a file
        layerEdits[id] = { path, enabled: tr.dataset.enabled !== "1" };
        enhanceLayerStep();
      };
    });
    const card = table.closest(".card");
    const ch = card && card.querySelector(".ch");
    if (ch) ch.textContent = (z ? "实时映射 ProjectConfig.data_layers · " : "live ProjectConfig.data_layers · ")
      + sum.layers.length + (z ? " 个图层" : " layers");
  }

  // ---- domain (step 2) -> DomainConfig --------------------------------------
  const num = (el) => parseFloat(String(el.value).replace(/[^\d.\-]/g, ""));
  function readBbox() {
    const ins = document.querySelectorAll("#work .grid2 input.input"); // [W,E,S,N]
    if (ins.length < 4) return null;
    const b = { w: num(ins[0]), e: num(ins[1]), s: num(ins[2]), n: num(ins[3]) };
    return Object.values(b).every((x) => !isNaN(x)) ? b : null;
  }
  function enhanceDomainStep() {
    // The base UI owns the Global/Regional toggle (var `regional`) and only
    // renders the bbox inputs in regional mode; we mirror that into domainEdit.
    if (hiddenDomainShape && domainEdit && domainEdit.kind === "hidden") return;
    if (typeof regional !== "undefined" && !regional) { domainEdit = { kind: "global" }; return; }
    const ratio = document.getElementById("seaRatioInput");
    const ratioText = document.getElementById("seaRatioText");
    const readSeaRatio = () => {
      if (!ratio) return domainEdit && domainEdit.kind === "bbox" ? domainEdit.seaRatio : null;
      const v = parseFloat(ratio.value);
      return isNaN(v) ? null : v / 100;
    };
    const paintSeaRatio = () => {
      if (ratioText && ratio) ratioText.textContent = ratio.value + "% " + (zh() ? "海洋" : "ocean");
    };
    const sync = () => {
      const b = readBbox();
      if (b) {
        domainEdit = Object.assign({ kind: "bbox", seaRatio: readSeaRatio() }, b);
        domBbox = [b.w, b.e, b.s, b.n];
        paintSeaRatio();
        if (typeof updateEstimate === "function") updateEstimate();
      }
    };
    if (domainEdit && domainEdit.kind === "bbox") {
      const ins = document.querySelectorAll("#work .grid2 input.input");
      if (ins.length >= 4) { ins[0].value = domainEdit.w; ins[1].value = domainEdit.e; ins[2].value = domainEdit.s; ins[3].value = domainEdit.n; }
      if (ratio && domainEdit.seaRatio != null) ratio.value = Math.round(domainEdit.seaRatio * 100);
    } else {
      sync(); // initialize from the shown default inputs
    }
    document.querySelectorAll("#work .grid2 input.input").forEach((inp) => inp.addEventListener("input", sync));
    if (ratio) ratio.addEventListener("input", sync);
    paintSeaRatio();
  }

  // ---- quality (step 5) -> QualityConfig ------------------------------------
  async function enhanceQualityStep() {
    const sel = document.querySelector("#work .card select.select"); // on-violation
    const minIn = document.querySelector("#work .quality-detail input.input"); // min angle
    if (!qualityEdit) {
      const s = await refreshSummary();
      if (s) qualityEdit = { minAngle: s.min_angle_deg, block: s.on_violation === "block" };
    }
    const readQ = () => {
      let minAngle = 0, block = false;
      if (minIn) { const v = num(minIn); if (minIn.value.trim() && !isNaN(v)) minAngle = v; }
      if (sel) block = sel.selectedIndex === 1; // 0 Warn · 1 Fail->Block
      return { minAngle, block };
    };
    const update = () => { qualityEdit = readQ(); };
    if (sel) sel.addEventListener("change", update);
    if (minIn) minIn.addEventListener("input", update);
    if (qualityEdit) {
      if (minIn) minIn.value = qualityEdit.minAngle + "°";
      if (sel) sel.selectedIndex = qualityEdit.block ? 1 : 0;
    }
  }

  // ---- refinement (step 4) -> template's criteria ---------------------------
  // Render the criteria the selected template uses (its threshold layers),
  // greying out any whose data layer isn't set, plus the max-passes control.
  async function enhanceRefinementStep() {
    const critCard = document.querySelector("#work .card");
    if (!critCard) return;
    let sum, cat;
    try { sum = await api.summary(await composeYaml()); cat = await api.listCriteria(); }
    catch (e) { logLine("✗ refinement: " + e); return; }
    if (maxPasses == null) maxPasses = sum.max_passes;
    const byStem = {}; cat.forEach((c) => { byStem[c.stem] = c; });
    const crits = sum.layers.filter((l) => l.role_kind === "threshold");
    const z = zh();
    const criterionRow = (l) => {
      const c = byStem[l.id] || { label: l.id, unit: "", physical_process: "", help: "" };
      const hasData = !!l.path;
      const on = hasData && l.enabled;
      const row = document.createElement("div");
      row.className = "em-crit";
      row.dataset.crit = l.id;
      row.dataset.has = hasData ? "1" : "0";
      row.dataset.path = l.path || "";
      row.dataset.enabled = l.enabled ? "1" : "0";
      row.style.cssText = "display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;opacity:" + (hasData ? "1" : "0.55");
      const tog = document.createElement("div");
      tog.className = "em-tog";
      tog.style.cssText = "width:38px;height:22px;border-radius:999px;flex:none;position:relative;background:" + (on ? "var(--accent)" : "var(--border)") + ";cursor:" + (hasData ? "pointer" : "not-allowed");
      const knob = document.createElement("div");
      knob.style.cssText = "position:absolute;top:2px;left:" + (on ? "18px" : "2px") + ";width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s";
      tog.appendChild(knob);
      const text = document.createElement("div");
      text.style.cssText = "flex:1;min-width:0";
      const label = document.createElement("div");
      label.style.cssText = "font-weight:650;font-size:14px";
      label.textContent = c.label;
      const help = document.createElement("div");
      help.style.cssText = "color:var(--muted);font-size:11.5px;margin-top:1px";
      help.textContent = (c.physical_process || c.help || "") + (c.unit ? " · " + c.unit : "");
      text.append(label, help);
      const badge = document.createElement("span");
      badge.style.cssText = "font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;flex:none;background:" + (hasData ? "color-mix(in srgb,var(--pass) 18%,transparent)" : "var(--border)") + ";color:" + (hasData ? "var(--pass)" : "var(--muted)");
      badge.textContent = hasData ? (z ? "数据 ✓" : "data ✓") : (z ? "缺数据·禁用" : "no data");
      row.append(tog, text, badge);
      return row;
    };

    const nMax = 9;
    const refinementEnabled = hasEnabledThresholdLayer(sum);
    if (refinementEnabled) {
      if (maxPasses > nMax) maxPasses = nMax;
      if (maxPasses < 1) maxPasses = 1;
    }
    const shownPasses = Math.min(nMax, Math.max(1, maxPasses || 1));
    const fineAt = (n) => (cellKm() / Math.pow(2, n));
    const fmtKm = (v) => v.toFixed(v < 10 ? 2 : 1) + " km";
    const mp = `<div style="margin-top:6px;padding-top:14px;border-top:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">
        <div><span style="font-weight:650">${z ? "最大细化次数" : "Max refinement passes"}</span>
          <div style="color:var(--muted);font-size:11px">${z ? "保存到项目配置；后端校验范围 1–9" : "saved to project config; backend validates range 1–9"}</div></div>
        <span style="font-weight:750;font-size:16px;color:var(--accent)"><span id="mpVal">${shownPasses}</span> <span id="mpFine" style="font-size:11px;color:var(--muted)">→ ≈${fmtKm(fineAt(shownPasses))}</span></span>
      </div>
      <input type="range" id="mpRange" min="1" max="${nMax}" value="${shownPasses}" style="width:100%">
      <div style="display:flex;justify-content:space-between;color:var(--faint);font-size:10px;margin-top:3px"><span>1</span><span>${z ? "上限 " : "max "}${nMax} ≈ ${fmtKm(fineAt(nMax))}</span></div>
    </div>`;

    const ch = critCard.querySelector(".ch");
    while (ch && ch.nextSibling) ch.nextSibling.remove();
    if (ch) {
      const active = crits.filter((l) => l.path && l.enabled).length;
      ch.textContent = crits.length
        ? (z ? "判据随模板自动列出 · " : "criteria from the template · ")
          + active + "/" + crits.length + (z ? " 个有数据启用" : " active")
        : (z ? "此模板没有阈值细化判据" : "no threshold criteria for this template");
      let anchor = ch;
      crits.forEach((l) => {
        const row = criterionRow(l);
        anchor.parentNode.insertBefore(row, anchor.nextSibling);
        anchor = row;
      });
      if (crits.length) anchor.insertAdjacentHTML("afterend", mp);
    }
    // toggles (only for criteria that have data)
    critCard.querySelectorAll(".em-crit").forEach((row) => {
      if (row.dataset.has !== "1") return;
      const tog = row.querySelector(".em-tog");
      if (tog) tog.onclick = () => {
        const id = row.dataset.crit;
        const path = row.dataset.path || "";
        if (!path) return;
        layerEdits[id] = { path, enabled: row.dataset.enabled !== "1" };
        enhanceRefinementStep();
      };
    });
    // max passes slider
    const mpr = document.getElementById("mpRange");
    if (mpr) mpr.addEventListener("input", () => {
      maxPasses = +mpr.value;
      const v = document.getElementById("mpVal"); if (v) v.textContent = maxPasses;
      const f = document.getElementById("mpFine"); if (f) f.textContent = "→ ≈" + fmtKm(fineAt(maxPasses));
    });
  }

  // ---- run (step 6) ---------------------------------------------------------
  // The Run button lives in step 6's footer; wire the real run onto the fresh
  // element each time the step rebuilds.
  function enhanceRunStep() {
    const b = document.getElementById("runBtn");
    if (b) b.onclick = doRun;
    const ob = document.getElementById("openOutBtn");
    if (ob) ob.onclick = () => {
      if (runInfo && runInfo.outdir) invoke("open_path", { path: runInfo.outdir }).catch((e) => logLine("✗ " + e));
    };
    // Re-render the cached quality result when step 6 rebuilds its DOM.
    if (runInfo && runInfo.ok && _lastQuality) renderQualityCard(_lastQuality);
  }

  // renderStep is a function declaration => reassignable; wrap it to enhance
  // the steps that bind to the live config (domain / layers / refinement /
  // quality) and to wire the relocated Run button.
  if (typeof renderStep === "function") {
    const _renderStep = renderStep;
    renderStep = function (i) {
      _renderStep(i);
      if (i === 0) enhanceNewProjectStep();
      else if (i === 1) enhanceTargetOutputStep();
      else if (i === 2) enhanceDomainStep();
      else if (i === 3) enhanceLayerStep();
      else if (i === 4) enhanceRefinementStep();
      else if (i === 5) enhanceQualityStep();
      else if (i === 6) { enhanceRunStep(); enhanceTargetOutputStep(); }
    };
  }

  // ---- New / Open / Save — actions live in workflow step 0 (the
  // "Project" step), not the header. See onNew/onOpen/onSave + enhanceNewProjectStep().

  // ---- recent projects (persisted across restarts) --------------------------
  function loadRecents() {
    try { return JSON.parse(localStorage.getItem("em.recents") || "[]"); } catch (e) { return []; }
  }
  function pushRecent(path, name) {
    if (!path) return;
    try {
      let r = loadRecents().filter((x) => x.path !== path);
      r.unshift({ path, name: name || path.split(/[\\/]/).pop() });
      localStorage.setItem("em.recents", JSON.stringify(r.slice(0, 8)));
    } catch (e) {}
  }

  // Reflect a loaded + validated project into the UI (shared by Open and recents).
  async function reflectProject(res) {
    let sum;
    try { sum = await api.summary(res.yaml); } catch (e) { logLine("✗ " + e); return; }
    projectActive = true;
    baseProjectYaml = res.yaml;
    lastSummary = sum;
    clearRunArtifacts();
    try { await api.validate(res.yaml); lastSummary._valid = true; lastSummary._err = null; }
    catch (e) { lastSummary._valid = false; lastSummary._err = String(e); }
    try {
      const nameEl = document.querySelector(".proj-name");
      if (nameEl) nameEl.value = sum.name;
      metadataEdit = { authors: sum.authors || [], description: sum.description || "" };
      const isRegional = sum.domain === "regional";
      let matchingTpl = TPL.findIndex((t) => t.intent === sum.intent && t.global === !isRegional);
      if (matchingTpl < 0) matchingTpl = TPL.findIndex((t) => t.intent === sum.intent);
      if (matchingTpl >= 0) tpl = matchingTpl;
      if (sum.nxp != null) { resUnitIdx = 1; resVal = sum.nxp; }
      else if (sum.approx_km != null) { resUnitIdx = 0; resVal = sum.approx_km; }
      for (const k of Object.keys(layerEdits)) delete layerEdits[k];
      sum.layers.forEach((l) => { if (l.path) layerEdits[l.id] = { path: l.path, enabled: l.enabled }; });
      regional = !!sum.bbox;
      if (sum.bbox) domBbox = [sum.bbox[0], sum.bbox[1], sum.bbox[2], sum.bbox[3]];
      domainEdit = sum.bbox
        ? { kind: "bbox", w: sum.bbox[0], e: sum.bbox[1], s: sum.bbox[2], n: sum.bbox[3], seaRatio: sum.sea_ratio ?? null }
        : isRegional
          ? { kind: "hidden", shape: sum.domain_shape || "regional" }
          : { kind: "global" };
      hiddenDomainShape = domainEdit.kind === "hidden" ? domainEdit.shape : null;
      qualityEdit = { minAngle: sum.min_angle_deg, block: sum.on_violation === "block" };
      maxPasses = sum.max_passes;
      if (typeof renderSteps === "function") renderSteps();
      if (typeof renderStep === "function") renderStep(typeof cur !== "undefined" ? cur : 0);
    } catch (e) { /* best-effort reflect */ }
    pushRecent(res.path, sum.name);
    logLine("✓ opened " + res.path + " — intent " + sum.intent + ", NXP " + (sum.effective_nxp ?? sum.nxp ?? "?"));
  }

  async function onSave() {
    try {
      const yaml = await composeYaml();
      const path = await api.saveProject(yaml);
      if (path) {
        projectActive = true;
        await refreshSummary();
        pushRecent(path, projectName());
        renderProjectSummary();
        logLine("✓ saved " + path);
      }
      else logLine("save cancelled");
    } catch (e) { logLine("✗ save failed: " + e); }
  }

  async function onOpen() {
    let res;
    try { res = await api.openProject(); } catch (e) { logLine("✗ open failed: " + e); return; }
    if (!res) { logLine("open cancelled"); return; }
    await reflectProject(res);
  }

  // Reset to a clean default project (matches first-load state). Keep the chosen
  // output folder — that's a machine preference, not project data.
  function resetProject() {
    tpl = DEFAULT_TPL; regional = true; domBbox = [...DEFAULT_BBOX];
    resUnitIdx = 0; resVal = RES_UNITS[0].def; maxPasses = null;
    clearRunArtifacts();
    for (const k of Object.keys(layerEdits)) delete layerEdits[k];
    baseProjectYaml = null;
    domainEdit = null; qualityEdit = null;
    hiddenDomainShape = null;
    metadataEdit = { authors: [], description: "" };
    const nameEl = document.querySelector(".proj-name");
    if (nameEl) nameEl.value = "earthmesh-project";
  }

  // Compute the summary (+ validation) for the current UI state.
  async function refreshSummary() {
    try {
      const yaml = await composeYaml();
      lastSummary = await api.summary(yaml);
      try { await api.validate(yaml); lastSummary._valid = true; lastSummary._err = null; }
      catch (e) { lastSummary._valid = false; lastSummary._err = String(e); }
      return lastSummary;
    } catch (e) { lastSummary = null; return null; }
  }

  function cellShapeLabel(cell) {
    return String(cell || "").toLowerCase() === "tri"
      ? (zh() ? "三角形" : "Triangular")
      : (zh() ? "六边形" : "Hexagonal");
  }

  function paintTargetOutputs(summary) {
    const s = summary || lastSummary;
    if (!s) return;
    const model = s.model_format || "—";
    const modelIn = document.getElementById("targetModelOutput");
    const cellIn = document.getElementById("targetCellOutput");
    const ready = document.getElementById("readyModelOutput");
    const refine = document.getElementById("readyRefinementOutput");
    if (modelIn) modelIn.value = model;
    if (cellIn) cellIn.value = cellShapeLabel(s.cell);
    if (ready) ready.textContent = model;
    if (refine) refine.textContent = s.refine_enabled
      ? ((zh() ? "最多 " : "up to ") + s.max_passes + (zh() ? " 次" : " passes"))
      : (zh() ? "关闭" : "off");
  }

  async function enhanceTargetOutputStep() {
    const s = await refreshSummary();
    paintTargetOutputs(s);
  }

  async function onNew() {
    if (!confirm(zh() ? "新建会清空当前项目编辑，确定继续？（如需保留请先用 💾 保存）" : "Start a new project? Current edits will be cleared (use 💾 Save first to keep them).")) return;
    resetProject();
    projectActive = true;
    await refreshSummary();
    if (typeof renderSteps === "function") renderSteps();
    if (typeof renderStep === "function") renderStep(0);
    logLine(zh() ? "✓ 新建项目" : "✓ new project");
  }

  async function openRecent(path) {
    let res;
    try { res = await invoke("read_project", { path }); }
    catch (e) { logLine("✗ open " + path + ": " + e); return; }
    await reflectProject(res);
  }

  // ---- New Project (step 0): output-folder picker + real recent list --------
  function enhanceNewProjectStep() {
    // New / Open / Save actions (the header has none — they live here now)
    const nb = document.getElementById("projNew"); if (nb) nb.onclick = onNew;
    const ob2 = document.getElementById("projOpen"); if (ob2) ob2.onclick = onOpen;
    const sb2 = document.getElementById("projSave"); if (sb2) sb2.onclick = onSave;
    const nameStep = document.getElementById("projectNameStep");
    const nameTop = document.querySelector(".proj-name");
    const author = document.getElementById("projectAuthor");
    const desc = document.getElementById("projectDescription");
    if (nameStep && nameTop) nameStep.value = nameTop.value;
    if (author) author.value = (metadataEdit.authors || []).join(", ");
    if (desc) desc.value = metadataEdit.description || "";
    if (nameStep && nameTop) nameStep.oninput = () => { nameTop.value = nameStep.value; };
    if (author) author.oninput = () => { metadataEdit.authors = author.value.split(",").map((s) => s.trim()).filter(Boolean); };
    if (desc) desc.oninput = () => { metadataEdit.description = desc.value; };
    // output-folder picker
    const opb = document.getElementById("outPathBrowse");
    const t0 = document.getElementById("outPathText");
    if (t0 && outputPath) t0.textContent = "📁 " + outputPath; // reflect a remembered path
    if (opb) opb.onclick = async () => {
      let p; try { p = await api.pickDataFolder(); } catch (e) { logLine("✗ " + e); return; }
      if (!p) return;
      outputPath = p;
      try { localStorage.setItem("em.outputPath", p); } catch (e) {}
      const t = document.getElementById("outPathText");
      if (t) t.textContent = "📁 " + p;
    };
    // render recents into the "Recent projects" card (not the Project card)
    const cards = [...document.querySelectorAll("#work .card")];
    const card = cards.find((c) => /最近|Recent/.test((c.querySelector("h3") || {}).textContent || ""));
    if (!card) return;
    const z = zh();
    card.querySelectorAll(".browse,.recent-empty").forEach((e) => e.remove());
    const recents = loadRecents();
    if (!recents.length) {
      const empty = document.createElement("div");
      empty.className = "recent-empty";
      empty.style.cssText = "color:var(--muted);font-size:13px;padding:4px 2px;line-height:1.6";
      empty.textContent = z ? "暂无最近项目——保存或打开一个项目后会出现在这里。" : "No recent projects yet — Save or Open one and it shows here.";
      card.appendChild(empty);
    } else {
      recents.forEach((r) => {
        const div = document.createElement("div");
        div.className = "browse";
        div.style.cssText = "margin-bottom:8px;cursor:pointer";
        div.title = r.path;
        const label = document.createElement("span");
        label.className = "path";
        label.style.maxWidth = "none";
        label.textContent = "📄 " + (r.name || r.path);
        div.appendChild(label);
        div.onclick = () => openRecent(r.path);
        card.appendChild(div);
      });
    }
    const ch = card.querySelector(".ch");
    if (ch) ch.textContent = z ? "点击重开" : "Click to reopen";
    renderProjectSummary();
  }

  // Project summary panel (data layers / quality gate / validation), shown once
  // a project has been created or opened this session.
  function renderProjectSummary() {
    const sumEl = document.getElementById("projSummary");
    if (!sumEl) return;
    const z = zh();
    if (!(projectActive && lastSummary)) { sumEl.textContent = ""; return; }
    const s = lastSummary;
    const total = (s.layers || []).length;
    const on = (s.layers || []).filter((l) => l.enabled && l.path).length;
    const domain = s.domain_shape === "bbox" && s.bbox
      ? (z ? "区域矩形框" : "regional bbox")
      : (s.domain_shape === "global"
        ? (z ? "全球" : "global")
        : ((z ? "保留隐藏区域：" : "preserved regional: ") + (s.domain_shape || s.domain || "—")));
    const gate = (s.min_angle_deg != null)
      ? (s.min_angle_deg + "° · " + (s.on_violation === "block" ? (z ? "违规即停" : "block") : (z ? "违规告警" : "warn")))
      : "—";
    const ok = !!s._valid;
    sumEl.innerHTML =
      `<div class="card"><h3>${z ? "项目摘要" : "Project summary"}</h3>
         <div class="ch">${z ? "新建/打开后的项目状态" : "Status of the created/opened project"}</div>
         <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-md);margin-top:10px">
           <div class="metric"><div class="mv" id="projectSummaryLayers"></div><div class="ml">${z ? "数据图层（启用/总）" : "Data layers (on/total)"}</div></div>
           <div class="metric"><div class="mv" id="projectSummaryDomain" style="font-size:15px"></div><div class="ml">${z ? "计算域" : "Domain"}</div></div>
           <div class="metric"><div class="mv" id="projectSummaryGate" style="font-size:15px"></div><div class="ml">${z ? "质量门限（最小角）" : "Quality gate (min angle)"}</div></div>
           <div class="metric"><div class="mv" id="projectSummaryValidation" style="font-size:15px;color:${ok ? "#22a06b" : "#e5484d"}"></div><div class="ml">${z ? "校验状态" : "Validation"}</div></div>
         </div>
         ${ok ? "" : `<div id="projectSummaryError" style="color:#e5484d;font-size:12px;margin-top:10px;white-space:pre-wrap"></div>`}
       </div>`;
    const layersEl = document.getElementById("projectSummaryLayers");
    const domainEl = document.getElementById("projectSummaryDomain");
    const gateEl = document.getElementById("projectSummaryGate");
    const validEl = document.getElementById("projectSummaryValidation");
    if (layersEl) layersEl.textContent = on + "/" + total;
    if (domainEl) domainEl.textContent = domain;
    if (gateEl) gateEl.textContent = gate;
    if (validEl) validEl.textContent = ok ? (z ? "✓ 通过" : "✓ valid") : (z ? "✗ 失败" : "✗ invalid");
    const err = document.getElementById("projectSummaryError");
    if (err) err.textContent = (s._err || "").slice(0, 400);
  }

  clearStartupPlaceholders();
  // remember the output folder across sessions
  try { const sp = localStorage.getItem("em.outputPath"); if (sp) outputPath = sp; } catch (e) {}

  // Startup proof that the Tauri backend and criterion catalog are reachable.
  api.listCriteria()
    .then((cs) => setLogStatus("✓ " + (zh() ? "Rust 后端已连接 — 注册了 " + cs.length + " 条细化判据" : "Rust backend connected — " + cs.length + " refinement criteria registered"), true))
    .catch((e) => setLogStatus("✗ backend error: " + e, false));
  // Mirror the static frontend's default regional bbox so a
  // Save before visiting step 2 still reflects what's shown.
  if (typeof regional !== "undefined" && regional)
    domainEdit = { kind: "bbox", w: DEFAULT_BBOX[0], e: DEFAULT_BBOX[1], s: DEFAULT_BBOX[2], n: DEFAULT_BBOX[3] };
  if (typeof cur !== "undefined") {
    if (cur === 0) enhanceNewProjectStep();
    else if (cur === 2) enhanceDomainStep();
    else if (cur === 3) enhanceLayerStep();
    else if (cur === 4) enhanceRefinementStep();
    else if (cur === 5) enhanceQualityStep();
    else if (cur === 6) enhanceRunStep();
  }

  // Stream mkgrd stdout/stderr (emitted by run_project) into the Log pane.
  if (window.__TAURI__.event && window.__TAURI__.event.listen) {
    window.__TAURI__.event.listen("mkgrd://log", (ev) => logLine(String(ev.payload)));
  }

  // Run -> compose YAML -> spawn the mesh engine, stream logs, report status.
  async function doRun() {
    const rtext = document.getElementById("rtext");
    const rdot = document.getElementById("rdot");
    const setStatus = (txt, done) => {
      if (rtext) rtext.textContent = txt;
      if (rdot) rdot.classList.toggle("on", !!done);
    };
    setStatus(zh() ? "运行中…" : "running…", false);
    setRunControls(true);
    clearRunArtifacts();
    // show the Log pane because the Run button now lives inside the step footer
    document.querySelectorAll("#liveTabs button").forEach(x => x.classList.toggle("on", x.dataset.pane === "log"));
    document.querySelectorAll(".live-pane").forEach(p => p.classList.toggle("on", p.dataset.pane === "log"));
    let yaml;
    try { yaml = await composeYaml(); } catch (e) { logLine("✗ " + e); setStatus(zh() ? "运行失败" : "failed", true); setRunControls(false); return; }
    try { lastSummary = await api.summary(yaml); } catch (e) {}
    logLine("\n▶ " + (zh() ? "启动网格引擎（" : "starting mesh engine (") + currentIntent() + ", NXP=" + currentNxp() + ")");
    try {
      const r = await api.runProject(yaml, outputPath || null);
      logLine(r.ok ? ("✓ " + (zh() ? "完成 — 输出在 " : "done — outputs in ") + r.outdir)
                   : ("✗ " + (zh() ? "退出码 " : "exited with code ") + r.code));
      setStatus(r.ok ? (zh() ? "运行完成" : "finished") : (zh() ? "运行失败" : "failed"), true);
      hasRun = true; runInfo = { ok: r.ok, outdir: r.outdir, code: r.code, gridfile: r.gridfile };
    } catch (e) {
      logLine("✗ " + (zh() ? "运行失败: " : "run failed: ") + e);
      setStatus(zh() ? "运行失败" : "failed", true);
      hasRun = true; runInfo = { ok: false, outdir: "", code: null };
    }
    setRunControls(false);
    if (typeof cur !== "undefined" && cur === 6 && typeof renderStep === "function") renderStep(6);
    if (runInfo && runInfo.ok && runInfo.gridfile) loadQualityAndMesh(runInfo.gridfile);
    else if (runInfo && runInfo.ok) {
      logLine(zh() ? "⚠ 引擎未报告 gridfile；跳过质量分析和地图叠加。" : "⚠ engine did not report gridfile; skipping quality and map overlay.");
      renderMissingGridfile();
    }
  }

  function renderQualityNote(text) {
    const card = document.getElementById("qualityCard");
    if (!card) return;
    card.textContent = "";
    const h = document.createElement("h3"); h.textContent = zh() ? "质量指标" : "Quality metrics";
    const note = document.createElement("div"); note.className = "ch"; note.textContent = text;
    card.append(h, note);
  }
  function renderMissingGridfile() {
    renderQualityNote(zh() ? "引擎没有在日志中报告 gridfile，无法自动解析质量报告或叠加网格。" : "The engine did not report a gridfile in the log, so quality parsing and map overlay were skipped.");
  }

  // After a successful run: parse mesh quality into the step-6 card, and overlay
  // the generated mesh on the map using the ProjectSummary cell shape.
  async function loadQualityAndMesh(gridfile) {
    renderQualityNote(zh() ? "分析中…" : "analyzing…");
    const kind = (lastSummary && String(lastSummary.cell || "").toLowerCase() === "tri") ? "tri" : "hex";
    invoke("mesh_quality", { gridfile, kind })
      .then((q) => { _lastQuality = q; renderQualityCard(q); })
      .catch((e) => renderQualityNote((zh() ? "质量分析失败：" : "quality failed: ") + e));
    invoke("mesh_cell_polygons", { gridfile, kind, maxCells: null })
      .then((txt) => { applyMesh(JSON.parse(txt)); logLine(zh() ? "✓ 网格已叠加到地图" : "✓ mesh overlaid on map"); })
      .catch((e) => logLine((zh() ? "网格叠加失败：" : "mesh overlay failed: ") + e));
  }

  // A distribution row: [min..max] track with the μ±σ band + mean tick.
  function statBar(label, s, unit) {
    if (!s || (s.max === 0 && s.min === 0 && s.mean === 0)) return "";
    const W = 240, H = 26, pad = 3;
    const min = s.min, max = s.max, mean = s.mean, std = s.std || 0;
    const range = (max - min) || 1;
    const x = (v) => pad + (Math.max(min, Math.min(max, v)) - min) / range * (W - 2 * pad);
    const lo = Math.max(min, mean - std), hi = Math.min(max, mean + std);
    const fmt = (v) => Math.abs(v) >= 100 ? v.toFixed(0) : (Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3));
    const u = unit ? " " + unit : "";
    return `<div style="margin:9px 0">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">
        <span style="font-weight:600">${label}</span>
        <span style="color:var(--muted)">μ ${fmt(mean)}${u} · σ ${fmt(std)}</span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
        <line x1="${x(min)}" y1="${H/2}" x2="${x(max)}" y2="${H/2}" stroke="var(--border)" stroke-width="2"/>
        <rect x="${x(lo)}" y="${H/2-6}" width="${Math.max(1,x(hi)-x(lo))}" height="12" fill="var(--accent)" fill-opacity="0.25" rx="2"/>
        <line x1="${x(mean)}" y1="${H/2-8}" x2="${x(mean)}" y2="${H/2+8}" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="${x(min)}" cy="${H/2}" r="2.6" fill="var(--muted)"/><circle cx="${x(max)}" cy="${H/2}" r="2.6" fill="var(--muted)"/></svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--faint)"><span>${fmt(min)}</span><span>${fmt(max)}${u}</span></div>
    </div>`;
  }

  function renderQualityCard(q) {
    const card = document.getElementById("qualityCard"); if (!card) return;
    const z = zh();
    const verdict = (q.verdict || "unknown").toUpperCase();
    const color = q.verdict === "pass" ? "var(--pass)" : (q.verdict === "fail" ? "#e5484d" : "var(--warn)");
    const num = (n) => (typeof n === "number" ? n.toLocaleString() : n);
    card.innerHTML = `<h3>${z ? "质量指标" : "Quality metrics"}</h3>
      <div style="margin:6px 0"><span id="qualityVerdictBadge" style="display:inline-block;padding:3px 10px;border-radius:6px;color:#fff;font-weight:800;font-size:12px;letter-spacing:.03em;background:${color}"></span></div>
      <div class="grid2">
        ${field(z ? "单元数" : "Cells", `<b id="qualityCells" style="font-size:15px"></b>`)}
        ${field(z ? "顶点数" : "Vertices", `<b id="qualityVertices" style="font-size:15px"></b>`)}
        ${field(z ? "边数" : "Edges", `<b id="qualityEdges" style="font-size:15px"></b>`)}
        ${field(z ? "角度范围" : "Angle range", `<b id="qualityAngleRange" style="font-size:15px;color:${color}"></b>`)}
      </div>
      <div class="ch" style="margin-top:10px">${z ? "分布（μ±σ 区间 + 极值）" : "Distributions (μ±σ band + range)"}</div>
      ${statBar(z ? "边长" : "Edge length", q.edge_length_km, "km")}
      ${statBar(z ? "纵横比" : "Aspect ratio", q.aspect_ratio, "")}
      ${statBar(z ? "紧致度" : "Compactness", q.compactness, "")}
      ${statBar(z ? "单元面积" : "Cell area", q.cell_area, "")}`;
    const text = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
    text("qualityVerdictBadge", verdict);
    text("qualityCells", num(q.cell_count));
    text("qualityVertices", num(q.vertex_count));
    text("qualityEdges", num(q.edge_count));
    text("qualityAngleRange", (q.min_angle_deg || 0).toFixed(1) + "°–" + (q.max_angle_deg || 0).toFixed(1) + "°");
    if (q.gates && q.gates.length) {
      const title = document.createElement("div");
      title.className = "ch";
      title.style.marginTop = "10px";
      title.textContent = z ? "门禁" : "Gates";
      card.appendChild(title);
      q.gates.forEach((g) => {
        const col = g.level === "pass" ? "var(--pass)" : (g.level === "fail" ? "#e5484d" : "var(--warn)");
        const v = Math.abs(g.value) >= 100 ? g.value.toFixed(0) : g.value.toFixed(2);
        const row = document.createElement("div");
        row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:5px 2px;border-bottom:1px solid var(--border-soft);font-size:12.5px";
        const metric = document.createElement("span");
        metric.textContent = g.metric;
        const result = document.createElement("span");
        const value = document.createElement("b");
        value.textContent = v;
        const level = document.createElement("span");
        level.style.cssText = "display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;background:" + col;
        level.textContent = (g.level || "?").toUpperCase();
        result.append(value, " ", level);
        row.append(metric, result);
        card.appendChild(row);
      });
    }
    const issues = (q.topology || []).filter((t) => t[1] > 0)
      .concat([[z ? "零面积" : "zero-area", q.zero_area], [z ? "负面积" : "negative-area", q.negative_area], [z ? "自相交" : "self-intersection", q.self_intersection], [z ? "非法多边形" : "invalid polygon", q.invalid_polygon]].filter((t) => t[1] > 0));
    const issueTitle = document.createElement("div");
    issueTitle.className = "ch";
    issueTitle.style.marginTop = "10px";
    issueTitle.textContent = z ? "拓扑 / 退化" : "Topology / degeneracy";
    card.appendChild(issueTitle);
    if (issues.length) {
      issues.forEach((t) => {
        const issue = document.createElement("div");
        issue.style.cssText = "font-size:12px;color:var(--warn)";
        issue.textContent = "• " + t[0] + ": " + num(t[1]);
        card.appendChild(issue);
      });
    } else {
      const ok = document.createElement("div");
      ok.style.cssText = "font-size:12px;color:var(--pass)";
      ok.textContent = "✓ " + (z ? "无拓扑问题" : "no issues");
      card.appendChild(ok);
    }
    if (q.max_adjacent_resolution_ratio) {
      const ratio = document.createElement("div");
      ratio.style.cssText = "font-size:12px;color:var(--muted)";
      ratio.textContent = (z ? "最大相邻分辨率比" : "max adjacent res. ratio") + ": " + q.max_adjacent_resolution_ratio.toFixed(2);
      card.appendChild(ratio);
    }
    if (q.report_path || q.worst_cells_path) {
      const btns = document.createElement("div");
      btns.style.marginTop = "12px";
      if (q.report_path) {
        const report = document.createElement("span");
        report.className = "btn-ghost";
        report.id = "qReportBtn";
        report.style.cssText = "cursor:pointer;margin-right:8px";
        report.textContent = "📄 " + (z ? "质量报告" : "Report");
        btns.appendChild(report);
      }
      if (q.worst_cells_path) {
        const worst = document.createElement("span");
        worst.className = "btn-ghost";
        worst.id = "qWorstBtn";
        worst.style.cursor = "pointer";
        worst.textContent = "⚠ " + (z ? "最差单元" : "Worst cells");
        btns.appendChild(worst);
      }
      card.appendChild(btns);
    }
    const rb = document.getElementById("qReportBtn");
    if (rb && q.report_path) rb.onclick = () => invoke("open_path", { path: q.report_path }).catch((e) => logLine("✗ " + e));
    const wb = document.getElementById("qWorstBtn");
    if (wb && q.worst_cells_path) wb.onclick = () => invoke("open_path", { path: q.worst_cells_path }).catch((e) => logLine("✗ " + e));

    // reflect into the right-panel Quality tab (mini-metrics + verdict badge)
    const minis = document.querySelectorAll('.live-pane[data-pane="quality"] .mini-metric b');
    const setMini = (i, txt, col) => { if (minis[i]) { minis[i].textContent = txt; minis[i].style.color = col || "var(--text)"; } };
    setMini(0, num(q.cell_count));
    setMini(1, num(q.vertex_count));
    setMini(2, (q.min_angle_deg || 0).toFixed(1) + "°", color);
    if (q.aspect_ratio) setMini(3, q.aspect_ratio.max.toFixed(2));
    document.querySelectorAll('.live-pane[data-pane="quality"] .badge').forEach((b) => { b.style.display = ""; b.style.background = color; b.textContent = "● " + verdict; });
  }

  // The Run button moved into step 6's footer; enhanceRunStep() wires it each
  // time that step renders (see the renderStep wrapper above).
})();
</script>
