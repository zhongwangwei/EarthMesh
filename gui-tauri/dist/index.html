<!--
  EarthMesh Studio — static frontend
  Single-file, no build step. Tauri wires it to Rust; a browser shows the shell.
  Toggles: theme (light/dark), language (中/EN).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EarthMesh Studio</title>
<link rel="stylesheet" href="vendor/openlayers/ol.css"/>
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css"/>
<script src="vendor/openlayers/ol.js"></script>
<script src="vendor/maplibre/maplibre-gl-csp.js"></script>
<style>
:root{
  /* ---- light theme tokens (matches theme.rs Primer-like palette) ---- */
  --bg:#ffffff; --surface:#f6f8fa; --surface-2:#eef1f4; --elevated:#ffffff;
  --border:#d0d7de; --border-soft:#e4e8ec;
  --text:#1f2328; --muted:#656d76; --faint:#8b949e;
  --accent:#1f6feb; --accent-weak:#ddeaff; --accent-ink:#0a3d91;
  --pass:#1a7f37; --pass-bg:#dafbe1; --warn:#9a6700; --warn-bg:#fff8c5;
  --fail:#cf222e; --fail-bg:#ffebe9; --info:#2f81f7;
  --land:#78aa5a; --ocean:#3c78c8; --river:#288cc8; --coast:#dc963c;
  --estuary:#b464c8; --urban:#b44646;
  --shadow:0 1px 2px rgba(31,35,40,.08), 0 2px 8px rgba(31,35,40,.06);
  --shadow-lg:0 8px 30px rgba(31,35,40,.14);
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --s-xs:2px; --s-sm:4px; --s-md:8px; --s-lg:16px; --s-xl:24px;
  --rail-w:248px; --live-w:360px; --top-h:52px; --status-h:34px;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --surface-2:#1c2330; --elevated:#1b2230;
  --border:#30363d; --border-soft:#262c34;
  --text:#e6edf3; --muted:#8b949e; --faint:#6e7681;
  --accent:#58a6ff; --accent-weak:#13243f; --accent-ink:#cae0ff;
  --pass:#3fb950; --pass-bg:#10261a; --warn:#d29922; --warn-bg:#2b2410;
  --fail:#f85149; --fail-bg:#2d1414; --info:#58a6ff;
  --land:#8fbf6e; --ocean:#5b95d6; --river:#4aa6dc; --coast:#e0a85a;
  --estuary:#c084d6; --urban:#d65f5f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.35);
  --shadow-lg:0 10px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
.app{display:grid;height:100vh;
  grid-template:"top top top" var(--top-h) "rail work live" 1fr "status status status" var(--status-h)
  / var(--rail-w) 1fr var(--live-w)}
.splitter{transition:background .12s}
.splitter:hover,.splitter.drag{background:var(--accent);opacity:.5}

/* ---------------- top bar ---------------- */
.top{grid-area:top;display:flex;align-items:center;gap:var(--s-md);
  padding:0 var(--s-lg);background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:15px}
.brand .glyph{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--ocean),var(--accent));color:#fff;box-shadow:var(--shadow)}
.top .sep{width:1px;height:22px;background:var(--border)}
.menu-btn{padding:5px 10px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--elevated);display:flex;align-items:center;gap:6px}
.menu-btn:hover{border-color:var(--accent);color:var(--accent)}
.proj-actions{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:8px;margin-bottom:14px}
.proj-actions .menu-btn{flex:0 0 auto;justify-content:center}
.proj-name{padding:5px 10px;border:1px solid transparent;border-radius:var(--r-sm);
  background:var(--bg);min-width:160px;color:var(--text);font-weight:600}
.proj-name[readonly]{cursor:default;color:var(--muted)}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--bg)}
.seg button{padding:5px 11px;border:0;background:transparent;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.icon-btn{width:32px;height:30px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--elevated);display:grid;place-items:center}
.icon-btn:hover{border-color:var(--accent)}
.run-btn{padding:6px 16px;border:0;border-radius:var(--r-sm);background:var(--pass);color:#fff;font-weight:650;
  display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.run-btn:hover{filter:brightness(1.05)}

/* ---------------- left rail (stepper) ---------------- */
.rail{grid-area:rail;background:var(--surface);border-right:1px solid var(--border);
  padding:var(--s-lg) var(--s-md);overflow:auto}
.rail h4{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  margin:0 8px 10px;font-weight:700}
.step{display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-md);
  position:relative;cursor:pointer;margin-bottom:1px}
.step:hover{background:var(--surface-2)}
.step.active{background:var(--accent-weak)}
.step .num{flex:none;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;border:1.5px solid var(--border);color:var(--muted);background:var(--bg);z-index:1}
.step.active .num{background:var(--accent);border-color:var(--accent);color:#fff}
.step .step-copy{min-width:0}
.step .t{font-weight:620;line-height:1.35}
.step.active .t{color:var(--accent-ink)}
.step .d{color:var(--muted);font-size:11.5px;margin-top:1px}
.step:not(:last-child)::after{content:"";position:absolute;left:22px;top:34px;bottom:-2px;
  width:1.5px;background:var(--border)}
.rail .est{margin:14px 8px 0;padding:11px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg)}
.est .lab{color:var(--muted);font-size:11px}
.est .big{font-size:19px;font-weight:750;letter-spacing:-.02em}

/* ---------------- center workspace ---------------- */
.work{grid-area:work;overflow:auto;padding:var(--s-xl) calc(var(--s-xl) + 4px)}
.work-head{display:flex;align-items:baseline;gap:12px;margin-bottom:3px}
.work-head .kicker{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.02em}
.work h1{font-size:23px}
.work .sub{color:var(--muted);margin:4px 0 22px;max-width:62ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-lg)}
.card{background:var(--elevated);border:1px solid var(--border);border-radius:var(--r-md);
  padding:var(--s-lg);box-shadow:var(--shadow);margin-bottom:var(--s-lg)}
.card h3{font-size:14px;margin-bottom:3px}
.card .ch{color:var(--muted);font-size:12px;margin-bottom:14px}
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-weight:600;font-size:12px;margin-bottom:5px}
.field .hint{color:var(--faint);font-weight:400;font-size:11px}
.input,.select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);font-family:inherit}
.input:focus,.select:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:var(--s-md)}.row>*{flex:1}
.browse{display:flex;gap:6px}.browse .input{flex:1}
.btn-ghost{padding:7px 11px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);white-space:nowrap}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* template cards */
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-md)}
.tcard{border:1.5px solid var(--border);border-radius:var(--r-md);padding:13px;background:var(--elevated);
  cursor:pointer;transition:.12s;position:relative}
.tcard:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.tcard.on{border-color:var(--accent);background:var(--accent-weak)}
.tcard .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;margin-bottom:9px}
.tcard .nm{font-weight:680;font-size:13px}
.tcard .meta{color:var(--muted);font-size:11px;margin-top:2px}
.tcard .tags{margin-top:9px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--muted);font-weight:600}
.tcard.on .check{position:absolute;top:10px;right:10px;color:var(--accent);font-weight:800}

/* data-layer table */
.layers{width:100%;border-collapse:collapse;font-size:12.5px}
.layers th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;
  padding:6px 8px;border-bottom:1px solid var(--border)}
.layers td{padding:8px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.layers tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.cov{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:650}
.cov.ok{background:var(--pass-bg);color:var(--pass)} .cov.no{background:var(--fail-bg);color:var(--fail)}
.path{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;display:inline-block;vertical-align:middle}
.sw{position:relative;width:34px;height:19px;border-radius:20px;background:var(--border);transition:.15s;flex:none}
.sw.on{background:var(--accent)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
.sw.on::after{left:17px}

input[type=range]{width:100%;accent-color:var(--accent)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:6px 13px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--muted);font-weight:600;font-size:12px}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* expert / quality detail zones */
.expert{border:1.5px dashed var(--accent);border-radius:var(--r-md);padding:var(--s-lg);
  background:color-mix(in srgb,var(--accent) 6%,transparent);margin-top:var(--s-lg)}
.expert-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:11px}
body.normal .expert{display:none}
.quality-detail{border:1.5px dashed var(--accent);border-radius:var(--r-md);padding:var(--s-lg);
  background:color-mix(in srgb,var(--accent) 6%,transparent);margin-bottom:var(--s-lg)}
.quality-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:11px}

/* quality dashboard */
.verdict{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-md);
  background:var(--pass-bg);border:1px solid color-mix(in srgb,var(--pass) 30%,transparent);margin-bottom:var(--s-lg)}
.verdict .vb{font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
  padding:5px 13px;border-radius:7px;background:var(--pass);color:#fff}
.verdict .vt{font-weight:700;font-size:15px} .verdict .vs{color:var(--muted);font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-md)}
.metric{border:1px solid var(--border);border-radius:var(--r-md);padding:13px;background:var(--elevated)}
.metric .mv{font-size:21px;font-weight:760;letter-spacing:-.02em}
.metric .ml{color:var(--muted);font-size:11px;margin-top:2px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:18px;border-top:1px solid var(--border)}
.nav-btns{display:flex;gap:8px;margin-left:auto}
.btn-next{padding:8px 18px;border:0;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-weight:650}
.btn-back{padding:8px 16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg)}

/* ---------------- right live panel ---------------- */
.live{grid-area:live;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.live-tabs{display:flex;gap:2px;padding:9px var(--s-md) 0;border-bottom:1px solid var(--border)}
.live-tabs button{padding:8px 13px;border:0;background:transparent;color:var(--muted);font-weight:600;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.live-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.live-body{flex:1;overflow:hidden;padding:var(--s-md);min-height:0}
.live-pane{display:none;height:100%;min-height:0;overflow:auto}.live-pane.on{display:block}
.live-pane[data-pane="log"].on{display:flex;flex-direction:column;overflow:hidden}
.log-head{flex:none;position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--border);padding-bottom:7px;margin-bottom:7px}
.mapwrap{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--bg)}
.map-cap{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;font-size:11.5px;color:var(--muted)}
#mapsvg{height:280px;border-radius:8px;overflow:hidden;background:var(--bg)}
#mapStage{position:relative;flex:1;min-height:300px;border-radius:8px;overflow:hidden;background:var(--bg)}
#mapsvgModal,.earthmesh-globe{position:absolute;inset:0;background:var(--bg)}
.earthmesh-globe{z-index:5}
.earthmesh-globe[hidden]{display:none}
.earthmesh-globe .maplibregl-canvas{outline:none}
.earthmesh-globe .maplibregl-canvas:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.globe-cell-tooltip{position:absolute;z-index:40}
.ol-viewport{font:inherit;background:var(--bg)}
.map-modal-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;min-width:0}
.map-tools{display:none;align-items:center;gap:7px;flex:1;min-width:0;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.map-tools label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.map-tools select,.map-tools input[type="range"]{height:28px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--elevated);color:var(--text);font:inherit}
.map-tools select{padding:0 24px 0 8px}
.map-tools input[type="range"]{width:76px}
.map-tool-btn{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--elevated);color:var(--text);font:inherit;font-weight:650}
.map-tool-btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.map-tool-btn:disabled{opacity:.55;cursor:wait}
.map-tool-btn:focus-visible,.map-tools select:focus-visible,.map-tools input:focus-visible,.map-tool-menu>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.map-tool-menu{position:relative}
.map-tool-menu>summary{list-style:none;height:28px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--elevated);color:var(--text);font-weight:650;cursor:pointer;white-space:nowrap}
.map-tool-menu>summary::-webkit-details-marker{display:none}
.map-tool-menu[open]>summary{border-color:var(--accent);color:var(--accent)}
.map-tool-menu.active>summary{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink)}
.map-tool-panel{position:absolute;top:34px;left:0;z-index:80;min-width:230px;padding:11px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--elevated);box-shadow:var(--shadow-lg);color:var(--text)}
.map-tool-panel .map-check{display:flex;align-items:center;gap:7px;margin:7px 0;white-space:nowrap}
.map-tool-panel .map-slider{display:grid;grid-template-columns:auto 1fr 38px;align-items:center;gap:7px;margin:9px 0}
.map-tool-panel .map-slider input[type="range"]{width:100%}
.map-tool-panel output{font-family:var(--mono);font-size:10.5px;text-align:right;color:var(--muted)}
.map-tool-panel .map-measure-row{display:flex;align-items:center;gap:7px}
.map-tool-panel .map-measure-row select{flex:1;min-width:0}
.map-measure-status{margin-top:8px;min-height:17px;color:var(--muted);font-family:var(--mono)}
.map-coordinate{margin-left:auto;min-width:132px;color:var(--muted);font-family:var(--mono);text-align:right}
.map-export-status{display:block;margin-top:8px;min-height:14px;max-width:310px;color:var(--muted);overflow-wrap:anywhere}
body.map-window .app{display:none}
body.map-window #mapModal{display:flex!important;background:var(--bg)!important}
body.map-window #mapModalPanel{width:100vw!important;height:100vh!important;min-width:0!important;min-height:0!important;max-width:none!important;max-height:none!important;border:0!important;border-radius:0!important;padding:12px!important;resize:none!important;box-shadow:none!important;display:grid!important;grid-template-rows:auto minmax(0,1fr)}
body.map-window .map-modal-head{align-items:flex-start}
body.map-window #mapModalCloseBtn{display:none}
body.map-window .map-tools{display:flex}
body.map-window #mapStage{height:100%!important;min-height:0!important;border-radius:0}
.cz-legend{padding:7px 9px;background:var(--elevated);border:1px solid var(--border);
  border-radius:var(--r-sm);box-shadow:var(--shadow);color:var(--text);font-size:11px;line-height:1.4}
.ol-zone-legend{position:absolute;left:8px;bottom:40px;z-index:20;max-width:calc(100% - 16px)}
.cz-legend .row{display:flex;align-items:center;gap:6px;white-space:nowrap}
.cz-legend i{width:16px;height:10px;border-radius:2px;display:inline-block}
.ol-cell-tooltip{padding:5px 8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--elevated);box-shadow:var(--shadow);color:var(--text);font-size:11px;white-space:nowrap;pointer-events:none}
.ol-cell-inspector{position:absolute;right:8px;bottom:38px;z-index:30;width:min(310px,calc(100% - 16px));max-height:min(46vh,380px);overflow:auto;padding:10px;border:1px solid var(--border);border-radius:var(--r-md);background:color-mix(in srgb,var(--elevated) 94%,transparent);box-shadow:var(--shadow-lg);color:var(--text);font-size:11px}
.ol-cell-inspector-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;font-weight:700}
.ol-cell-inspector-close{border:0;background:transparent;color:var(--muted);padding:0 3px;font-size:16px;line-height:1}
.ol-cell-inspector-row{display:grid;grid-template-columns:minmax(86px,.8fr) minmax(100px,1.2fr);gap:8px;padding:3px 0;border-top:1px solid var(--border-soft)}
.ol-cell-inspector-row span:first-child{color:var(--muted);overflow-wrap:anywhere}.ol-cell-inspector-row span:last-child{font-family:var(--mono);overflow-wrap:anywhere}
.logbox{min-height:0;overflow-y:scroll;overscroll-behavior:contain;scrollbar-gutter:stable;
  padding-right:4px;font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--muted);white-space:pre-wrap}
.logbox::-webkit-scrollbar{width:10px}
.logbox::-webkit-scrollbar-track{background:var(--surface-2);border-radius:5px}
.logbox::-webkit-scrollbar-thumb{background:var(--faint);border:2px solid var(--surface-2);border-radius:5px}
.logbox::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.mini-metric{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--border-soft);font-size:12.5px}
.mini-metric b{font-weight:700}
.progress{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:10px 0}
.progress>i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--accent),var(--ocean))}

/* ---------------- status bar ---------------- */
.status{grid-area:status;display:flex;align-items:center;gap:14px;padding:0 var(--s-lg);
  background:var(--surface);border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:2px 9px;border-radius:6px;font-size:10.5px}
.badge.pass{background:var(--pass-bg);color:var(--pass)}
.status .rdot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status .rdot.on{background:var(--pass);box-shadow:0 0 0 3px var(--pass-bg)}
</style>

<div class="app" id="app">
  <!-- TOP BAR -->
  <header class="top">
    <div class="brand"><span class="glyph">◈</span><span>EarthMesh <span style="color:var(--muted);font-weight:500">Studio</span></span></div>
    <div class="sep"></div>
    <input class="proj-name" value="earthmesh-project" readonly aria-label="Case name" title="Case name — follows the project name">
    <div class="grow"></div>
    <div class="seg" id="langSeg">

let METHOD_C_SPRING_NXP1_KM=STATIC_BROWSER_CAPABILITIES.method_c_spring_nxp1_km; // display fallback; Tauri replaces from backend capability
let KM_PER_DEG_EQ=STATIC_BROWSER_CAPABILITIES.km_per_degree_equator;
const RES_UNITS=[
 {label:["km","km"], suffix:" km", min:1, max:500, step:0.5, def:100, ticks:[1,25,100,250,500]},
 {label:["NXP (grid points)","NXP（格点数）"], suffix:" NXP", min:8, max:8000, step:1, def:80, ticks:[8,80,192,768,8000]},
 {label:["degrees at equator","赤道经纬度"], suffix:"°", min:0.005, max:1, step:0.005, def:0.081, ticks:[0.005,0.25,0.5,0.75,1]},
];
let resUnitIdx=0, resVal=RES_UNITS[0].def;
function fmtRes(){const u=RES_UNITS[resUnitIdx];return resVal+u.suffix;}
function kmToNxp(km){ return km>0 ? Math.max(1, Math.round(METHOD_C_SPRING_NXP1_KM/km)) : 0; }
function nxpToKm(nxp){ return nxp>0 ? METHOD_C_SPRING_NXP1_KM/nxp : METHOD_C_SPRING_NXP1_KM; }
// Cross-unit equivalents. Engine relation mirrors earthmesh_project::km_to_nxp.
function fmtEquiv(){
  if(!(resVal>0)) return "";
  if(resUnitIdx===1){ const km=nxpToKm(resVal); return "≈ "+km.toFixed(1)+" km · "+(km/KM_PER_DEG_EQ).toFixed(3)+"°"; }
  if(resUnitIdx===0){ const km=resVal; return "≈ "+kmToNxp(km)+" NXP · "+(km/KM_PER_DEG_EQ).toFixed(3)+"°"; }
  if(resUnitIdx===2){ const km=resVal*KM_PER_DEG_EQ; return "≈ "+km.toFixed(1)+" km · "+kmToNxp(km)+" NXP"; }
  return "";
}
function domainLabel(){
  if(hiddenDomainShape) return lang ? "保留隐藏区域："+hiddenDomainShape : "Preserved regional: "+hiddenDomainShape;
  if(domainMode==="watershed") return lang ? "流域" : "Watershed";
  if(domainMode==="close") return lang ? "闭合区域" : "Close domain";
  return regional ? (lang ? "区域" : "Regional") : (lang ? "全球" : "Global");
}
// ---- cell-count estimate (updates live with resolution + domain) ----
function cellKm(){
  if(!(resVal>0)) return 0;
  if(resUnitIdx===1) return nxpToKm(resVal);          // NXP -> km
  if(resUnitIdx===2) return resVal*KM_PER_DEG_EQ;     // degrees at equator -> km
  return resVal;                              // km
}
function estCells(){
  const km=cellKm(); if(!(km>0)) return 0;
  if(domainMode==="watershed" || domainMode==="close") return 0;
  let area;
  if(typeof regional!=="undefined" && regional){
    const b=(typeof domBbox!=="undefined")?domBbox:DEFAULT_BBOX;
    const midLat=(b[2]+b[3])/2;
    const dx=Math.abs(b[1]-b[0])*KM_PER_DEG_EQ*Math.cos(midLat*Math.PI/180);
    const dy=Math.abs(b[3]-b[2])*KM_PER_DEG_EQ;
    area=Math.max(1,dx*dy);
  } else {
    area=5.10072e8; // Earth's surface area (km²)
  }
  return Math.max(1,Math.round(area/(km*km*0.866))); // hex cell area ≈ 0.866·s²
}
function fmtK(n){ return n>=1e6 ? (n/1e6).toFixed(2)+"M" : n>=1e3 ? Math.round(n/1e3)+"k" : ""+n; }
function updateEstimate(){
  if(hiddenDomainShape){ const el=document.getElementById("estCells"); if(el) el.textContent="—"; return; }
  if(domainMode==="watershed" || domainMode==="close"){ const el=document.getElementById("estCells"); if(el) el.textContent="—"; return; }
  const est=estCells();
  const set=(id,v,prop)=>{const el=document.getElementById(id); if(el){ if(prop) el.style[prop]=v; else el.textContent=v; }};
  set("estCells","~"+fmtK(est));
}

  return `<div class="field"><label>${lang?"目标分辨率":"Target resolution"} <span class="hint">${lang?"可直接输入或拖动":"type a value or drag"}</span></label>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <input class="input" type="number" id="resNum" style="width:84px" value="${resVal}" min="${u.min}" max="${u.max}" step="${u.step}">
      <select class="select" id="resUnit" style="width:158px">${opts}</select>
      <span id="resOut" style="margin-left:auto;font-weight:750;font-size:17px;color:var(--accent)">${fmtRes()}</span>
    </div>
    <div id="resEq" style="color:var(--muted);font-size:11px;margin:-4px 0 9px;min-height:14px">${fmtEquiv()}</div>
    <input type="range" id="resRange" style="width:100%" min="${u.min}" max="${u.max}" step="${u.step}" value="${resVal}">
    <div style="display:flex;justify-content:space-between;color:var(--faint);font-size:10px;margin-top:3px">
      ${u.ticks.map(t=>`<span>${t}${u.suffix}</span>`).join("")}

}
function resInput(src){
  if(src==="unit"){ resUnitIdx=+document.getElementById("resUnit").value; resVal=RES_UNITS[resUnitIdx].def; renderStep(1); return; }
  const u=RES_UNITS[resUnitIdx];
  let v = src==="range" ? +document.getElementById("resRange").value : +document.getElementById("resNum").value;
  if(isNaN(v)) return;
  if(src==="range") v=Math.min(u.max,Math.max(u.min,v));
  resVal=Math.round(v/u.step)*u.step; resVal=Math.round(resVal*1000)/1000;
  const r=document.getElementById("resRange"), n=document.getElementById("resNum"), o=document.getElementById("resOut");
  if(r && (src==="range" || (src==="num" && resVal>=u.min && resVal<=u.max))) r.value=resVal;
  if(n && src!=="num") n.value=resVal;
  if(o) o.textContent=fmtRes();
  const eq=document.getElementById("resEq"); if(eq) eq.textContent=fmtEquiv();
  updateEstimate();
}

async function confirmStopForPageSwitch(){
  if(!runInProgress) return true;
  const ok=confirm(lang
    ?"网格正在运行。切换页面前需要先终止当前运行，是否终止并切换？"
    :"A mesh run is in progress. Switching pages will stop the current run. Stop and switch?");
  if(!ok) return false;
  return await killRun();
}
async function go(i){
  if(i===cur) return true;
  if(!await confirmStopForPageSwitch()) return false;
  cur=i;renderSteps();renderStep(i);document.getElementById("work").scrollTop=0;
  return true;
}

function cssVarColor(name,fallback){
  try{
    const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }catch(e){ return fallback; }
}
function coastalZoneStyle(f){
  const z=f && f.properties && f.properties.zone;
  const color=z==="r3" ? "#c0266b"
    : z==="r2" ? "#7c3aed"
    : z==="land" ? cssVarColor("--land","#78aa5a")
    : z==="ocean" ? cssVarColor("--ocean","#3c78c8")
    : cssVarColor("--coast","#dc963c");
  return {color,weight:0.8,fillColor:color,fillOpacity:z==="coast"?0.30:0.20};
}
function meshFeatureIsCoast(p){
  const surface=String(p.surface_class||p.surface_class_code||p.zone||"").toLowerCase();
  const mask=String(p.mask_class||p.hydro_mask_class||p.coast_class||"").toLowerCase();
  const coastCode=String(p.coast_class_code||"").toLowerCase();
  const coastFraction=Number(p.coastal_fraction||p.coast_fraction||0);
  return !!p.has_coast || surface==="3" || mask.includes("coast") || /^[123]$/.test(coastCode) || coastFraction>0;
}
function meshFeatureStyle(f){
  const p=(f&&f.properties)||{};
  const surface=String(p.surface_class||p.surface_class_code||p.zone||"").toLowerCase();
  const mask=String(p.mask_class||p.hydro_mask_class||p.coast_class||"").toLowerCase();
  const primary=mask.toUpperCase();
  const river=String(p.river_class||p.overlap_class||mask||"").toUpperCase();
  const riverColor=river==="R3" ? "#c0266b" : river==="R2" ? "#7c3aed" : "";
  const riverOutline=!!riverColor && primary!==river;
  const coastFraction=Number(p.coastal_fraction||p.coast_fraction||0);
  if(primary==="R3") return {color:"#c0266b",weight:1.4,fillColor:"#c0266b",fillOpacity:0.40};
  if(primary==="R2") return {color:"#7c3aed",weight:1.2,fillColor:"#7c3aed",fillOpacity:0.32};
  const hasCoast=meshFeatureIsCoast(p);
  if(hasCoast){
    const color=cssVarColor("--coast","#dc963c");
    const style={color:riverOutline?riverColor:color,weight:riverOutline?1.6:1.5,fillColor:color,fillOpacity:Math.min(0.48,0.18+coastFraction*0.7)};
    if(riverOutline) style.dashArray="3 2";
    return style;
  }
  if(surface.includes("ocean") || surface==="2" || mask==="ocean"){
    const color=cssVarColor("--ocean","#3c78c8");
    const style={color:riverOutline?riverColor:color,weight:riverOutline?1.2:0.8,fillColor:color,fillOpacity:0.12};
    if(riverOutline) style.dashArray="3 2";
    return style;
  }
  if(surface.includes("land") || surface==="1" || mask==="land"){
    const color=cssVarColor("--land","#78aa5a");
    const style={color:riverOutline?riverColor:color,weight:riverOutline?1.2:0.8,fillColor:color,fillOpacity:0.12};
    if(riverOutline) style.dashArray="3 2";
    return style;
  }
  return {color:"#22d3ee",weight:0.9,fillOpacity:0.05};
}
function meshFeatureLabel(p){
  const primary=p.mask_class||p.surface_class||p.label||"";
  const river=p.river_class ? ` + ${p.river_class}` : "";
  const frac=Number(p.river_fraction||0);
  return `${primary}${river}${frac?` (${(frac*100).toFixed(1)}%)`:""}`;
}

function wrapOlLon(lon){ return ((Number(lon)+180)%360+360)%360-180; }
function olUtmZone(lon,lat){
  lon=wrapOlLon(lon);
  if(lat>=56&&lat<64&&lon>=3&&lon<12) return 32;
  if(lat>=72&&lat<84&&lon>=0&&lon<42){ if(lon<9) return 31; if(lon<21) return 33; if(lon<33) return 35; return 37; }
  return Math.max(1,Math.min(60,Math.floor((lon+180)/6)+1));
}
function olUtmWorldExtent(zone,lon,lat){
  let west=-180+(zone-1)*6, east=west+6;
  if(lat>=56&&lat<64&&zone===32&&lon>=3&&lon<12){ west=3; east=12; }
  if(lat>=72&&lat<84){
    if(zone===31){ west=0; east=9; }
    else if(zone===33){ west=9; east=21; }
    else if(zone===35){ west=21; east=33; }
    else if(zone===37){ west=33; east=42; }
  }
  return [west,lat>=0?0:-80,east,lat>=0?84:0];
}
function olGeojsonFrame(geojson){
  if(!geojson||typeof geojson!=="object") return null;
  if(_olGeoFrameCache.has(geojson)) return _olGeoFrameCache.get(geojson);
  const lons=[]; let south=Infinity,north=-Infinity;
  const scan=(coordinates)=>{
    if(!Array.isArray(coordinates)) return;
    if(coordinates.length>=2&&typeof coordinates[0]==="number"&&typeof coordinates[1]==="number"){
      const lon=wrapOlLon(coordinates[0]), lat=Number(coordinates[1]);
      if(Number.isFinite(lon)&&Number.isFinite(lat)){ lons.push((lon+360)%360); south=Math.min(south,lat); north=Math.max(north,lat); }
      return;
    }
    coordinates.forEach(scan);
  };
  const scanGeometry=(geometry)=>{ if(!geometry) return; scan(geometry.coordinates); (geometry.geometries||[]).forEach(scanGeometry); };
  (geojson.features||[]).forEach((feature)=>scanGeometry(feature.geometry)); scanGeometry(geojson.type==="FeatureCollection"?null:geojson.geometry||geojson);
  if(!lons.length){ _olGeoFrameCache.set(geojson,null); return null; }
  lons.sort((a,b)=>a-b); let largestGap=-1,start=lons[0];
  for(let i=0;i<lons.length;i++){ const next=i+1<lons.length?lons[i+1]:lons[0]+360, gap=next-lons[i]; if(gap>largestGap){ largestGap=gap; start=next%360; } }
  const west=start>180?start-360:start, east=west+Math.max(0,360-largestGap);
  const frame={west,east,south,north,crossesDateline:east>180}; _olGeoFrameCache.set(geojson,frame); return frame;
}
function currentOlDomainFrame(){

function olDomainLonLatExtent(){

function olMapFocusLonLat(map){

let _mapResizeFrame=0;
function scheduleMapResize(){
  if(_mapResizeFrame) return;
  _mapResizeFrame=requestAnimationFrame(()=>{
    _mapResizeFrame=0;
    ["mapsvg","mapsvgModal"].forEach((id)=>{
      const el=document.getElementById(id);
      if(el && el._olmap){
        const target=id==="mapsvgModal"?(document.getElementById("mapStage")||el):el,rect=target.getBoundingClientRect(),key=`${rect.width}:${rect.height}:${window.devicePixelRatio}`;
        if(el._olmap._resizeKey===key) return; el._olmap._resizeKey=key;
        if(el._olmap._globeActive&&el._olmap._globe) el._olmap._globe.resize(); else el._olmap.updateSize();
      }

/* ---------------- resizable rail / map panels (draggable splitters) ---------------- */
function setupSplitters(){
  const root=document.documentElement;
  try{ const rw=localStorage.getItem("em.railW"); if(rw) root.style.setProperty("--rail-w",rw); }catch(e){}
  try{ const lw=localStorage.getItem("em.liveW"); if(lw) root.style.setProperty("--live-w",lw); }catch(e){}
  const mk=(parent,side)=>{
    if(!parent||parent.querySelector(":scope > .splitter")) return;
    parent.style.position="relative";
    const s=document.createElement("div");
    s.className="splitter";
    s.style.cssText="position:absolute;top:0;bottom:0;"+side+":-3px;width:7px;cursor:col-resize;z-index:30";
    parent.appendChild(s);
    s.addEventListener("mousedown",ev0=>{
      ev0.preventDefault(); s.classList.add("drag"); document.body.style.userSelect="none";
      const move=ev=>{
        if(side==="right"){ // left rail: width = pointer X
          const w=Math.max(180,Math.min(460,ev.clientX));
          root.style.setProperty("--rail-w",w+"px"); try{localStorage.setItem("em.railW",w+"px");}catch(e){}
        }else{ // map panel (drag its left edge): width grows leftward
          const w=Math.max(280,Math.min(Math.round(window.innerWidth*0.6),window.innerWidth-ev.clientX));
          root.style.setProperty("--live-w",w+"px"); try{localStorage.setItem("em.liveW",w+"px");}catch(e){}
          scheduleMapResize();
        }
      };
      const up=()=>{s.classList.remove("drag");document.body.style.userSelect="";document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);};
      document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    });
  };
  mk(document.querySelector(".rail"),"right");
  mk(document.querySelector(".live"),"left");
}

if(MAP_WINDOW_MODE){
  document.body.classList.add("map-window");

  if(map) scheduleMapResize();
}else{
  applyI18n(); setupSplitters();
}

<script>

   EarthMesh Studio — Tauri backend bridge.
   Active ONLY inside the Tauri webview (window.__TAURI__ present). In a plain
   browser this whole block is a no-op, so this file still opens standalone as

   we read/override the frontend globals tpl / resVal / resUnitIdx / TPL / cur /
   renderStep / renderSteps here.

   Model: everything derives from the UI except per-layer file edits, which we
   track in `layerEdits` and re-apply when composing the canonical YAML. Rust is
   the single source of truth for the project schema — the frontend never builds

(function () {
  if (!(window.__TAURI__ && window.__TAURI__.core)) return;

      if ("mesh" in payload) _meshGeojson = payload.mesh;

      if ("coastal" in payload) _coastalGeojson = payload.coastal;
      if ("hydroThresholds" in payload) _hydroThresholds = payload.hydroThresholds;
      if ("regional" in payload) regional = payload.regional;
      if ("domainMode" in payload) domainMode = payload.domainMode;
      if ("bbox" in payload) domBbox = payload.bbox;
      if ("theme" in payload) document.documentElement.setAttribute("data-theme", payload.theme);
      if ("language" in payload) { lang=payload.language; applyI18n(); }

    }).then(() => tauriEvent.emitTo("main", "earthmesh-map-ready"));

  }

  const ALL_MAP_STATE=["mesh","domain","coastal","settings"];
  const mapState = (parts=ALL_MAP_STATE,fit=false) => {
    const selected=new Set(parts), payload={fit};
    if(selected.has("mesh")) payload.mesh=_meshGeojson;
    if(selected.has("domain")) payload.domain=_domainGeojson;
    if(selected.has("coastal")) payload.coastal=_coastalGeojson;
    if(selected.has("settings")) Object.assign(payload,{
      hydroThresholds:_hydroThresholds,regional,domainMode,bbox:domBbox,
      theme:document.documentElement.getAttribute("data-theme")||"light",language:lang,
    });
    return payload;
  };
  const publishMapState = (parts=ALL_MAP_STATE,fit=false) => tauriEvent.emitTo("map", "earthmesh-map-state", mapState(parts,fit));
  syncMapWindow = (parts,fit=false) => { publishMapState(parts,fit).catch(() => {}); };
  tauriEvent.listen("earthmesh-map-ready", () => publishMapState(ALL_MAP_STATE,true));
  openMapWindow = async function () {
    try {
      let mapWindow = await WebviewWindow.getByLabel("map");
      if (mapWindow) {
        await mapWindow.show();
        await mapWindow.setFocus();
        await publishMapState(["settings"],false);
        return;
      }
      mapWindow = new WebviewWindow("map", {
        url: `index.html?view=map&lang=${lang ? "zh" : "en"}`,
        title: lang ? "EarthMesh Studio — 地图细查" : "EarthMesh Studio — Map inspection",
        width: 1000,
        height: 760,
        minWidth: 600,
        minHeight: 420,
        resizable: true,
      });
      mapWindow.once("tauri://error", (event) => console.error("map window:", event.payload));
    } catch (error) {
      console.error("map window:", error);
    }
  };

  function applyProjectCapabilities(capabilities) {
    const intentIds = new Set(capabilities.intent_ids || []);
    const unsupported = [...new Set(TPL.map((card) => card.intent))]
      .filter((intent) => !intentIds.has(intent));
    if (unsupported.length) throw new Error("unsupported gallery intents: " + unsupported.join(", "));
    TARGET_PRESETS = Object.fromEntries((capabilities.target_presets || []).map((preset) => [preset.intent, preset]));
    SPECIALIZED_CELLS = Object.fromEntries((capabilities.target_compatibility || []).map((entry) => [entry.model_format, entry.specialized_cells]));
    DEFAULT_SEA_RATIO_PCT = capabilities.default_sea_ratio * 100;
    DEFAULT_MIN_ANGLE_DEG = capabilities.default_min_angle_deg;
    METHOD_C_MIN_BASE_NXP = capabilities.method_c_min_base_nxp;
    METHOD_C_MAX_REFINEMENT_LEVEL = capabilities.method_c_max_refinement_level;
    DEFAULT_OPENMP = capabilities.default_openmp;
    DEFAULT_NITER = capabilities.default_niter;
    DEFAULT_SURFACE_REFINE_SPRING_ITERATIONS = capabilities.default_surface_refine_spring_iterations;
    DEFAULT_ATMOSPHERE_REFINE_SPRING_ITERATIONS = capabilities.default_atmosphere_refine_spring_iterations;
    DEFAULT_BETA = capabilities.default_beta;
    DEFAULT_RELAX = capabilities.default_relax;
    DEFAULT_HFIELD_G = capabilities.default_hfield_g;
    METHOD_C_SPRING_NXP1_KM = capabilities.method_c_spring_nxp1_km;
    KM_PER_DEG_EQ = capabilities.km_per_degree_equator;
  }

  function currentResolution() {
    try {
      if (typeof resUnitIdx !== "undefined" && typeof resVal !== "undefined") {
        if (resUnitIdx === 1) return { nxp: Math.round(resVal), approxKm: null, approxDegree: null };
        if (resUnitIdx === 2) return { nxp: null, approxKm: null, approxDegree: resVal };
        return { nxp: null, approxKm: resVal, approxDegree: null };
      }
    } catch (e) {}
    return { nxp: 40, approxKm: null, approxDegree: null };
  }
  function currentNxp() {
    if (lastSummary && lastSummary.effective_nxp != null) return lastSummary.effective_nxp;
    const r = currentResolution();
    if (r.nxp != null) return r.nxp;
    if (r.approxDegree > 0) return kmToNxp(r.approxDegree*KM_PER_DEG_EQ);
    return r.approxKm > 0 ? kmToNxp(r.approxKm) : 0;
  }
  function currentResolutionLabel() {
    const r = currentResolution();
    if (r.nxp != null) return "NXP=" + r.nxp + " (≈" + nxpToKm(r.nxp).toFixed(1) + " km)";
    if (r.approxDegree != null) {
      const km = r.approxDegree * KM_PER_DEG_EQ;
      return r.approxDegree + "° (≈" + km.toFixed(1) + " km, NXP≈" + kmToNxp(km) + ")";
    }
    if (r.approxKm != null) return r.approxKm + " km (NXP≈" + kmToNxp(r.approxKm) + ")";
    return "NXP=" + currentNxp();
  }
  function regionalDefaultRefineLevel(nxp) {
    if (nxp >= 192) return 3;
    if (nxp >= 64) return 2;
    return 1;
  }
  function regionalMethodCLevelCap(nxp) {
    let cap = 1;
    while (cap < METHOD_C_MAX_REFINEMENT_LEVEL && METHOD_C_MIN_BASE_NXP * Math.pow(2, cap + 1) <= nxp) cap++;
    return cap;
  }
  function currentIntent() {
    try { return (TPL[tpl] && TPL[tpl].intent) || "Custom"; } catch (e) { return "Custom"; }
  }
  function projectName() {
    const el = document.querySelector(".proj-name");
    if (el) return el.value.trim();

  }
  const zh = () => (typeof lang !== "undefined" && lang) ? true : false;

  // ---- live project model ----------------------------------------------------
  const layerEdits = {};   // layer id -> { path, enabled }
  const thresholdEdits = {}; // threshold layer id -> number|null (null = catalog default)
  const criterionEdits = {}; // mean/std criterion id -> { enabled, value }
  let thresholdRefine = { enabled: false }; // explicit strategy; data availability does not opt in
  const defaultHydroRefine = () => ({ riverWidthEnabled: true, riverUpstreamAreaEnabled: true, coastEnabled: true, coastBufferKm: 50, coastLandEnabled: true, coastOceanEnabled: true, riverWidthThresholdM: 300, riverUpstreamAreaThresholdKm2: 50000, r2WidthM: 50, r2UpaKm2: 5000 });
  let hydroRefine = defaultHydroRefine();
  let domainEdit = null;   // null | {kind:'global'} | {kind:'bbox', w,e,s,n,seaRatio} | {kind:'hidden', shape}
  let qualityEdit = null;  // null | { minAngle, policy, batchCells }
let expertEdit = { enabled: false, nxp: null, openmp: null, niter: null, niterRefine: null, maxIterSpc: null, maxIterCal: null, halo: null, maxTransitionRow: null, setDisType: null, numRc: null, vertexPretectLayers: null, springStrategy: null, beta: null, relax: null, weakConcavEliminate: null, isolatedOcean: null };
  const defaultAlgorithmControls = () => ({
    leppMaxCycles: 8, leppTargetSizeTolerance: 1.2, leppMaximumNeighborSizeRatio: 1.75,
    leppMaximumVertices: 5000000, leppMaximumInsertionsPerCycle: 500000,
    leppMaximumPathLength: 100000, leppStopAtSourceResolution: true,
    leppMinimumTriangleAngleDeg: 0, harpMaxCycles: 20, harpMinimumCellWidthM: 1000,
    harpMaximumCells: 5000000, harpMaximumPatchCells: 10000,
    harpMaximumNeighborScaleRatio: 1.75, harpMinimumCandidateSeparationM: 1,
    harpMaximumVertexDegree: 7, harpMinimumTriangleAngleDeg: 30,
    harpCriterionMinimumAngleDeg: 0
  });
  let specifiedRefine = { ...defaultAlgorithmControls(), enabled: false, kind: "radius", lon: null, lat: null, radiusKm: null, circleCount: 0, w: null, e: null, s: null, n: null, path: null, closeBoundary: normalizeCloseBoundary(null), algorithm: "method_c", route: "adaptive", adaptiveMaxLevel: 0, adaptiveCoastline: true, hfieldEnabled: false, hfieldG: null, hfieldMaxLevel: null, hfieldBaseM: null };
  let metadataEdit = { authors: [], description: "" };
  let baseProjectYaml = null; // opened YAML; preserves fields the UI does not expose yet
  let projectActive = false; // a project has been created/opened this session → show the summary
  let lastSummary = null;    // cached ProjectSummary (+ _valid/_err) for the summary panel
  let _lastQuality = null;   // cached mesh_quality, shown again when step 6 rebuilds
  let backendReady = null;   // capability/catalog gate for every compose/save/run path
  // maxPasses is owned by the static step renderer; the Tauri bridge reads/writes it here.

  function normalizeCloseBoundary(value) {
    const b = value || {};
    return {
      mode: b.mode || "polyline",
      iterations: b.iterations ?? 2,
      margin_km: b.margin_km ?? 0,
      max_radius_deg: b.max_radius_deg ?? 80,
      max_segment_angle_deg: b.max_segment_angle_deg ?? 0.25,
    };
  }

  function closeBoundaryControls(prefix, value, z) {
    const b = normalizeCloseBoundary(value);
    return `<div class="expert" style="margin-top:12px">
      <span class="expert-tag">⚙ ${z ? "专家 — 闭合边界" : "EXPERT — close boundary"}</span>
      <div class="grid2" style="margin-top:10px">
        ${field(z?"边界表示":"Boundary mode",`<select class="select" id="${prefix}CloseBoundaryMode"><option value="polyline" ${b.mode==="polyline"?"selected":""}>${z?"原折线（默认）":"Polyline (default)"}</option><option value="spherical_chaikin" ${b.mode==="spherical_chaikin"?"selected":""}>${z?"球面 Chaikin 平滑":"Spherical Chaikin"}</option><option value="enclosing_cap" ${b.mode==="enclosing_cap"?"selected":""}>${z?"保守外接球冠":"Conservative enclosing cap"}</option></select>`,z?"默认保持现有行为":"default preserves existing behavior")}
        ${field(z?"最大分段角 (°)":"Max segment angle (°)",`<input class="input" type="number" id="${prefix}CloseMaxSegment" min="0.001" max="30" step="0.05" value="${b.max_segment_angle_deg}">`,z?"平滑/拟合前的边界采样上限":"boundary sampling limit")}

      </div>
      <div class="grid2" id="${prefix}CloseCapOptions" style="margin-top:10px">
        ${field(z?"外扩余量 (km)":"Outward margin (km)",`<input class="input" type="number" id="${prefix}CloseMarginKm" min="0" step="1" value="${b.margin_km}">`,z?"允许覆盖原区域之外":"intentional over-cover")}

      </div>
      <div style="color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px">${z?"平滑会削角并可能缩小范围；外接球冠会扩大范围。非默认模式会执行自交、对跖与半球限制检查。":"Smoothing cuts corners and may shrink the footprint; enclosing caps expand it. Non-default modes validate intersections, antipodal edges, and cap extent."}</div>
    </div>`;
  }
  window.closeBoundaryControls = closeBoundaryControls;

  function bindCloseBoundaryControls(prefix, current, onChange) {
    const mode = document.getElementById(prefix+"CloseBoundaryMode");
    const iterations = document.getElementById(prefix+"CloseIterations");

    const maxRadius = document.getElementById(prefix+"CloseMaxRadius");
    const maxSegment = document.getElementById(prefix+"CloseMaxSegment");

      const chaikin = document.getElementById(prefix+"CloseChaikinOptions");

      if (cap) cap.style.display = mode.value === "enclosing_cap" ? "" : "none";
      if (maxSegment) maxSegment.disabled = mode.value === "polyline";
    };
    const sync = () => {
      const previous = normalizeCloseBoundary(current());
      const next = {
        mode: mode.value,
        iterations: iterations ? Math.max(1,Math.min(6,parseInt(iterations.value,10)||2)) : previous.iterations,
        margin_km: margin ? Math.max(0,parseFloat(margin.value)||0) : previous.margin_km,
        max_radius_deg: maxRadius ? (parseFloat(maxRadius.value)||80) : previous.max_radius_deg,
        max_segment_angle_deg: maxSegment ? (parseFloat(maxSegment.value)||0.25) : previous.max_segment_angle_deg,
      };

  async function applyCloseBoundary(yaml, target, value) {
    const b = normalizeCloseBoundary(value);

      yaml, target, mode:b.mode, iterations:b.iterations, marginKm:b.margin_km,
      maxRadiusDeg:b.max_radius_deg, maxSegmentAngleDeg:b.max_segment_angle_deg
    });
  }

  // Refinement runs only if a real refinement source has a data file.
  function hasEnabledThresholdLayer(summary) {
    const criteria = (summary && summary.threshold_criteria) || [];
    return ((summary && summary.layers) || []).some((l) => {
      if (!((l.role_kind === "threshold" || l.role_kind === "landcover") && !!l.path && !!l.enabled)) return false;
      return criteria.some((criterion) => criterion.source_id === l.id && criterion.enabled);
    });
  }
  function hasEnabledHydroRefinement(summary) {
    const hydroConfigured = !!summary && (summary.hydro_coast_buffer_km != null || summary.hydro_river_width_threshold_m != null || summary.hydro_river_upstream_area_threshold_km2 != null);
    return hydroConfigured && !!meshMeritLayer(summary) && (hydroRefine.riverWidthEnabled || hydroRefine.riverUpstreamAreaEnabled || (hydroRefine.coastEnabled && (hydroRefine.coastLandEnabled || hydroRefine.coastOceanEnabled)));
  }

  async function composeYaml() {
    if (backendReady) await backendReady;
    const resolution = currentResolution();
    let yaml = await invoke("scaffold_project",
      { name: projectName(), intent: currentIntent(), nxp: resolution.nxp, approxKm: resolution.approxKm, approxDegree: resolution.approxDegree });
    yaml = await invoke("set_project_metadata",
      { yaml, name: projectName(), authors: metadataEdit.authors || [], description: metadataEdit.description || "" });
    // Derive the domain from the LIVE mode + controls — not a stale domainEdit
    // (template cards flip `regional`/`domainMode` without updating domainEdit).
    const mode = (typeof domainMode !== "undefined") ? domainMode : ((typeof regional !== "undefined" && regional) ? "regional" : "global");
    if (mode === "global") {

    } else if (mode === "watershed") {
      const path = (domainEdit && domainEdit.kind === "shapefile" ? domainEdit.path : watershedPath) || "";
      const seaRatio = domainEdit && domainEdit.kind === "shapefile" ? (domainEdit.seaRatio ?? null) : null;

    } else if (mode === "close") {

      const format = (domainEdit && domainEdit.kind === "close" ? domainEdit.format : closeFormat) || "nml";
      const seaRatio = domainEdit && domainEdit.kind === "close" ? (domainEdit.seaRatio ?? null) : null;
      yaml = await invoke("set_domain_close", { yaml, path, format, seaRatio });
      yaml = await applyCloseBoundary(yaml, "domain", domainCloseBoundary);
    } else {
      const b = (typeof domBbox !== "undefined" && domBbox) ? domBbox : DEFAULT_BBOX;
      const seaRatio = domainEdit && domainEdit.kind === "bbox" ? (domainEdit.seaRatio ?? null) : null;
      yaml = await invoke("set_domain_bbox", { yaml, w: b[0], e: b[1], s: b[2], n: b[3], seaRatio });
    }
    if (baseProjectYaml) {
      yaml = await invoke("preserve_unexposed_project_fields", { baseYaml: baseProjectYaml, yaml, preserveDomain: !!hiddenDomainShape });
    }
    if (targetEdit) {
      yaml = await invoke("set_project_target", { yaml, kind: targetEdit.kind, modelFormat: targetEdit.modelFormat });
    }
    if (cellEdit) {
      yaml = await invoke("set_target_cell", { yaml, cell: cellEdit });
    }
    const layerIds = Object.keys(layerEdits).sort((a,b) => Number(!!layerEdits[b].enabled) - Number(!!layerEdits[a].enabled));
    for (const id of layerIds) {
      const e = layerEdits[id];
      yaml = await invoke("set_layer_path", { yaml, id, path: e.path, enabled: e.enabled });
    }
    for (const id of Object.keys(thresholdEdits)) {
      yaml = await invoke("set_threshold_value", { yaml, id, value: thresholdEdits[id] });
    }
    for (const id of Object.keys(criterionEdits)) {
      const criterion = criterionEdits[id];
      yaml = await invoke("set_threshold_criterion", { yaml, id, enabled: !!criterion.enabled, value: criterion.value });
    }
    yaml = await invoke("set_hydro_refinement", {
      yaml,
      riverWidthEnabled: !!hydroRefine.riverWidthEnabled,
      riverUpstreamAreaEnabled: !!hydroRefine.riverUpstreamAreaEnabled,
      coastEnabled: !!hydroRefine.coastEnabled,
      coastBufferKm: hydroRefine.coastBufferKm,
      coastLandEnabled: !!hydroRefine.coastLandEnabled,
      coastOceanEnabled: !!hydroRefine.coastOceanEnabled,
      riverWidthThresholdM: hydroRefine.riverWidthThresholdM,
      riverUpstreamAreaThresholdKm2: hydroRefine.riverUpstreamAreaThresholdKm2
    });
    const spring = springTypesFor(expertEdit.springStrategy);
    yaml = await invoke("set_expert", {
      yaml, nxp: expertEdit.nxp, openmp: expertEdit.openmp, niter: expertEdit.niter,
      niterRefine: expertEdit.niterRefine, maxIterSpc: expertEdit.maxIterSpc, maxIterCal: expertEdit.maxIterCal,
      halo: expertEdit.halo,
      maxTransitionRow: expertEdit.maxTransitionRow,
      setDisType: expertEdit.setDisType,
      numRc: expertEdit.numRc,
      vertexPretectLayers: expertEdit.vertexPretectLayers,
      springGlobalType: spring.springGlobalType, springRegionalType: spring.springRegionalType,
      beta: expertEdit.beta, relax: expertEdit.relax,
      weakConcavEliminate: expertEdit.weakConcavEliminate,
      isolatedOcean: expertEdit.isolatedOcean
    });
    const summary = await invoke("project_summary", { yaml });
    const thresholdSourceEnabled = thresholdRefine.enabled && (hasEnabledThresholdLayer(summary) || hasEnabledHydroRefinement(summary));
    const refinementEnabled = thresholdSourceEnabled || !!specifiedRefine.enabled;
    const maxRefinePasses = summary.domain === "regional" ? regionalMethodCLevelCap(summary.effective_nxp ?? currentNxp()) : METHOD_C_MAX_REFINEMENT_LEVEL;
    const refinementPasses = refinementEnabled
      ? Math.min(maxRefinePasses, Math.max(1, maxPasses == null ? (summary.max_passes || 1) : maxPasses))
      : 0;
    yaml = await invoke("set_specified_refinement", {
      yaml, enabled: !!specifiedRefine.enabled,
      kind: specifiedRefine.kind || "radius",
      lon: specifiedRefine.lon, lat: specifiedRefine.lat, radiusKm: specifiedRefine.radiusKm,
      w: specifiedRefine.w, e: specifiedRefine.e, s: specifiedRefine.s, n: specifiedRefine.n,
      path: specifiedRefine.path
    });
    if (specifiedRefine.enabled && specifiedRefine.kind === "close") {
      yaml = await applyCloseBoundary(yaml, "specified", specifiedRefine.closeBoundary);
    }
    yaml = await invoke("set_refinement", {
      yaml, enabled: refinementEnabled, thresholdEnabled: !!thresholdRefine.enabled,
      maxPasses: refinementPasses
    });
    yaml = await invoke("set_adaptive_refinement", {
      yaml, enabled: (specifiedRefine.route || "adaptive") === "adaptive",
      maxLevel: specifiedRefine.adaptiveMaxLevel ?? null,
      coastline: specifiedRefine.adaptiveCoastline !== false
    });
    yaml = await invoke("set_hfield_refinement", {
      yaml, enabled: (specifiedRefine.route || "adaptive") === "hfield",
      g: specifiedRefine.hfieldG ?? null,
      maxLevel: specifiedRefine.hfieldMaxLevel ?? null,
      baseM: specifiedRefine.hfieldBaseM ?? null
    });
    yaml = await invoke("set_refinement_backend", {
      yaml, backend: specifiedRefine.algorithm || "method_c"
    });
    if (specifiedRefine.algorithm === "lepp_delaunay") {
      yaml = await invoke("set_method_c_algorithm_options", {
        yaml,
        maxCycles: specifiedRefine.leppMaxCycles,
        targetSizeTolerance: specifiedRefine.leppTargetSizeTolerance,
        maximumNeighborSizeRatio: specifiedRefine.leppMaximumNeighborSizeRatio,
        maximumVertices: specifiedRefine.leppMaximumVertices,
        maximumInsertionsPerCycle: specifiedRefine.leppMaximumInsertionsPerCycle,
        maximumPathLength: specifiedRefine.leppMaximumPathLength,
        stopAtSourceResolution: specifiedRefine.leppStopAtSourceResolution,
        minimumTriangleAngleDeg: specifiedRefine.leppMinimumTriangleAngleDeg
      });
    }
    if (specifiedRefine.algorithm === "harp_dv") {
      yaml = await invoke("set_harp_dv_options", {
        yaml,
        maxCycles: specifiedRefine.harpMaxCycles,
        minimumCellWidthM: specifiedRefine.harpMinimumCellWidthM,
        maximumCells: specifiedRefine.harpMaximumCells,
        maximumPatchCells: specifiedRefine.harpMaximumPatchCells,
        maximumNeighborScaleRatio: specifiedRefine.harpMaximumNeighborScaleRatio,
        minimumCandidateSeparationM: specifiedRefine.harpMinimumCandidateSeparationM,
        maximumVertexDegree: specifiedRefine.harpMaximumVertexDegree,
        minimumTriangleAngleDeg: specifiedRefine.harpMinimumTriangleAngleDeg,
        criterionMinimumAngleDeg: specifiedRefine.harpCriterionMinimumAngleDeg
      });
    }
    if (baseProjectYaml) {
      yaml = await invoke("preserve_unexposed_quality_fields", { baseYaml: baseProjectYaml, yaml });
    }
    if (qualityEdit) {
      yaml = await invoke("set_quality",
        { yaml, minAngleDeg: qualityEdit.minAngle, policy: qualityEdit.policy, autoRefineBatchCells: qualityEdit.batchCells });
    }
    return yaml;
  }

  const api = {

      invoke("set_expert", { yaml, nxp, openmp, niter, niterRefine, maxIterSpc, maxIterCal, halo, maxTransitionRow, setDisType, numRc, vertexPretectLayers, springGlobalType, springRegionalType, beta, relax, weakConcavEliminate, isolatedOcean }),

  };

  function clearCoastalOverlay() {
    if (typeof applyCoastal === "function") applyCoastal(null, false);
  }
  function meshMeritLayer(summary) {
    return summary && (summary.layers || []).find((l) => l.role_kind === "merit" && l.enabled && l.path);
  }
  function meshLandcoverLayer(summary) {
    return summary && (summary.layers || []).find((l) => l.role_kind === "landcover" && l.enabled && l.path);
  }

  function logLine(txt) {
    const box = document.getElementById("logbox") || document.querySelector('.live-pane[data-pane="log"]');
    if (box) {
      // Follow the tail only when the reader is already at it. Scrolling back
      // through a running engine's output must not be yanked forward by the
      // next line; 24px of slack absorbs sub-pixel and rounding drift.
      const follow = box.clientHeight === 0 || box.scrollHeight - box.scrollTop - box.clientHeight <= 24;
      const div = document.createElement("div");
      div.style.whiteSpace = "pre-wrap";
      div.textContent = txt;
      box.appendChild(div);
      if (follow) box.scrollTop = box.scrollHeight;
    }
    console.log("[EarthMesh]", txt);
  }

  let watershedBoundaryPath = "";
  async function loadWatershedBoundary(path) {
    if (!path) {
      watershedBoundaryPath = "";
      if (typeof applyDomainBoundary === "function") applyDomainBoundary(null, false);
      return;
    }
    if (path === watershedBoundaryPath && _domainGeojson) return;
    watershedBoundaryPath = path;
    try {
      const geojson = await api.shapefileBoundary(path);
      if (typeof applyDomainBoundary === "function") applyDomainBoundary(geojson, true);
    } catch (e) {
      watershedBoundaryPath = "";
      if (typeof applyDomainBoundary === "function") applyDomainBoundary(null, false);
      logLine("✗ watershed boundary: " + e);
    }
  }

  // Clear startup placeholders so no stale values show before a real run.
  function clearStartupPlaceholders() {
    const lb = document.getElementById("logbox"); if (lb) lb.textContent = "";
    clearRunArtifacts();
  }

  function clearRunArtifacts() {
    hasRun = false;
    runInfo = null;
    _lastQuality = null;
    if (typeof applyMesh === "function") applyMesh(null);
    if (typeof applyCoastal === "function") applyCoastal(null, false);
    document.querySelectorAll('.live-pane[data-pane="quality"] .mini-metric b')
      .forEach((b) => { b.textContent = "—"; b.style.color = "var(--muted)"; });
    document.querySelectorAll(".badge.pass").forEach((b) => { b.style.display = "none"; });
  }

  window.resetTemplateDerivedState = function () {
      domainEdit = null;
      domainCloseBoundary = normalizeCloseBoundary(null);
      lastSummary = null;
      targetEdit = null;
      cellEdit = null;
      const t = (typeof TPL !== "undefined" && TPL[tpl]) ? TPL[tpl] : {};
      if (t.nxp) { resUnitIdx = 1; resVal = t.nxp; }
      if (t.domainMode) {
        domainMode = t.domainMode;
        regional = domainMode !== "global";
      }
      if (t.closePath) {
        closePath = t.closePath;
        closeFormat = t.closeFormat || inferCloseFormat(t.closePath);
        domainEdit = { kind: "close", path: closePath, format: closeFormat, seaRatio: null };
      }
      if (t.maxPasses != null) maxPasses = t.maxPasses;
      if (t.specifiedClosePath) {
        specifiedRefine = { ...defaultAlgorithmControls(), enabled: true, kind: "close", lon: null, lat: null, radiusKm: null, circleCount: 0, w: null, e: null, s: null, n: null, path: t.specifiedClosePath, closeBoundary: normalizeCloseBoundary(null), algorithm: "method_c", route: "adaptive", adaptiveMaxLevel: 0, adaptiveCoastline: true, hfieldEnabled: false, hfieldG: null, hfieldMaxLevel: null, hfieldBaseM: null };
      }
      if (typeof clearCoastalOverlay === "function") clearCoastalOverlay();
      clearRunArtifacts();

  // ---- live data-layer panel ------------------------------------------------
  // Replace the static step-3 table body with rows from the live ProjectConfig;
  // each Browse opens the native picker and writes back via set_layer_path.
  async function enhanceLayerStep() {
    const table = document.querySelector("#work table.layers");
    if (!table) return;
    const tbody = table.querySelector("tbody");
    if (!tbody) return;
    const z = zh();
    const auto = document.getElementById("autoLayerFolder");
    if (auto) auto.onclick = async () => {
      let folder;
      try { folder = await api.pickDataFolder(); }
      catch (e) { logLine("✗ " + e); return; }
      if (!folder) return;
      let yaml, next;
      try {
        yaml = await api.autofillLayers(await composeYaml(), folder);
        next = await api.summary(yaml);
      } catch (e) { logLine("✗ " + e); return; }
      for (const k of Object.keys(layerEdits)) delete layerEdits[k];
      (next.layers || []).forEach((l) => { if (l.path) layerEdits[l.id] = { path: l.path, enabled: l.enabled }; });
      logLine((z ? "✓ 已匹配数据文件夹 " : "✓ matched data folder ") + folder);
      enhanceLayerStep();
    };
    let sum;
    try { sum = await api.summary(await composeYaml()); }
    catch (e) {
      tbody.textContent = "";
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 5;
      td.style.cssText = "color:var(--fail);padding:12px";
      td.textContent = (z ? "无法读取数据图层：" : "Could not load data layers: ") + e;
      tr.appendChild(td);
      tbody.appendChild(tr);
      logLine("✗ layers: " + e);
      return;
    }
    clearCoastalOverlay();
    tbody.textContent = "";
    const layers = sum.layers || [];
    const selectExclusiveSource = (id, path) => {
      const selected = layers.find((layer) => layer.id === id);
      if (selected && selected.source_field) {
        layers.forEach((sibling) => {
          if (sibling.id !== id && sibling.source_field === selected.source_field) {
            layerEdits[sibling.id] = { path: sibling.path || "", enabled: false };
          }
        });
      }
      layerEdits[id] = { path, enabled: true };
    };
    if (!layers.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 5;
      td.style.cssText = "color:var(--muted);padding:12px";
      td.textContent = z ? "当前模板不需要外部数据图层。" : "This template needs no external data layers.";
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    layers.forEach((l) => {
      const tr = document.createElement("tr");
      tr.dataset.layer = l.id;
      tr.dataset.folder = l.wants_folder ? "1" : "0";
      tr.dataset.path = l.path || "";
      tr.dataset.enabled = l.enabled ? "1" : "0";
      tr.dataset.sourceField = l.source_field || "";

      const swCell = document.createElement("td");
      const sw = document.createElement("div");
      sw.className = "sw" + (l.enabled && l.path ? " on" : "");
      sw.title = z ? "启用/禁用该图层" : "enable/disable layer";
      sw.style.cursor = l.path ? "pointer" : "default";
      swCell.appendChild(sw);

      const idCell = document.createElement("td");
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = "var(--accent)";
      const id = document.createElement("b");
      id.textContent = l.id;
      idCell.append(dot, id);
      if (l.wants_folder) {
        const tag = document.createElement("span");
        tag.style.cssText = "color:var(--muted);font-size:11px";
        tag.textContent = " · " + (z ? "分块目录" : "tiled dir");
        idCell.appendChild(tag);
      }

      const roleCell = document.createElement("td");
      roleCell.style.color = "var(--muted)";
      roleCell.textContent = l.role;

      const pathCell = document.createElement("td");
      if (l.path) {
        const path = document.createElement("span");
        path.className = "path";
        path.textContent = l.path;
        const clear = document.createElement("span");
        clear.className = "btn-ghost em-clear";
        clear.style.cssText = "padding:2px 7px;cursor:pointer";
        clear.textContent = "✕";
        pathCell.append(path, " ", clear);
      } else {
        const browse = document.createElement("span");
        browse.className = "btn-ghost em-browse";
        browse.style.cssText = "padding:3px 9px;cursor:pointer";
        browse.textContent = l.wants_folder ? (z ? "📁 选择文件夹" : "📁 Browse folder") : (z ? "📂 浏览" : "📂 Browse");
        pathCell.appendChild(browse);
      }

      const statusCell = document.createElement("td");
      const cov = document.createElement("span");
      cov.className = "cov " + (l.path ? "ok" : "no");
      cov.textContent = l.path ? (z ? "已选择" : "selected") : (z ? "未设置·判据禁用" : "unset · off");
      statusCell.appendChild(cov);

      tr.append(swCell, idCell, roleCell, pathCell, statusCell);
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll(".em-browse").forEach((b) => {
      b.onclick = async () => {
        const tr = b.closest("[data-layer]");
        const id = tr.dataset.layer;
        const folder = tr.dataset.folder === "1";
        let p;
        try { p = await (folder ? api.pickDataFolder() : api.pickDataFile()); }
        catch (e) { logLine("✗ " + e); return; }
        if (!p) return;
        selectExclusiveSource(id, p);
        enhanceLayerStep();
      };
    });
    tbody.querySelectorAll(".em-clear").forEach((b) => {
      b.onclick = () => {
        const id = b.closest("[data-layer]").dataset.layer;
        layerEdits[id] = { path: "", enabled: false };
        enhanceLayerStep();
      };
    });
    // on/off switch: enable/disable a layer that already has a file set
    tbody.querySelectorAll("tr[data-layer] .sw").forEach((sw) => {
      sw.onclick = () => {
        const tr = sw.closest("[data-layer]");
        const id = tr.dataset.layer;
        const path = tr.dataset.path || "";
        if (!path) return; // nothing to toggle without a file
        const enabled = tr.dataset.enabled !== "1";
        if (enabled) selectExclusiveSource(id, path);
        else layerEdits[id] = { path, enabled: false };
        enhanceLayerStep();
      };
    });
    const card = table.closest(".card");
    const ch = card && card.querySelector(".ch");
    if (ch) ch.textContent = (z ? "实时映射 ProjectConfig.data_layers · " : "live ProjectConfig.data_layers · ")
      + layers.length + (z ? " 个图层" : " layers");
  }

  // ---- domain (step 2) -> DomainConfig --------------------------------------
  const num = (el) => parseFloat(String(el.value).replace(/[^\d.\-]/g, ""));
  function readBbox() {
    const ins = document.querySelectorAll("#work .grid2 input.input"); // [W,E,S,N]
    if (ins.length < 4) return null;
    const b = { w: num(ins[0]), e: num(ins[1]), s: num(ins[2]), n: num(ins[3]) };
    return Object.values(b).every((x) => !isNaN(x)) ? b : null;
  }
  function enhanceDomainStep() {
    // The base UI owns the Global/Regional toggle (var `regional`) and only
    // renders the bbox inputs in regional mode; we mirror that into domainEdit.
    if (hiddenDomainShape && domainEdit && domainEdit.kind === "hidden") return;
    const mode = (typeof domainMode !== "undefined") ? domainMode : ((typeof regional !== "undefined" && regional) ? "regional" : "global");
    if (mode === "global") { domainEdit = { kind: "global" }; loadWatershedBoundary(""); return; }
    const ratio = document.getElementById("seaRatioInput");
    const ratioText = document.getElementById("seaRatioText");
    const readSeaRatio = () => {
      if (!ratio) return (domainEdit && (domainEdit.kind === "bbox" || domainEdit.kind === "shapefile" || domainEdit.kind === "close")) ? domainEdit.seaRatio : null;
      const v = parseFloat(ratio.value);
      return isNaN(v) ? null : v / 100;
    };
    const paintSeaRatio = () => {
      if (ratioText && ratio) ratioText.textContent = ratio.value + "% " + (zh() ? "海洋" : "ocean");
    };
    if (mode === "watershed") {
      const browse = document.getElementById("watershedBrowse");
      const text = document.getElementById("watershedPathText");
      const syncShape = () => {
        const path = (typeof watershedPath !== "undefined" ? watershedPath : "") || "";
        if (path) domainEdit = { kind: "shapefile", path, seaRatio: readSeaRatio() };
        if (text) text.textContent = path ? "📄 " + path : (zh() ? "📄 点击选择 .shp 文件" : "📄 Choose a .shp file");
        paintSeaRatio();
      };
      if (domainEdit && domainEdit.kind === "shapefile") {
        watershedPath = domainEdit.path || "";
        if (ratio && domainEdit.seaRatio != null) ratio.value = Math.round(domainEdit.seaRatio * 100);
      }
      syncShape();
      loadWatershedBoundary(watershedPath);
      if (browse) browse.onclick = async () => {
        let p; try { p = await api.pickDataFile(); } catch (e) { logLine("✗ " + e); return; }
        if (!p) return;
        watershedPath = p;
        domainEdit = { kind: "shapefile", path: p, seaRatio: readSeaRatio() };
        clearRunArtifacts();
        syncShape();
        await loadWatershedBoundary(p);
        await refreshSummary();
      };
      if (ratio) ratio.addEventListener("input", () => {
        if (watershedPath) domainEdit = { kind: "shapefile", path: watershedPath, seaRatio: readSeaRatio() };
        paintSeaRatio();
      });
      return;
    }
    if (mode === "close") {
      const browse = document.getElementById("closeBrowse");
      const text = document.getElementById("closePathText");
      const syncClose = () => {
        const path = (typeof closePath !== "undefined" ? closePath : "") || "";
        if (path) closeFormat = inferCloseFormat(path);
        if (path) domainEdit = { kind: "close", path, format: closeFormat, seaRatio: readSeaRatio() };
        if (text) text.textContent = path ? "📄 " + path : (zh() ? "📄 点击选择文件" : "📄 Choose file");
        paintSeaRatio();
        loadWatershedBoundary(closeFormat === "polygon_shp" ? path : "");
      };
      if (domainEdit && domainEdit.kind === "close") {
        closePath = domainEdit.path || "";
        closeFormat = domainEdit.format || "nml";
        if (ratio && domainEdit.seaRatio != null) ratio.value = Math.round(domainEdit.seaRatio * 100);
      }
      syncClose();
      if (browse) browse.onclick = async () => {
        let p; try { p = await api.pickDataFile(); } catch (e) { logLine("✗ " + e); return; }
        if (!p) return;
        closePath = p;
        closeFormat = inferCloseFormat(p);
        if (!closeFormat) {
          logLine("✗ " + (zh() ? "闭合区域支持 .shp / .nml / .nc / .nc4 / .txt / .csv" : "Close domains support .shp / .nml / .nc / .nc4 / .txt / .csv"));
          return;
        }
        domainEdit = { kind: "close", path: p, format: closeFormat, seaRatio: readSeaRatio() };
        clearRunArtifacts();
        syncClose();
        await refreshSummary();
      };
      if (ratio) ratio.addEventListener("input", () => {
        if (closePath) domainEdit = { kind: "close", path: closePath, format: closeFormat, seaRatio: readSeaRatio() };
        paintSeaRatio();
      });
      bindCloseBoundaryControls(
        "domain",
        () => domainCloseBoundary,
        (value) => { domainCloseBoundary = value; }
      );
      return;
    }
    const sync = () => {
      loadWatershedBoundary("");
      const b = readBbox();
      if (b) {
        domainEdit = Object.assign({ kind: "bbox", seaRatio: readSeaRatio() }, b);
        domBbox = [b.w, b.e, b.s, b.n];
        paintSeaRatio();
        if (typeof updateEstimate === "function") updateEstimate();
        if (typeof drawMap === "function") drawMap();
        if (typeof clearCoastalOverlay === "function") clearCoastalOverlay();
      }
    };
    if (domainEdit && domainEdit.kind === "bbox") {
      const ins = document.querySelectorAll("#work .grid2 input.input");
      if (ins.length >= 4) { ins[0].value = domainEdit.w; ins[1].value = domainEdit.e; ins[2].value = domainEdit.s; ins[3].value = domainEdit.n; }
      if (ratio && domainEdit.seaRatio != null) ratio.value = Math.round(domainEdit.seaRatio * 100);
    } else {
      sync(); // initialize from the shown default inputs
    }

  // ---- quality (step 5) -> QualityConfig ------------------------------------
  async function enhanceQualityStep() {
    const sel = document.getElementById("qualityViolationPolicy");
    const minIn = document.querySelector("#work .quality-detail input.input"); // min angle
    const autoIn = document.getElementById("qualityAutoRefineOn");
    const autoOptions = document.getElementById("qualityAutoRefineOptions");
    const batchIn = document.getElementById("qualityBatchCells");
    const s = await refreshSummary();
    if (!qualityEdit) {
      if (s) qualityEdit = { minAngle: s.min_angle_deg, policy: s.on_violation || "warn", batchCells: s.auto_refine_batch_cells || 1 };
    }
    const autoEligible = !!s;
    const readQ = () => {
      let minAngle = 0, policy = "warn", batchCells = 1;
      if (minIn) { const v = num(minIn); if (minIn.value.trim() && !isNaN(v)) minAngle = v; }
      if (sel) policy = sel.value === "block" ? "block" : "warn";
      if (autoIn && autoIn.checked && !autoIn.disabled) policy = "auto_refine";
      if (batchIn) { const v = Number.parseInt(batchIn.value, 10); if (Number.isInteger(v) && v > 0) batchCells = v; }
      return { minAngle, policy, batchCells };
    };
    const paintAutoRefine = () => {
      const on = !!(autoIn && autoIn.checked && !autoIn.disabled);
      if (autoOptions) autoOptions.style.opacity = on ? "1" : "0.5";
      if (batchIn) batchIn.disabled = !on;
    };
    const update = () => { qualityEdit = readQ(); paintAutoRefine(); clearRunArtifacts(); };
    if (sel) sel.addEventListener("change", update);
    if (minIn) minIn.addEventListener("input", update);
    if (autoIn) autoIn.addEventListener("change", update);
    if (batchIn) batchIn.addEventListener("input", update);
    if (qualityEdit) {
      if (minIn) minIn.value = qualityEdit.minAngle + "°";
      if (batchIn) batchIn.value = String(qualityEdit.batchCells || 1);
      if (sel) sel.value = qualityEdit.policy === "block" ? "block" : "warn";
    }
    if (autoIn) {
      autoIn.disabled = !autoEligible;
      autoIn.checked = autoEligible && !!qualityEdit && qualityEdit.policy === "auto_refine";
      autoIn.title = autoEligible
        ? (zh() ? "支持全球、区域、流域；也可从未细化网格开始" : "Supports global, regional, and watershed domains, including uniform baselines")
        : (zh() ? "正在读取项目配置" : "Loading project configuration");
    }
    paintAutoRefine();
  }

    const readNum = (el) => {
      if (!el || !el.value.trim()) return null;
      const n = parseFloat(el.value);
      return Number.isFinite(n) ? n : null;
    };
    const paintSpecifiedKind = (kind) => {
      const radiusFields = document.getElementById("specifiedRadiusFields");
      const bboxFields = document.getElementById("specifiedBboxFields");
      const closeFields = document.getElementById("specifiedCloseFields");
      if (radiusFields) radiusFields.style.display = kind === "radius" ? "" : "none";
      if (bboxFields) bboxFields.style.display = kind === "bbox" ? "" : "none";
      if (closeFields) closeFields.style.display = kind === "close" ? "" : "none";
      if (specCloseText) specCloseText.textContent = specifiedRefine.path ? "📄 " + specifiedRefine.path : (z?"📄 点击选择 SHP/NML/NetCDF/TXT":"📄 Choose SHP/NML/NetCDF/TXT");
    };
    if (specOn) specOn.onchange = () => {
      specifiedRefine.enabled = specOn.checked;
      clearRunArtifacts();
      enhanceRefinementStep();
    };
    const syncSpecified = () => {
      const kind = specKind ? specKind.value : "radius";
      specifiedRefine = {
        ...specifiedRefine,
        kind,
        lon: readNum(specLon),
        lat: readNum(specLat),
        radiusKm: readNum(specRadius),
        w: readNum(specW),
        e: readNum(specE),
        s: readNum(specS),
        n: readNum(specN),
        path: specifiedRefine.path || null,
      };
      paintSpecifiedKind(kind);
      clearRunArtifacts();
    };
    [specKind, specLon, specLat, specRadius, specW, specE, specS, specN].forEach((el) => {
      if (el) el.addEventListener("input", syncSpecified);
      if (el) el.addEventListener("change", syncSpecified);
    });
    if (specCloseBrowse) specCloseBrowse.onclick = async () => {
      let p; try { p = await api.pickDataFile(); } catch (e) { logLine("✗ " + e); return; }
      if (!p) return;
      if (!inferCloseFormat(p)) {
        logLine("✗ " + (z ? "指定闭合细化支持 .shp / .nml / .nc / .nc4 / .txt / .csv" : "Specified close refinement supports .shp / .nml / .nc / .nc4 / .txt / .csv"));
        return;
      }
      specifiedRefine.path = p;
      if (specKind) specKind.value = "close";
      syncSpecified();
    };
    bindCloseBoundaryControls(
      "specified",
      () => specifiedRefine.closeBoundary,
      (value) => { specifiedRefine.closeBoundary = value; }
    );
    paintSpecifiedKind(specKind ? specKind.value : "radius");
  }

  // ---- run (step 6) ---------------------------------------------------------
  // The Run button lives in step 6's footer; wire the real run onto the fresh
  // element each time the step rebuilds.
  function enhanceRunStep() {
    const b = document.getElementById("runBtn");
    if (b) b.onclick = doRun;
    const ob = document.getElementById("openOutBtn");
    if (ob) ob.onclick = () => {
      if (runInfo && runInfo.outdir) invoke("open_path", { path: runInfo.outdir }).catch((e) => logLine("✗ " + e));
    };
    if (runInfo) renderAutoRefineDecisions(runInfo.autoRefineDecisions || []);
    // Re-render the cached quality result when step 6 rebuilds its DOM.
    if (runInfo && runInfo.ok && _lastQuality) renderQualityCard(_lastQuality);
  }

  // renderStep is a function declaration => reassignable; wrap it to enhance
  // the steps that bind to the live config (domain / layers / refinement /
  // quality) and to wire the relocated Run button.
  if (typeof renderStep === "function") {
    const _renderStep = renderStep;
    renderStep = function (i) {
      _renderStep(i);
      if (i === 0) enhanceNewProjectStep();
      else if (i === 1) enhanceTargetOutputStep();
      else if (i === 2) enhanceDomainStep();
      else if (i === 3) enhanceLayerStep();
      else if (i === 4) enhanceRefinementStep();
      else if (i === 5) enhanceQualityStep();
      else if (i === 6) { enhanceRunStep(); enhanceTargetOutputStep(); }
    };
  }

  // ---- New / Open / Save — actions live in workflow step 0 (the
  // "Project" step), not the header. See onNew/onOpen/onSave + enhanceNewProjectStep().

  // ---- recent projects (persisted across restarts) --------------------------
  function loadRecents() {
    try { return JSON.parse(localStorage.getItem("em.recents") || "[]"); } catch (e) { return []; }
  }
  function pushRecent(path, name) {
    if (!path) return;
    try {
      let r = loadRecents().filter((x) => x.path !== path);
      r.unshift({ path, name: name || path.split(/[\\/]/).pop() });
      localStorage.setItem("em.recents", JSON.stringify(r.slice(0, 8)));
    } catch (e) {}
  }

      expertEdit = {

      const hydroDefaults = defaultHydroRefine();

      hydroRefine = hasHydro ? {

        coastEnabled: !!sum.hydro_coast_refine_enabled,

      thresholdRefine = { enabled: !!sum.threshold_refine_enabled };
      if ((expertEdit.enabled || (specifiedRefine.route || "adaptive") !== "adaptive") && typeof setExpertMode === "function") setExpertMode(true);
