    const specS = document.getElementById("specifiedS");
    const specN = document.getElementById("specifiedN");
    const specCloseBrowse = document.getElementById("specifiedCloseBrowse");
    const specCloseText = document.getElementById("specifiedClosePathText");
    const readNum = (el) => {
      if (!el || !el.value.trim()) return null;
      const n = parseFloat(el.value);
      return Number.isFinite(n) ? n : null;
    };
    const paintSpecifiedKind = (kind) => {
      const radiusFields = document.getElementById("specifiedRadiusFields");
      const bboxFields = document.getElementById("specifiedBboxFields");
      const closeFields = document.getElementById("specifiedCloseFields");
      if (radiusFields) radiusFields.style.display = kind === "radius" ? "" : "none";
      if (bboxFields) bboxFields.style.display = kind === "bbox" ? "" : "none";
      if (closeFields) closeFields.style.display = kind === "close" ? "" : "none";
      if (specCloseText) specCloseText.textContent = specifiedRefine.path ? "📄 " + specifiedRefine.path : (z?"📄 点击选择 SHP/NML/NetCDF/TXT":"📄 Choose SHP/NML/NetCDF/TXT");
    };
    if (specOn) specOn.onchange = () => {
      specifiedRefine.enabled = specOn.checked;
      clearRunArtifacts();
      enhanceRefinementStep();
    };
    const syncSpecified = () => {
      const kind = specKind ? specKind.value : "radius";
      specifiedRefine = {
        ...specifiedRefine,
        kind,
        lon: readNum(specLon),
        lat: readNum(specLat),
        radiusKm: readNum(specRadius),
        w: readNum(specW),
        e: readNum(specE),
        s: readNum(specS),
        n: readNum(specN),
        path: specifiedRefine.path || null,
      };
      paintSpecifiedKind(kind);
      clearRunArtifacts();
    };
    [specKind, specLon, specLat, specRadius, specW, specE, specS, specN].forEach((el) => {
      if (el) el.addEventListener("input", syncSpecified);
      if (el) el.addEventListener("change", syncSpecified);
    });
    if (specCloseBrowse) specCloseBrowse.onclick = async () => {
      let p; try { p = await api.pickDataFile(); } catch (e) { logLine("✗ " + e); return; }
      if (!p) return;
      if (!inferCloseFormat(p)) {
        logLine("✗ " + (z ? "指定闭合细化支持 .shp / .nml / .nc / .nc4 / .txt / .csv" : "Specified close refinement supports .shp / .nml / .nc / .nc4 / .txt / .csv"));
        return;
      }
      specifiedRefine.path = p;
      if (specKind) specKind.value = "close";
      syncSpecified();
    };
    bindCloseBoundaryControls(
      "specified",
      () => specifiedRefine.closeBoundary,
      (value) => { specifiedRefine.closeBoundary = value; }
    );
    paintSpecifiedKind(specKind ? specKind.value : "radius");
  }

  // ---- run (step 6) ---------------------------------------------------------
  // The Run button lives in step 6's footer; wire the real run onto the fresh
  // element each time the step rebuilds.
  function enhanceRunStep() {
    const b = document.getElementById("runBtn");
    if (b) b.onclick = doRun;
    const ob = document.getElementById("openOutBtn");
    if (ob) ob.onclick = () => {
      if (runInfo && runInfo.outdir) invoke("open_path", { path: runInfo.outdir }).catch((e) => logLine("✗ " + e));
    };
    if (runInfo) renderAutoRefineDecisions(runInfo.autoRefineDecisions || []);
    // Re-render the cached quality result when step 6 rebuilds its DOM.
    if (runInfo && runInfo.ok && _lastQuality) renderQualityCard(_lastQuality);
  }

  // renderStep is a function declaration => reassignable; wrap it to enhance
  // the steps that bind to the live config (domain / layers / refinement /
  // quality) and to wire the relocated Run button.
  if (typeof renderStep === "function") {
    const _renderStep = renderStep;
    renderStep = function (i) {
      _renderStep(i);
      if (i === 0) enhanceNewProjectStep();
      else if (i === 1) enhanceTargetOutputStep();
      else if (i === 2) enhanceDomainStep();
      else if (i === 3) enhanceLayerStep();
      else if (i === 4) enhanceRefinementStep();
      else if (i === 5) enhanceQualityStep();
      else if (i === 6) { enhanceRunStep(); enhanceTargetOutputStep(); }
    };
  }

  // ---- New / Open / Save — actions live in workflow step 0 (the
  // "Project" step), not the header. See onNew/onOpen/onSave + enhanceNewProjectStep().

  // ---- recent projects (persisted across restarts) --------------------------
  function loadRecents() {
    try { return JSON.parse(localStorage.getItem("em.recents") || "[]"); } catch (e) { return []; }
  }
  function pushRecent(path, name) {
    if (!path) return;
    try {
      let r = loadRecents().filter((x) => x.path !== path);
      r.unshift({ path, name: name || path.split(/[\\/]/).pop() });
      localStorage.setItem("em.recents", JSON.stringify(r.slice(0, 8)));
    } catch (e) {}
  }

  // Reflect a loaded + validated project into the UI (shared by Open and recents).
  async function reflectProject(res) {
    let sum;
    try { sum = await api.summary(res.yaml); } catch (e) { logLine("✗ " + e); return; }
    projectActive = true;
    baseProjectYaml = res.yaml;
    lastSummary = sum;
    clearRunArtifacts();
    try { await api.validate(res.yaml); lastSummary._valid = true; lastSummary._err = null; }
    catch (e) { lastSummary._valid = false; lastSummary._err = String(e); }
    try {
      const nameEl = document.querySelector(".proj-name");
      if (nameEl) nameEl.value = sum.name;
      metadataEdit = { authors: sum.authors || [], description: sum.description || "" };
      const isRegional = sum.domain === "regional";
      let matchingTpl = TPL.findIndex((t) => t.intent === sum.intent && t.global === !isRegional);
      if (matchingTpl < 0) matchingTpl = TPL.findIndex((t) => t.intent === sum.intent);
      if (matchingTpl >= 0) tpl = matchingTpl;
      targetEdit = { kind: sum.target_kind, modelFormat: sum.model_format };
      cellEdit = String(sum.cell || "").toLowerCase() === "tri" ? "tri" : "hex";
      if (sum.nxp != null) { resUnitIdx = 1; resVal = sum.nxp; }
      else if (sum.approx_degree != null) { resUnitIdx = 2; resVal = sum.approx_degree; }
      else if (sum.approx_km != null) { resUnitIdx = 0; resVal = sum.approx_km; }
      for (const k of Object.keys(layerEdits)) delete layerEdits[k];
      for (const k of Object.keys(thresholdEdits)) delete thresholdEdits[k];
      for (const k of Object.keys(criterionEdits)) delete criterionEdits[k];
      sum.layers.forEach((l) => { if (l.path) layerEdits[l.id] = { path: l.path, enabled: l.enabled }; });
      sum.layers.forEach((l) => { if (l.threshold_value != null) thresholdEdits[l.id] = l.threshold_value; });
      (sum.threshold_criteria || []).forEach((criterion) => {
        criterionEdits[criterion.id] = { enabled: !!criterion.enabled, value: criterion.value };
      });
      domainCloseBoundary = normalizeCloseBoundary(null);
      if (sum.domain_shape === "shapefile") {
        domainMode = "watershed";
        regional = true;
        watershedPath = sum.watershed_path || "";
        domainEdit = { kind: "shapefile", path: watershedPath, seaRatio: sum.sea_ratio ?? null };
        await loadWatershedBoundary(watershedPath);
      } else if (sum.domain_shape === "close") {
        domainMode = "close";
        regional = true;
        closePath = sum.watershed_path || "";
        closeFormat = sum.close_format || "nml";
        domainCloseBoundary = normalizeCloseBoundary(sum.domain_close_boundary);
        domainEdit = { kind: "close", path: closePath, format: closeFormat, seaRatio: sum.sea_ratio ?? null };
        await loadWatershedBoundary(closeFormat === "polygon_shp" ? closePath : "");
      } else if (sum.bbox) {
        domainMode = "regional";
        regional = true;
        domBbox = [sum.bbox[0], sum.bbox[1], sum.bbox[2], sum.bbox[3]];
        domainEdit = { kind: "bbox", w: sum.bbox[0], e: sum.bbox[1], s: sum.bbox[2], n: sum.bbox[3], seaRatio: sum.sea_ratio ?? null };
        await loadWatershedBoundary("");
      } else if (isRegional) {
        domainMode = "regional";
        regional = true;
        domainEdit = { kind: "hidden", shape: sum.domain_shape || "regional" };
        await loadWatershedBoundary("");
      } else {
        domainMode = "global";
        regional = false;
        domainEdit = { kind: "global" };
        await loadWatershedBoundary("");
      }
      hiddenDomainShape = domainEdit.kind === "hidden" ? domainEdit.shape : null;
      expertEdit = {
        enabled: sum.expert_openmp != null || sum.expert_niter != null || sum.expert_niter_refine != null || sum.expert_max_iter_spc != null || sum.expert_max_iter_cal != null || sum.expert_halo != null || sum.expert_max_transition_row != null || sum.expert_set_dis_type != null || sum.expert_num_rc != null || sum.expert_vertex_pretect_layers != null || sum.expert_spring_global_type != null || sum.expert_spring_regional_type != null || sum.expert_beta != null || sum.expert_relax != null,
        nxp: sum.expert_nxp ?? null,
        openmp: sum.expert_openmp ?? null,
        niter: sum.expert_niter ?? null,
        niterRefine: sum.expert_niter_refine ?? null,
        maxIterSpc: sum.expert_max_iter_spc ?? null,
        maxIterCal: sum.expert_max_iter_cal ?? null,
        halo: sum.expert_halo ?? null,
        maxTransitionRow: sum.expert_max_transition_row ?? null,
        setDisType: sum.expert_set_dis_type ?? null,
        numRc: sum.expert_num_rc ?? null,
        vertexPretectLayers: sum.expert_vertex_pretect_layers ?? null,
        springStrategy: springStrategyFromTypes(sum.expert_spring_global_type, sum.expert_spring_regional_type),
        beta: sum.expert_beta ?? null,
        relax: sum.expert_relax ?? null,
        weakConcavEliminate: sum.expert_weak_concav_eliminate ?? null,
      };
      specifiedRefine = {
        enabled: !!sum.specified_refine_enabled,
        kind: sum.specified_refine_kind || "radius",
        lon: sum.specified_refine_lon ?? null,
        lat: sum.specified_refine_lat ?? null,
        radiusKm: sum.specified_refine_radius_km ?? null,
        w: sum.specified_refine_bbox ? sum.specified_refine_bbox[0] : null,
        e: sum.specified_refine_bbox ? sum.specified_refine_bbox[1] : null,
        s: sum.specified_refine_bbox ? sum.specified_refine_bbox[2] : null,
        n: sum.specified_refine_bbox ? sum.specified_refine_bbox[3] : null,
        path: sum.specified_refine_path ?? null,
        closeBoundary: normalizeCloseBoundary(sum.specified_refine_close_boundary),
        hfieldEnabled: sum.hfield_enabled !== false,
        hfieldG: sum.hfield_g ?? null,
        hfieldMaxLevel: sum.hfield_max_level ?? null,
        hfieldBaseM: sum.hfield_base_m ?? null,
      };
      const hydroDefaults = defaultHydroRefine();
      const hasHydro = sum.hydro_coast_buffer_km != null || sum.hydro_river_width_threshold_m != null;
      hydroRefine = hasHydro ? {
        riverWidthEnabled: !!sum.hydro_river_width_refine_enabled,
        riverUpstreamAreaEnabled: !!sum.hydro_river_upstream_area_refine_enabled,
        coastEnabled: !!sum.hydro_coast_refine_enabled,
        coastBufferKm: sum.hydro_coast_buffer_km ?? 0,
        coastLandEnabled: !!sum.hydro_coast_land_refine_enabled,
        coastOceanEnabled: !!sum.hydro_coast_ocean_refine_enabled,
        r2WidthM: sum.hydro_r2_width_m ?? 50,
        r2UpaKm2: sum.hydro_r2_upa_km2 ?? 5000,
        riverWidthThresholdM: sum.hydro_river_width_threshold_m ?? 300,
        riverUpstreamAreaThresholdKm2: sum.hydro_river_upstream_area_threshold_km2 ?? 50000,
      } : hydroDefaults;
      _hydroThresholds = { ...hydroRefine, r3WidthM: hydroRefine.riverWidthThresholdM, r3UpaKm2: hydroRefine.riverUpstreamAreaThresholdKm2 };
      thresholdRefine = { enabled: !!sum.threshold_refine_enabled };
      if ((expertEdit.enabled || specifiedRefine.hfieldEnabled === false) && typeof setExpertMode === "function") setExpertMode(true);
      qualityEdit = { minAngle: sum.min_angle_deg, policy: sum.on_violation || "warn", batchCells: sum.auto_refine_batch_cells || 1 };
      maxPasses = sum.max_passes;
      if (typeof renderSteps === "function") renderSteps();
      if (typeof renderStep === "function") renderStep(typeof cur !== "undefined" ? cur : 0);
    } catch (e) { /* best-effort reflect */ }
    pushRecent(res.path, sum.name);
    logLine("✓ opened " + res.path + " — intent " + sum.intent + ", NXP " + (sum.effective_nxp ?? sum.nxp ?? "?"));
  }

    try {

  // Reset to a clean default project (matches first-load state). Keep the chosen
  // output folder — that's a machine preference, not project data.
  function resetProject() {
    tpl = DEFAULT_TPL; domainMode = "regional"; regional = true; domBbox = [...DEFAULT_BBOX]; watershedPath = ""; closePath = ""; closeFormat = "nml"; domainCloseBoundary = normalizeCloseBoundary(null); targetEdit = null; cellEdit = null;
    resUnitIdx = 0; resVal = RES_UNITS[0].def; maxPasses = null;
    if (typeof clearCoastalOverlay === "function") clearCoastalOverlay();
    clearRunArtifacts();
    loadWatershedBoundary("");
    for (const k of Object.keys(layerEdits)) delete layerEdits[k];
    for (const k of Object.keys(thresholdEdits)) delete thresholdEdits[k];
    for (const k of Object.keys(criterionEdits)) delete criterionEdits[k];
    baseProjectYaml = null;
    domainEdit = null; qualityEdit = null;
    thresholdRefine = { enabled: false };
    hydroRefine = defaultHydroRefine();
    expertEdit = { enabled: false, nxp: null, openmp: null, niter: null, niterRefine: null, maxIterSpc: null, maxIterCal: null, halo: null, maxTransitionRow: null, setDisType: null, numRc: null, vertexPretectLayers: null, springStrategy: null, beta: null, relax: null, weakConcavEliminate: null };
    specifiedRefine = { enabled: false, kind: "radius", lon: null, lat: null, radiusKm: null, w: null, e: null, s: null, n: null, path: null, closeBoundary: normalizeCloseBoundary(null), hfieldEnabled: true, hfieldG: null, hfieldMaxLevel: null, hfieldBaseM: null };
    if (typeof setExpertMode === "function") setExpertMode(false);
    hiddenDomainShape = null;
    metadataEdit = { authors: [], description: "" };
    const nameEl = document.querySelector(".proj-name");
    if (nameEl) nameEl.value = "earthmesh-project";
  }

  // Compute the summary (+ validation) for the current UI state.
  async function refreshSummary() {
    try {
      const yaml = await composeYaml();
      lastSummary = await api.summary(yaml);
      try { await api.validate(yaml); lastSummary._valid = true; lastSummary._err = null; }
      catch (e) { lastSummary._valid = false; lastSummary._err = String(e); }
      return lastSummary;
    } catch (e) { lastSummary = null; return null; }
  }

  function cellShapeLabel(cell) {
    return String(cell || "").toLowerCase() === "tri"
      ? (zh() ? "三角形" : "Triangular")
      : (zh() ? "六边形" : "Hexagonal");
  }

  function compatibleTargetModels(kind) {
    const models = TARGET_COMPATIBILITY[kind];
    return Array.isArray(models) && models.length ? models : [templateDefaultTarget().model_format || "CoLM"];
  }

  function selectedTarget(summary) {
    const preset = templateDefaultTarget();
    const kind = (targetEdit && targetEdit.kind) || (summary && summary.target_kind) || preset.kind || "land";
    const models = compatibleTargetModels(kind);
    const requested = (targetEdit && targetEdit.modelFormat) || (summary && summary.model_format) || preset.model_format;
    return { kind, modelFormat: models.includes(requested) ? requested : models[0], models };
  }

  function paintTargetOutputs(summary) {
    const s = summary || lastSummary;
    const target = selectedTarget(s);
    const model = target.modelFormat;
    const cell = String(cellEdit || (s && s.cell) || templateDefaultCell()).toLowerCase() === "tri" ? "tri" : "hex";
    const mode = (s && s.quality_mode) || (cell === "tri" ? "tri-strict" : "hex-cgrid");
    const kindIn = document.getElementById("targetKindOutput");
    const modelIn = document.getElementById("targetModelOutput");
    const cellIn = document.getElementById("targetCellOutput");
    const modeIn = document.getElementById("targetQualityModeOutput");
    const ready = document.getElementById("readyModelOutput");
    const readyMode = document.getElementById("readyQualityModeOutput");
    const refine = document.getElementById("readyRefinementOutput");
    if (kindIn) kindIn.value = target.kind;
    if (modelIn) {
      modelIn.textContent = "";
      target.models.forEach((format) => {
        const option = document.createElement("option");
        option.value = format;
        option.textContent = format;
        modelIn.appendChild(option);
      });
      modelIn.value = model;
    }
    if (cellIn) cellIn.value = cell;
    if (modeIn) modeIn.textContent = qualityModeLabel(mode, cell);
    if (ready) ready.textContent = model;
    if (readyMode) readyMode.textContent = qualityModeLabel(mode, cell);
    if (refine) refine.textContent = s && s.refine_enabled
      ? ((zh() ? "最多 " : "up to ") + s.max_passes + (zh() ? " 次" : " passes"))
      : (zh() ? "关闭" : "off");
  }

  function readOptionalInt(id) {
    const el = document.getElementById(id);
    if (!el || !el.value.trim()) return null;
    const n = parseInt(el.value, 10);
    return Number.isFinite(n) ? n : null;
  }
  function readOptionalFloat(id) {
    const el = document.getElementById(id);
    if (!el || !el.value.trim()) return null;
    const n = parseFloat(el.value);
    return Number.isFinite(n) ? n : null;
  }
  function readOptionalIntList(id) {
    const el = document.getElementById(id);
    if (!el || !el.value.trim()) return null;
    const xs = el.value.split(/[\s,]+/).filter(Boolean).map((v) => parseInt(v, 10));
    return xs.length && xs.every(Number.isFinite) ? xs : null;
  }
  function inferCloseFormat(path) {
    const p = String(path || "").toLowerCase();
    if (p.endsWith(".shp")) return "polygon_shp";
    if (p.endsWith(".nml")) return "nml";
    if (p.endsWith(".nc") || p.endsWith(".nc4")) return "netcdf";
    if (p.endsWith(".txt") || p.endsWith(".csv")) return "lonlat_text";
    return null;
  }
  function expertEnabled() {
    const discreteMask = specifiedRefine.hfieldEnabled === false;
    return expertEdit.openmp != null || expertEdit.niter != null || expertEdit.niterRefine != null ||
      expertEdit.maxIterSpc != null || expertEdit.maxIterCal != null ||
      (discreteMask && (expertEdit.halo != null || expertEdit.maxTransitionRow != null ||
        expertEdit.setDisType != null || expertEdit.numRc != null ||
        expertEdit.vertexPretectLayers != null || discreteMask)) ||
      expertEdit.springStrategy != null || expertEdit.beta != null || expertEdit.relax != null;
  }

  async function wireExpertTargetStep() {
    const spring = document.getElementById("expertSpringStrategy");
    const openmp = document.getElementById("expertOpenmp");
    const niter = document.getElementById("expertNiter");
    const beta = document.getElementById("expertBeta");
    const relax = document.getElementById("expertRelax");
    if (!spring && !openmp && !niter && !beta && !relax) return;
    const paint = () => {
      if (spring) spring.value = expertEdit.springStrategy ?? "";
      if (openmp) openmp.value = expertEdit.openmp ?? DEFAULT_OPENMP;
      if (niter) niter.value = expertEdit.niter ?? DEFAULT_NITER;
      if (beta) beta.value = expertEdit.beta ?? DEFAULT_BETA;
      if (relax) relax.value = expertEdit.relax ?? DEFAULT_RELAX;
    };
    const update = async () => {
      expertEdit = {
        enabled: true,
        nxp: expertEdit.nxp,
        openmp: readOptionalInt("expertOpenmp"),
        niter: readOptionalInt("expertNiter"),
        niterRefine: expertEdit.niterRefine,
        maxIterSpc: expertEdit.maxIterSpc,
        maxIterCal: expertEdit.maxIterCal,
        halo: expertEdit.halo,
        maxTransitionRow: expertEdit.maxTransitionRow,
        setDisType: expertEdit.setDisType,
        numRc: expertEdit.numRc,
        vertexPretectLayers: expertEdit.vertexPretectLayers,
        springStrategy: spring && spring.value ? spring.value : null,
        beta: readOptionalFloat("expertBeta"),
        relax: readOptionalFloat("expertRelax"),
        weakConcavEliminate: expertEdit.weakConcavEliminate,
      };
      expertEdit.enabled = expertEnabled();
      clearRunArtifacts();
      paintTargetOutputs(await refreshSummary());
      paint();
    };
    paint();
    [spring, openmp, niter, beta, relax].forEach((el) => { if (el) el.oninput = update; if (el) el.onchange = update; });
  }

  async function enhanceTargetOutputStep() {
    const kindIn = document.getElementById("targetKindOutput");
    const modelIn = document.getElementById("targetModelOutput");
    const cellIn = document.getElementById("targetCellOutput");
    if (kindIn) {
      kindIn.onchange = async () => {
        const kind = kindIn.value;
        const models = compatibleTargetModels(kind);
        const currentModel = modelIn && models.includes(modelIn.value) ? modelIn.value : models[0];
        targetEdit = { kind: kind, modelFormat: currentModel };
        clearRunArtifacts();
        paintTargetOutputs(await refreshSummary());
      };
    }
    if (modelIn) {
      modelIn.onchange = async () => {
        const kind = kindIn ? kindIn.value : selectedTarget(lastSummary).kind;
        const models = compatibleTargetModels(kind);
        targetEdit = { kind: kind, modelFormat: models.includes(modelIn.value) ? modelIn.value : models[0] };
        clearRunArtifacts();
        paintTargetOutputs(await refreshSummary());
      };
    }
    if (cellIn) {
      cellIn.onchange = async () => {
        cellEdit = cellIn.value === "tri" ? "tri" : "hex";
        clearRunArtifacts();
        paintTargetOutputs(await refreshSummary());
      };
    }
    const s = await refreshSummary();
    paintTargetOutputs(s);
    wireExpertTargetStep();
  }

  async function onNew() {
    if (!confirm(zh() ? "新建会清空当前项目编辑，确定继续？（如需保留请先用 💾 保存）" : "Start a new project? Current edits will be cleared (use 💾 Save first to keep them).")) return;
    resetProject();
    projectActive = true;
    await refreshSummary();
    if (typeof renderSteps === "function") renderSteps();
    if (typeof renderStep === "function") renderStep(0);
    logLine(zh() ? "✓ 新建项目" : "✓ new project");
  }

  async function openRecent(path) {
    let res;
    try { res = await invoke("read_project", { path }); }
    catch (e) { logLine("✗ open " + path + ": " + e); return; }
    await reflectProject(res);
  }

  // ---- New Project (step 0): output-folder picker + real recent list --------
  function enhanceNewProjectStep() {
    // New / Open / Save actions (the header has none — they live here now)
    const nb = document.getElementById("projNew"); if (nb) nb.onclick = onNew;
    const ob2 = document.getElementById("projOpen"); if (ob2) ob2.onclick = onOpen;
    const sb2 = document.getElementById("projSave"); if (sb2) sb2.onclick = onSave;
    const nameStep = document.getElementById("projectNameStep");
    const nameTop = document.querySelector(".proj-name");
    const author = document.getElementById("projectAuthor");
    const desc = document.getElementById("projectDescription");
    if (nameStep && nameTop) nameStep.value = nameTop.value;
    if (author) author.value = (metadataEdit.authors || []).join(", ");
    if (desc) desc.value = metadataEdit.description || "";
    if (nameStep && nameTop) nameStep.oninput = () => { nameTop.value = nameStep.value; };
    if (author) author.oninput = () => { metadataEdit.authors = author.value.split(",").map((s) => s.trim()).filter(Boolean); };
    if (desc) desc.oninput = () => { metadataEdit.description = desc.value; };
    // output-folder picker
    const opb = document.getElementById("outPathBrowse");
    const t0 = document.getElementById("outPathText");
    if (t0 && outputPath) t0.textContent = "📁 " + outputPath; // reflect a remembered path
    if (opb) opb.onclick = async () => {

  // Run -> compose YAML -> spawn the mesh engine, stream logs, report status.
  async function doRun() {
    const rtext = document.getElementById("rtext");
    const rdot = document.getElementById("rdot");
    const setStatus = (txt, done) => {
      if (rtext) rtext.textContent = txt;
      if (rdot) rdot.classList.toggle("on", !!done);
    };
    setStatus(zh() ? "运行中…" : "running…", false);
    setRunControls(true);
    clearRunArtifacts();
    // show the Log pane because the Run button now lives inside the step footer
    document.querySelectorAll("#liveTabs button").forEach(x => x.classList.toggle("on", x.dataset.pane === "log"));
    document.querySelectorAll(".live-pane").forEach(p => p.classList.toggle("on", p.dataset.pane === "log"));
    let finalQuality = null;
    try {
      for (;;) {
        let yaml;
        try { yaml = await composeYaml(); } catch (e) { logLine("✗ " + e); setStatus(zh() ? "运行失败" : "failed", true); setRunControls(false); return; }
        try { lastSummary = await api.summary(yaml); } catch (e) {}
        logLine("\n▶ " + (zh() ? "启动网格引擎（" : "starting mesh engine (") + currentIntent() + ", " + currentResolutionLabel() + ")");
        const r = await api.runProject(yaml, outputPath || null);
        logLine(r.ok ? ("✓ " + (zh() ? "完成 — 输出在 " : "done — outputs in ") + r.outdir)
                     : ("✗ " + (zh() ? "退出码 " : "exited with code ") + r.code));
        setStatus(r.ok ? (zh() ? "运行完成" : "finished") : (zh() ? "运行失败" : "failed"), true);
        const decisions = Array.isArray(r.auto_refine_decisions) ? r.auto_refine_decisions : [];
        hasRun = true; runInfo = { ok: r.ok, outdir: r.outdir, code: r.code, gridfile: r.gridfile, autoRefineDecisions: decisions };
        if (decisions.length) logLine((zh() ? "✓ 已载入 AutoRefine 决策记录：" : "✓ loaded AutoRefine decisions: ") + decisions.length);
        break;
      }
    } catch (e) {
      logLine("✗ " + (zh() ? "运行失败: " : "run failed: ") + e);
      setStatus(zh() ? "运行失败" : "failed", true);
      hasRun = true; runInfo = { ok: false, outdir: "", code: null, autoRefineDecisions: [] };
    }
    setRunControls(false);
    if (typeof cur !== "undefined" && cur === 6 && typeof renderStep === "function") renderStep(6);
    if (runInfo && runInfo.ok && runInfo.gridfile) loadQualityAndMesh(runInfo.gridfile, finalQuality);
    else if (runInfo && runInfo.ok) {
      logLine(zh() ? "⚠ 引擎未报告 gridfile；跳过质量分析和地图叠加。" : "⚠ engine did not report gridfile; skipping quality and map overlay.");
      renderMissingGridfile();
    }
  }

  // After a successful run: parse mesh quality into the step-6 card, and overlay

  function meshViewKind() {
    return (lastSummary && String(lastSummary.cell || "").toLowerCase() === "tri") ? "tri" : "hex";
  }
  function readMeshQuality(gridfile) {
    const minAngleDeg = lastSummary && Number(lastSummary.min_angle_deg);
    const onViolation = lastSummary && lastSummary.on_violation;
    return invoke("mesh_quality", {
      gridfile,
      kind: meshViewKind(),
      minAngleDeg: Number.isFinite(minAngleDeg) ? minAngleDeg : DEFAULT_MIN_ANGLE_DEG,
      onViolation: onViolation || "warn"
    });

  function loadMeshMeritCells(gridfile, kind) {
    const summary = lastSummary;
    const merit = meshMeritLayer(summary);
    const landcover = meshLandcoverLayer(summary);
    const b = summary && summary.bbox;
    if (!merit || !b) { clearCoastalOverlay(); return; }
    _hydroThresholds = {
      r2WidthM: summary.hydro_r2_width_m ?? 50,
      r2UpaKm2: summary.hydro_r2_upa_km2 ?? 5000,
      r3WidthM: summary.hydro_river_width_threshold_m ?? 300,
      r3UpaKm2: summary.hydro_river_upstream_area_threshold_km2 ?? 50000,
      coastBufferKm: summary.hydro_coast_buffer_km ?? 0,
      coastLandEnabled: !!summary.hydro_coast_land_refine_enabled,
      coastOceanEnabled: !!summary.hydro_coast_ocean_refine_enabled,
    };
    invoke("mesh_merit_cells", { gridfile, kind, meritRoot: merit.path, w: b[0], e: b[1], s: b[2], n: b[3], stride: MERIT_SURFACE_PREVIEW_STRIDE, landtypeFile: landcover && landcover.path ? landcover.path : null, r2WidthM:_hydroThresholds.r2WidthM, r2UpaKm2:_hydroThresholds.r2UpaKm2, r3WidthM:_hydroThresholds.r3WidthM, r3UpaKm2:_hydroThresholds.r3UpaKm2 })
      .then((txt) => {

  // A distribution row: [min..max] track with the μ±σ band + mean tick.
  function statBar(label, s, unit) {
    if (!s || (s.max === 0 && s.min === 0 && s.mean === 0)) return "";
    const W = 240, H = 26, pad = 3;
    const min = s.min, max = s.max, mean = s.mean, std = s.std || 0;
    const range = (max - min) || 1;
    const x = (v) => pad + (Math.max(min, Math.min(max, v)) - min) / range * (W - 2 * pad);
    const lo = Math.max(min, mean - std), hi = Math.min(max, mean + std);
    const fmt = (v) => Math.abs(v) >= 100 ? v.toFixed(0) : (Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3));
    const u = unit ? " " + unit : "";
    return `<div style="margin:9px 0">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">
        <span style="font-weight:600">${label}</span>
        <span style="color:var(--muted)">μ ${fmt(mean)}${u} · σ ${fmt(std)}</span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
        <line x1="${x(min)}" y1="${H/2}" x2="${x(max)}" y2="${H/2}" stroke="var(--border)" stroke-width="2"/>
        <rect x="${x(lo)}" y="${H/2-6}" width="${Math.max(1,x(hi)-x(lo))}" height="12" fill="var(--accent)" fill-opacity="0.25" rx="2"/>
        <line x1="${x(mean)}" y1="${H/2-8}" x2="${x(mean)}" y2="${H/2+8}" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="${x(min)}" cy="${H/2}" r="2.6" fill="var(--muted)"/><circle cx="${x(max)}" cy="${H/2}" r="2.6" fill="var(--muted)"/></svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--faint)"><span>${fmt(min)}</span><span>${fmt(max)}${u}</span></div>
    </div>`;
  }

      ${statBar(z ? "边长" : "Edge length", q.edge_length_km, "km")}
      ${statBar(z ? "纵横比" : "Aspect ratio", q.aspect_ratio, "")}
      ${statBar(z ? "紧致度" : "Compactness", q.compactness, "")}
      ${statBar(z ? "单元面积" : "Cell area", q.cell_area, "")}`;
    const text = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
    text("qualityVerdictBadge", verdict);
    text("qualityCells", num(q.cell_count));
    text("qualityVertices", num(q.vertex_count));
    text("qualityEdges", num(q.edge_count));
    const angleRange = (typeof q.min_angle_deg === "number" && typeof q.max_angle_deg === "number")
      ? q.min_angle_deg.toFixed(1) + "°–" + q.max_angle_deg.toFixed(1) + "°"
      : "N/A";
    text("qualityAngleRange", angleRange);
    text("qualityCellView", q.cell_view || "");
    const cellSides = (q.cell_sides || []).filter((t) => t[1] > 0);
    if (cellSides.length) {
      const sideTitle = document.createElement("div");
      sideTitle.className = "ch";
      sideTitle.style.marginTop = "10px";
      sideTitle.textContent = z ? "单元边数（观测）" : "Cell sides (observed)";
      card.appendChild(sideTitle);
      const sideLabels = { triangle: z ? "三角形" : "triangles", quadrilateral: z ? "四边形" : "quadrilaterals", pentagon: z ? "五边形" : "pentagons", hexagon: z ? "六边形" : "hexagons", heptagon: z ? "七边形" : "heptagons", other: z ? "其他" : "other" };
      cellSides.forEach((t) => {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;justify-content:space-between;padding:3px 2px;font-size:12px;color:var(--muted)";
        const name = document.createElement("span");
        name.textContent = sideLabels[t[0]] || t[0];
        const count = document.createElement("b");
        count.textContent = num(t[1]);
        row.append(name, count);
        card.appendChild(row);
      });
    }
    if (q.gates && q.gates.length) {
      const title = document.createElement("div");
      title.className = "ch";
      title.style.marginTop = "10px";
      title.textContent = z ? "门禁" : "Gates";
      card.appendChild(title);
      q.gates.forEach((g) => {
        const col = g.level === "pass" ? "var(--pass)" : (g.level === "fail" ? "#e5484d" : "var(--warn)");
        const v = typeof g.value === "number"
          ? (Math.abs(g.value) >= 100 ? g.value.toFixed(0) : g.value.toFixed(2))
          : "N/A";
        const row = document.createElement("div");
        row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:5px 2px;border-bottom:1px solid var(--border-soft);font-size:12.5px";
        const metric = document.createElement("span");
        metric.textContent = g.metric;
        const result = document.createElement("span");
        const value = document.createElement("b");
        value.textContent = v;
        const level = document.createElement("span");
        level.style.cssText = "display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;background:" + col;
        level.textContent = (g.level || "?").toUpperCase();
        result.append(value, " ", level);
        row.append(metric, result);
        card.appendChild(row);
      });
    }
    const issues = (q.topology || []).filter((t) => t[1] > 0)
      .concat([[z ? "零面积" : "zero-area", q.zero_area], [z ? "负面积" : "negative-area", q.negative_area], [z ? "自相交" : "self-intersection", q.self_intersection], [z ? "非法多边形" : "invalid polygon", q.invalid_polygon]].filter((t) => t[1] > 0));
    const issueTitle = document.createElement("div");
    issueTitle.className = "ch";
    issueTitle.style.marginTop = "10px";
    issueTitle.textContent = z ? "拓扑 / 退化" : "Topology / degeneracy";
    card.appendChild(issueTitle);
    if (issues.length) {
      issues.forEach((t) => {
        const issue = document.createElement("div");
        issue.style.cssText = "font-size:12px;color:var(--warn)";
        issue.textContent = "• " + t[0] + ": " + num(t[1]);
        card.appendChild(issue);
      });
    } else {
      const ok = document.createElement("div");
      ok.style.cssText = "font-size:12px;color:var(--pass)";
      ok.textContent = "✓ " + (z ? "无拓扑问题" : "no issues");
      card.appendChild(ok);
    }
    if (q.max_adjacent_resolution_ratio) {
      const ratio = document.createElement("div");
      ratio.style.cssText = "font-size:12px;color:var(--muted)";
      ratio.textContent = (z ? "最大相邻分辨率比" : "max adjacent res. ratio") + ": " + q.max_adjacent_resolution_ratio.toFixed(2);
      card.appendChild(ratio);
    }
    if (q.report_path || q.worst_cells_path) {
      const btns = document.createElement("div");
      btns.style.marginTop = "12px";
      if (q.report_path) {
        const report = document.createElement("span");
        report.className = "btn-ghost";
        report.id = "qReportBtn";
        report.style.cssText = "cursor:pointer;margin-right:8px";
        report.textContent = "📄 " + (z ? "质量报告" : "Report");
        btns.appendChild(report);
      }
      if (q.worst_cells_path) {
        const worst = document.createElement("span");
        worst.className = "btn-ghost";
        worst.id = "qWorstBtn";
        worst.style.cursor = "pointer";
        worst.textContent = "⚠ " + (z ? "最差单元" : "Worst cells");
        btns.appendChild(worst);
      }
      card.appendChild(btns);
    }
    const rb = document.getElementById("qReportBtn");
    if (rb && q.report_path) rb.onclick = () => invoke("open_path", { path: q.report_path }).catch((e) => logLine("✗ " + e));
    const wb = document.getElementById("qWorstBtn");
    if (wb && q.worst_cells_path) wb.onclick = () => invoke("open_path", { path: q.worst_cells_path }).catch((e) => logLine("✗ " + e));

    // reflect into the right-panel Quality tab (mini-metrics + verdict badge)
    const minis = document.querySelectorAll('.live-pane[data-pane="quality"] .mini-metric b');
    const setMini = (i, txt, col) => { if (minis[i]) { minis[i].textContent = txt; minis[i].style.color = col || "var(--text)"; } };
    setMini(0, num(q.cell_count));
    setMini(1, num(q.vertex_count));
    setMini(2, typeof q.min_angle_deg === "number" ? q.min_angle_deg.toFixed(1) + "°" : "N/A", color);
    if (q.aspect_ratio) setMini(3, q.aspect_ratio.max.toFixed(2));
    document.querySelectorAll('.live-pane[data-pane="quality"] .badge').forEach((b) => { b.style.display = ""; b.style.background = color; b.textContent = "● " + verdict; });
  }

  // The Run button moved into step 6's footer; enhanceRunStep() wires it each
  // time that step renders (see the renderStep wrapper above).
})();
</script>
