schema_version: 3.0.0
metadata:
  name: icon_nest_global
  authors: []
  description: >-
    Global ICON with refinement by ICON nests: the global grid stays as it
    is and the three circles are served by a nest of bisected parent
    triangles, written as linked ICON grid files (guide 11.86).
domain: Global
target:
  kind: Atmosphere
  cell: Tri
  resolution: !Nxp 40
  model_format: Icon
data_layers: []
refinement:
  enabled: true
  backend: IconNest
  max_passes: 1
  # A list here, a single mapping in auto_refine.yaml — both are accepted.
  # Radius must clear one rad3 footprint at the parent generation or Method-C
  # cannot seed inside the circle; see coast_refinement_regions.
  specified_circle:
    - lon: 113.5
      lat: 22.0
      radius_km: 200.0
    - lon: 115.0
      lat: 22.6
      radius_km: 200.0
    - lon: 116.5
      lat: 23.2
      radius_km: 200.0
quality:
  min_angle_deg: 25.0
expert:
  niter: 1
  # Regression-speed override only. Omit in production to retain Method-C's
  # canonical 5000-atmosphere / 2000-surface spring iterations.
  niter_refine: 1
