schema_version: 3.0.0
metadata:
  name: cmrc_global_land_hex
  authors: []
  description: CMRC reverse coarsening on a land-cover threshold, global land hex with land-cover carve.
domain: Global
target:
  kind: Land
  cell: Hex
  resolution: !Nxp 3
  model_format: CoLM
data_layers:
- id: landcover
  role: LandType
  path: /Users/zhongwangwei/Desktop/Github/EarthMesh/input/landtype_igbp_update.nc
  enabled: true
refinement:
  enabled: true
  backend: Certified
  max_passes: 1
  threshold_enabled: true
  threshold_criteria:
  - id: landcover
    enabled: true
    value: 12.0
  certified:
    mode: reverse_coarsening
    delivery: hex
    maximum_level: 2
    maximum_cells: 200000
quality:
  min_angle_deg: 25.0
  on_violation: Warn
expert: {}
