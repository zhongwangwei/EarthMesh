# EarthMesh v3 hydro-mesh example for CoLM2024-oriented CaMa-Flood refinement.
# This file documents the first intended workflow. The current implementation
# already supports CSV classification; direct NetCDF map reading is gated by
# docs/hydro_mesh_data_requirements.md.

hydro_mesh:
  mode: hybrid_river_mesh
  target_dx_km: 10.0
  bbox:
    west: 100.0
    east: 125.0
    south: 18.0
    north: 42.0

  input:
    cama_map_dir: /path/to/CaMa-Flood/map
    reach_inventory_csv: /path/to/reaches.csv
    coastline_source: landtype_mask
    colm_landtype_file: input/landtype_usgs_update.nc

  classification:
    explicit_2d:
      width_fraction_of_dx: 0.25
      min_upstream_area_km2: 50000.0
      force_flags:
        - estuary
        - delta
        - coastal_wetland
        - major_confluence
    one_d_with_refine:
      width_fraction_of_dx: 0.10
      min_upstream_area_km2: 10000.0
      buffer_km:
        - 2.0
        - 5.0
        - 10.0
    one_d_only:
      min_upstream_area_km2: 1000.0

  output:
    classified_reaches_jsonl: output/hydro_mesh/classified_reaches.jsonl
    priority_grid_nc: output/hydro_mesh/hydro_refine_priority.nc
    earthmesh_mask_prefix: input/refine_spc_hydro
    report: output/hydro_mesh/hydro_mesh_summary.md
