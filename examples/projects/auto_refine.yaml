schema_version: 3.0.0
metadata:
  name: auto_refine_example
  authors: []
  description: Regional Method-C quality repair and recheck without external data.
domain: !Regional
  shape: !Bbox
    w: -80.0
    e: 80.0
    n: 50.0
    s: -50.0
target:
  kind: Atmosphere
  cell: Hex
  intent: AtmosphereMpas
  resolution: !Nxp 40
  model_format: Mpas
data_layers: []
refinement:
  enabled: true
  max_passes: 1
  specified_circle:
    lon: 0.0
    lat: 0.0
    radius_km: 500.0
quality:
  min_angle_deg: 25.0
  auto_refine_batch_cells: 1
  on_violation: AutoRefine
expert:
  niter: 1
  # Regression-speed override only. Omit in production to retain Method-C's
  # canonical 5000-atmosphere / 2000-surface spring iterations.
  niter_refine: 1
