name: CI

# Minimal-but-effective regression gate for EarthMesh v3.
# - `fast`  : fmt + pure Rust crates (no NetCDF, no GUI). Seconds, no system deps.
# - `gui`   : frontend syntax + Tauri fmt/clippy/tests with Linux webview deps.
# - `heavy` : cli with system NetCDF (dynamic link, no source build).
# Large MERIT-Hydro / external-data tests stay `#[ignore]` and never run here.

on:
  push:
    branches: [master, "v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (fmt + no-netcdf crates)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Active taskbook, frozen evidence, and architecture gates
        run: make check-active-taskbook check-architecture check-architecture-selftest
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Install cargo-nextest
        # Prebuilt release; every test runs in its own process, and all test
        # binaries share one parallel pool instead of running one at a time.
        run: curl -LsSf https://get.nexte.st/0.9/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Format check (fix locally with `cargo fmt`)
        run: make fmt
      - name: Lint gate — clippy -D warnings, no-netcdf crates (reproduce with `make clippy`)
        run: make clippy
      - name: Fast tests — the fourteen no-NetCDF crates, under nextest (the same tests as `make test-fast`)
        run: make nextest-fast
      - name: How to reproduce a failure
        if: failure()
        run: |
          echo "::error::Fast gate failed. Reproduce locally:"
          echo "  make fmt        # formatting"
          echo "  make clippy     # clippy -D warnings (the fourteen no-NetCDF crates)"
          echo "  make test-fast  # the same tests through cargo test (no NetCDF needed)"
          echo "  make nextest-fast  # as CI runs them, if cargo-nextest is installed"

  gui:
    name: gui (JS + Tauri fmt/clippy/tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri v2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Frontend JavaScript drift/syntax gate
        run: make check-gui-js
      - name: Tauri format check
        run: make fmt-gui
      - name: Tauri lint gate
        run: make clippy-gui
      - name: Tauri command tests
        run: make test-gui

  heavy:
    name: heavy (cli, system NetCDF)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install NetCDF system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnetcdf-dev libhdf5-dev pkg-config
      - name: Install clippy
        run: rustup component add clippy
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/0.9/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: CLI lint gate (clippy -D warnings, dynamic system NetCDF)
        # No `static-netcdf`: lint against the apt libnetcdf, matching the test step.
        # earthmesh_delivery and earthmesh_inputs need NetCDF too, so they are linted and
        # tested here, not in `fast`.
        run: |
          cargo clippy --manifest-path rust/earthmesh_delivery/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/earthmesh_inputs/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets -- -D warnings
      - name: CLI tests under nextest (dynamic system NetCDF — reproduce with `make test`)
        # No `static-netcdf` feature: link the apt libnetcdf instead of building netcdf-c.
        # nextest runs the same tests as `cargo test --all-targets`, all binaries
        # in one parallel pool, and reports every failure rather than stopping
        # at the first failing binary.
        run: |
          cargo nextest run --manifest-path rust/earthmesh_delivery/Cargo.toml --all-targets --no-fail-fast
          cargo nextest run --manifest-path rust/earthmesh_inputs/Cargo.toml --all-targets --no-fail-fast
          cargo nextest run --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets --no-fail-fast
      - name: How to reproduce a failure
        if: failure()
        run: |
          echo "::error::Heavy gate failed. Reproduce locally (needs NetCDF):"
          echo "  cargo clippy --manifest-path rust/earthmesh_{delivery,inputs,cli}/Cargo.toml --all-targets -- -D warnings"
          echo "  cargo test --manifest-path rust/earthmesh_{delivery,inputs,cli}/Cargo.toml --all-targets   # system NetCDF"
          echo "  cargo nextest run --manifest-path rust/earthmesh_{delivery,inputs,cli}/Cargo.toml --all-targets --no-fail-fast   # as CI runs them"
          echo "  make clippy-full  # clippy -D warnings, all crates (bundled static-netcdf)"
          echo "  make test         # CLI with bundled static-netcdf (no system NetCDF needed)"
