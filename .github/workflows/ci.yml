name: CI

# Minimal-but-effective regression gate for EarthMesh v3.
# - `fast`  : fmt + pure Rust crates (no NetCDF, no GUI). Seconds, no system deps.
# - `gui`   : frontend syntax + Tauri fmt/clippy/tests with Linux webview deps.
# - `heavy` : cli with system NetCDF (dynamic link, no source build).
# Large MERIT-Hydro / external-data tests stay `#[ignore]` and never run here.

on:
  push:
    branches: [master, "v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (fmt + no-netcdf crates)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Active taskbook and frozen Alpha6 evidence
        run: make check-active-taskbook
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Format check (fix locally with `cargo fmt`)
        run: make fmt
      - name: Lint gate — clippy -D warnings, no-netcdf crates (reproduce with `make clippy`)
        run: make clippy
      - name: Fast tests — the twelve no-NetCDF crates, all three refine backends included
        run: make test-fast
      - name: How to reproduce a failure
        if: failure()
        run: |
          echo "::error::Fast gate failed. Reproduce locally:"
          echo "  make fmt        # formatting"
          echo "  make clippy     # clippy -D warnings (the twelve no-NetCDF crates, all three refine backends included)"
          echo "  make test-fast  # the twelve no-NetCDF crates, all three refine backends included (no NetCDF needed)"

  gui:
    name: gui (JS + Tauri fmt/clippy/tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri v2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Frontend JavaScript drift/syntax gate
        run: make check-gui-js
      - name: Tauri format check
        run: make fmt-gui
      - name: Tauri lint gate
        run: make clippy-gui
      - name: Tauri command tests
        run: make test-gui

  heavy:
    name: heavy (cli, system NetCDF)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install NetCDF system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnetcdf-dev libhdf5-dev pkg-config
      - name: Install clippy
        run: rustup component add clippy
      - name: CLI lint gate (clippy -D warnings, dynamic system NetCDF)
        # No `static-netcdf`: lint against the apt libnetcdf, matching the test step.
        run: cargo clippy --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets -- -D warnings
      - name: CLI tests (dynamic system NetCDF — reproduce with `make test`)
        # No `static-netcdf` feature: link the apt libnetcdf instead of building netcdf-c.
        run: cargo test --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets
      - name: How to reproduce a failure
        if: failure()
        run: |
          echo "::error::Heavy gate failed. Reproduce locally (needs NetCDF):"
          echo "  cargo clippy --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets -- -D warnings"
          echo "  cargo test --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets   # system NetCDF"
          echo "  make clippy-full  # clippy -D warnings, all crates (bundled static-netcdf)"
          echo "  make test         # CLI with bundled static-netcdf (no system NetCDF needed)"
