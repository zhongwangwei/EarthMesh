name: CI

# Minimal-but-effective regression gate for EarthMesh v3.
# - `fast`  : fmt + pure Rust crates (no NetCDF, no GUI). Seconds, no system deps.
# - `heavy` : cli + gui with system NetCDF + eframe deps (dynamic link, no source build).
# Large MERIT-Hydro / external-data tests stay `#[ignore]` and never run here.

on:
  push:
    branches: [master, "v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: fast (fmt + no-netcdf crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Format check (fix locally with `cargo fmt`)
        run: make fmt
      - name: Lint gate — clippy -D warnings, no-netcdf crates (reproduce with `make clippy`)
        run: make clippy
      - name: Fast tests — core/geometry/mesh/quality/refine_planner (reproduce with `make test-fast`)
        run: make test-fast
      - name: How to reproduce a failure
        if: failure()
        run: |
          echo "::error::Fast gate failed. Reproduce locally:"
          echo "  make fmt        # formatting"
          echo "  make clippy     # clippy -D warnings (core/geometry/mesh/quality/refine_planner)"
          echo "  make test-fast  # core/geometry/mesh/quality/refine_planner (no NetCDF needed)"

  heavy:
    name: heavy (cli + gui, system NetCDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install NetCDF + GUI system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnetcdf-dev libhdf5-dev pkg-config \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Install clippy
        run: rustup component add clippy
      - name: CLI lint gate (clippy -D warnings, dynamic system NetCDF)
        # No `static-netcdf`: lint against the apt libnetcdf, matching the test step.
        run: cargo clippy --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets -- -D warnings
      - name: CLI tests (dynamic system NetCDF — reproduce with `make test`)
        # No `static-netcdf` feature: link the apt libnetcdf instead of building netcdf-c.
        run: cargo test --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets
      - name: GUI lint gate (clippy -D warnings)
        run: cargo clippy --manifest-path rust/earthmesh_gui/Cargo.toml --all-targets -- -D warnings
      - name: GUI tests (reproduce with `make test-gui`)
        run: cargo test --manifest-path rust/earthmesh_gui/Cargo.toml --all-targets
      - name: How to reproduce a failure
        if: failure()
        run: |
          echo "::error::Heavy gate failed. Reproduce locally (needs NetCDF):"
          echo "  cargo clippy --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets -- -D warnings"
          echo "  cargo test --manifest-path rust/earthmesh_cli/Cargo.toml --all-targets   # system NetCDF"
          echo "  make clippy-full  # clippy -D warnings, all crates (bundled static-netcdf)"
          echo "  make test         # CLI with bundled static-netcdf (no system NetCDF needed)"
          echo "  make test-gui     # GUI"
