[package]
name = "earthmesh_gui"
version = "0.1.0"
edition = "2021"
description = "EarthMesh — unstructured mesh generation for land, ocean and atmosphere models"

[dependencies]
eframe = "0.34"
earthmesh_core = { path = "../earthmesh_core" }
earthmesh_quality = { path = "../earthmesh_quality" }
earthmesh_cli = { path = "../earthmesh_cli", features = ["static-netcdf"] }
rfd = "0.17.2"
open = "5.3.5"
walkers = { version = "0.53.0", features = ["pmtiles", "mvt"] }

# egui desktop app: a few lints fire on idiomatic UI patterns kept for clarity —
# imperative app/test setup (`EarthMeshApp::default()` then field assignment is clearer
# than a 30-field struct literal), parallel-array criterion-row loops, and a couple of
# wide UI/output helper signatures. Allowed package-wide rather than contorted.
[lints.clippy]
field_reassign_with_default = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"

[package.metadata.packager]
product-name = "EarthMesh"
identifier = "edu.sysu.earthmesh.gui"
icons = ["icons/icon.icns", "icons/icon.png"]
category = "Education"
authors = ["Zhongwang Wei @ SYSU"]
# Bundle tracked starter cases. Optional PMTiles basemaps are discovered at runtime
# from EARTHMESH_BASEMAP, app Resources, or the developer assets directory.
resources = ["../../examples"]
