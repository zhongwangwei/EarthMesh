[package]
name = "earthmesh_boundary"
version = "3.0.0-alpha5"
edition = "2021"
description = "Backend-neutral spherical boundary topology: loops, roles and holes that survive as constraints rather than being re-read each pass."
license = "GPL-2.0-only"
repository = "https://github.com/zhongwangwei/EarthMesh"

[lib]
name = "earthmesh_boundary"
path = "src/lib.rs"

[dependencies]
earthmesh_core = { path = "../earthmesh_core" }
earthmesh_geometry = { path = "../earthmesh_geometry" }
