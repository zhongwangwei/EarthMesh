[package]
name = "earthmesh_cli"
version = "0.1.0"
edition = "2021"
description = "mkgrd-compatible command-line adapter and workflow library for EarthMesh v3"
license = "MIT OR Apache-2.0"

[dependencies]
earthmesh_core = { path = "../earthmesh_core" }
earthmesh_geometry = { path = "../earthmesh_geometry" }
earthmesh_hfield = { path = "../earthmesh_hfield" }
earthmesh_mesh = { path = "../earthmesh_mesh" }
earthmesh_quality = { path = "../earthmesh_quality" }
earthmesh_refine_planner = { path = "../earthmesh_refine_planner" }
earthmesh_project = { path = "../earthmesh_project" }
flate2 = "1"
hdf5-sys = { package = "hdf5-metno-sys", version = "0.11.1" }
netcdf = { version = "0.12.0", default-features = false }

[features]
# Statically bundle netCDF-c + HDF5 + zlib so the CLI / packaged mkgrd.x
# can produce a self-contained, zero-runtime-dependency binary. Off by default
# so the normal CLI build keeps linking the system NetCDF.
static-netcdf = ["netcdf/static"]

# Much of this crate is a close migration of OLAM's Fortran mkgrd routines. These lints
# fire on patterns that deliberately mirror the Fortran source (multi-argument
# subroutine signatures, 1-based index loops over parallel arrays, flattened
# connectivity/report types, large report enums). Allowed package-wide for traceability.
[lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
