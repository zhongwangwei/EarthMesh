[package]
name = "earthmesh_project"
version = "3.0.0-alpha3"
edition = "2021"
description = "EarthMesh v3 project schema (intent layer): serde ProjectConfig that lowers to the engine's EarthmeshConfig/RefineConfig"
license = "GPL-2.0-only"
repository = "https://github.com/zhongwangwei/EarthMesh"

[lib]
name = "earthmesh_project"
path = "src/lib.rs"

[dependencies]
earthmesh_core = { path = "../earthmesh_core" }
earthmesh_geometry = { path = "../earthmesh_geometry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
proj4rs = { version = "0.1.10", default-features = false }
proj4wkt = "0.1.1"
