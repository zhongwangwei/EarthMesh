[package]
name = "earthmesh_mesh"
version = "0.1.0"
edition = "2021"
description = "Rust mesh kernels migrated from EarthMesh Fortran"
license = "MIT OR Apache-2.0"

[lib]
name = "earthmesh_mesh"
path = "src/lib.rs"

[dependencies]
earthmesh_core = { path = "../earthmesh_core" }

# This crate is a close migration of OLAM's Fortran mesh routines. These lints fire on
# patterns that deliberately mirror the Fortran source (multi-argument subroutine
# signatures, 1-based index loops over parallel connectivity arrays, flattened
# connectivity-table types). Allowed package-wide (lib + tests) for traceability.
[lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
