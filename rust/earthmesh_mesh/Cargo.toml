[package]
name = "earthmesh_mesh"
version = "3.0.0-alpha2"
edition = "2021"
description = "Rust mesh kernels current from EarthMesh"
license = "GPL-2.0-only"
repository = "https://github.com/zhongwangwei/EarthMesh"

[lib]
name = "earthmesh_mesh"
path = "src/lib.rs"

[dependencies]
earthmesh_core = { path = "../earthmesh_core" }
rayon = "1"
serde = { version = "1", features = ["derive"] }

# Numeric kernels retain algorithm-shaped data flow (multi-argument routines,
# 1-based loops over parallel connectivity arrays, and flattened connectivity
# tables), so these lints are allowed package-wide for the library and tests.
[lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
