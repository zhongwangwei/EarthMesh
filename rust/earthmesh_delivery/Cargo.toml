[package]
name = "earthmesh_delivery"
version = "3.0.0-alpha5"
edition = "2021"
description = "EarthMesh output layer: gridfile mesh types, NetCDF read/write and gridfile records"
license = "GPL-2.0-only"
repository = "https://github.com/zhongwangwei/EarthMesh"

[dependencies]
earthmesh_core = { path = "../earthmesh_core" }
earthmesh_geometry = { path = "../earthmesh_geometry" }
earthmesh_hfield = { path = "../earthmesh_hfield" }
earthmesh_mesh = { path = "../earthmesh_mesh" }
earthmesh_quality = { path = "../earthmesh_quality" }
hdf5-sys = { package = "hdf5-metno-sys", version = "0.11.1" }
netcdf = { version = "0.12.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Forwarded by earthmesh_cli's static-netcdf.
static-netcdf = ["netcdf/static"]

# Same allowances as earthmesh_cli, whose writers moved here: algorithm-shaped
# index loops and multi-argument routines are kept as written.
[lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
